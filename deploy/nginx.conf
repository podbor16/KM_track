worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    # Увеличено для длинного punycode-домена startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai
    # (добавлен 2026-08-25) — со стандартным размером nginx не мог построить
    # server_names_hash (ошибка "could not build server_names_hash,
    # you should increase server_names_hash_bucket_size").
    server_names_hash_bucket_size 128;

    # http2 на всех listen 443 (2026-08-20) — раньше был чистый HTTP/1.1,
    # ограничивающий браузер ~6 одновременными соединениями на домен;
    # одна загрузка /start_list или /results — это ~20 запросов (HTML,
    # CSS/JS/шрифты/фавиконки, пара API-вызовов) ПЛЮС долгоживущий SSE
    # (/api/sse/notify), который держит одно из 6 соединений открытым, пока
    # вкладка открыта. Реальная жалоба пользователей ("очень долго
    # грузится, помогает переключение вкладок", "у кого-то не грузится
    # вовсе", "без VPN не открывался") — классический симптом очереди из
    # HTTP/1.1-соединений, усугублённой троттлингом фоновых вкладок в
    # браузере и лишней задержкой на каждый round-trip через VPN. HTTP/2
    # мультиплексирует все запросы в одно TCP-соединение — очереди не
    # будет. nginx 1.24 — синтаксис `ssl http2` на listen, не отдельная
    # директива `http2 on;` (та появилась только в 1.25.1+).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # По умолчанию nginx режет тело запроса на 1MB — реальные Excel/CSV
    # выгрузки (результаты забегов, импорт заявок из Tilda) легко больше.
    client_max_body_size 20m;

    # Системный mime.types не знает .ttf/.otf/.woff/.woff2 — все шрифты
    # проекта (Houschka на Красмарафоне, Onest на Siberman) отдавались как
    # application/octet-stream. Chrome грузит @font-face и так, но Safari/
    # старый Firefox могут быть строже к MIME при sniffing — types{} здесь
    # ДОПОЛНЯЕТ уже включённый mime.types (не перезаписывает), один раз на
    # все домены/продукты, без дублирования по location /static/ блокам.
    types {
        font/ttf    ttf;
        font/otf    otf;
        font/woff   woff;
        font/woff2  woff2;
    }

    # При нагрузочном тесте с одной машины VU шлют уникальный X-Forwarded-For.
    # Реальные пользователи заголовок не ставят → используется их реальный IP.
    map $http_x_forwarded_for $rate_limit_key {
        default $http_x_forwarded_for;
        ""      $binary_remote_addr;
    }

    limit_req_zone $rate_limit_key zone=api:10m rate=30r/s;
    limit_conn_zone $rate_limit_key zone=addr:10m;

    # analytics.krasmarafon.ru — старый домен, 2026-08-19 переключён на
    # редирект на results.krasmarafon.ru (см. server-блок ниже — results
    # теперь основной домен, оба обслуживают одно и то же приложение).
    # Полный набор location'ов (static/live/SSE/domain-isolation) удалён
    # отсюда — он больше не нужен, всё живёт в блоке results.
    #
    # Временное исключение для /webhook/tilda/ (пока URL вебхука в Tilda не
    # был переключён на новый домен) убрано — URL обновлён вручную в панели
    # Tilda, проверено, что новый домен принимает вебхук корректно.
    server {
        listen 80;
        server_name analytics.krasmarafon.ru;
        return 301 https://results.krasmarafon.ru$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name analytics.krasmarafon.ru;

        ssl_certificate     /etc/letsencrypt/live/analytics.krasmarafon.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/analytics.krasmarafon.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://results.krasmarafon.ru$request_uri;
    }

    # ---- results.krasmarafon.ru (новый домен вместо analytics.krasmarafon.ru,
    # 2026-08-19) — тот же самый backend/приложение, что и analytics выше,
    # поэтому 443-блок ниже — точный дубликат: те же location'ы (включая
    # изоляцию чужих путей Siberman/Triatleta), те же access/error логи
    # (общий сервис, не отдельный). Сертификат выпущен через
    # deploy/ssh_ssl.py (certbot certonly --webroot, см. порт-80 блок ниже). ----
    server {
        listen 80;
        server_name results.krasmarafon.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name results.krasmarafon.ru;

        ssl_certificate     /etc/letsencrypt/live/results.krasmarafon.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/results.krasmarafon.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # GPX-треки грузятся фронтом по фиксированному пути без ?v=,
        # поэтому не могут кэшироваться неделю — иначе замена трека не подтягивается
        location ~* \.gpx$ {
            root /opt/km_track;
            expires -1;
            add_header Cache-Control "no-cache";
        }

        # Статика напрямую через Nginx (быстрее, не нагружает Python)
        # immutable убран: ?v=<git-hash> меняется с каждым деплоем и вытесняет кэш
        location /static/ {
            alias /opt/km_track/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            gzip_static on;
        }

        # Live-JSON топ-10 по отметкам для трансляции (Жара) — обновляется
        # каждые несколько секунд во время гонки load_race_results.py
        # --continuous, поэтому НЕ должен попадать под 7-дневный кэш
        # /static/ выше (иначе режиссёр трансляции будет получать
        # недельной давности данные вместо реального времени).

        # Режиссёр трансляции уже захардкодил в своей системе старый
        # тестовый URL (test_vesna_5km_top10.json, из первоначальной
        # обкатки фичи на Весне 2026-08-18) — вместо того чтобы просить
        # поменять ссылку, отдаём по этому же пути актуальные данные
        # Жары. Exact-match location имеет приоритет над префиксным /live/
        # ниже независимо от порядка в файле. Один и тот же URL обслуживает
        # ОБЕ дистанции Жары по очереди — 5км (22.08) и 21.1км (23.08),
        # т.к. загрузчики никогда не работают одновременно (5км
        # останавливается перед стартом 21.1км), поэтому оба
        # config/loader/zhara_*.env пишут в один и тот же общий файл
        # zhara_top10.json — менять nginx/URL в день гонки не нужно.
        location = /live/test_vesna_5km_top10.json {
            alias /opt/km_track/live_data/zhara_top10.json;
            add_header Cache-Control "no-store";
        }

        location /live/ {
            alias /opt/km_track/live_data/;
            add_header Cache-Control "no-store";
        }

        # Домены-проекты изолированы друг от друга (см. комментарий в
        # server-блоке analytics.krasmarafon.ru выше) — тот же allow-list
        # здесь, results.krasmarafon.ru обслуживает то же приложение.
        location /api/siberman { return 404; }
        location /24h { return 404; }
        location /api/tri { return 404; }
        location /participant { return 404; }

        # SSE — отключаем буферизацию, большой таймаут
        location /api/sse/ {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            limit_conn addr 50;
        }

        # Живой SSE-поток метрик мониторинга (/admin → вкладка «Мониторинг»)
        # — вне /api/sse/, поэтому без этого блока попадал бы под общий
        # location / и буферизовался nginx: живые данные на дашборде не
        # доходили бы до браузера вовремя (обнаружено 2026-08-20 живой
        # проверкой на проде — на dev-сервере без nginx это не видно).
        location /api/admin/metrics/live {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            limit_conn addr 50;
        }

        # Всё остальное → FastAPI
        # no-store: запрещаем Telegram WebView и другим браузерам кэшировать HTML
        location / {
            proxy_pass          http://127.0.0.1:8000;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            proxy_connect_timeout 10s;
            add_header          Cache-Control "no-store";
            gzip                on;
            gzip_types          text/plain application/json text/css application/javascript;
            gzip_min_length     500;
            limit_req zone=api burst=50 nodelay;
        }

        # Логи — общие с analytics.krasmarafon.ru (тот же сервис)
        access_log /var/log/nginx/km_track_access.log;
        error_log  /var/log/nginx/km_track_error.log;
    }

    # ---- startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai (Krasnoyarskie Mosty
    # startlist, отдельный независимый проект, Flask+SQLite, deploy/setup.sh,
    # добавлено 2026-08-25). ВНИМАНИЕ: этот блок уже пропадал из nginx.conf
    # минимум ДВАЖДЫ (2026-09-02, 2026-09-03) — deploy/ssh_nginx_reload.py
    # в репозитории KM_track делает `cp deploy/nginx.conf /etc/nginx/nginx.conf`,
    # то есть полностью перезаписывает общий файл своей локальной копией,
    # которая не знает про этот блок. Если вебхук снова начнёт редиректить на
    # results.krasmarafon.ru — сначала проверить, не пропал ли этот блок. ----
    server {
        listen 80;
        server_name startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai;

        ssl_certificate     /etc/letsencrypt/live/startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/startlist.xn--80aaa4afdbsfgegqdfhd5dxl.xn--p1ai/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass          http://127.0.0.1:8811;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_max_temp_file_size 0;
            proxy_buffers       16 16k;
            proxy_buffer_size   16k;
        }

        access_log /var/log/nginx/startlist_access.log;
        error_log  /var/log/nginx/startlist_error.log;
    }

    # ---- live-race.triatleta.ru ----
    server {
        listen 80;
        server_name live-race.triatleta.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name live-race.triatleta.ru;

        ssl_certificate     /etc/letsencrypt/live/live-race.triatleta.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/live-race.triatleta.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /static/ {
            alias /opt/km_track/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Корень — страница выбора гонки (race_triatleta/index.html,
        # domain-aware в pages.py:GET /). Отдельный exact-match блок: паттерн
        # "^/(...)" ниже не может включать голый "/" без риска случайно
        # смэтчить вообще все пути.
        location = / {
            proxy_pass          http://127.0.0.1:8000;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            add_header          Cache-Control "no-store";
        }

        # Только пути Triatleta — остальное (в т.ч. Красмарафон/Siberman)
        # изолировано (найдено пользователем 2026-07-24, см. комментарий
        # в server-блоке analytics.krasmarafon.ru выше).
        # no-store: запрещаем Telegram WebView кэшировать HTML
        location ~ ^/(24h|api/tri|duathlon222|api/duathlon222) {
            proxy_pass          http://127.0.0.1:8000;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            add_header          Cache-Control "no-store";
            gzip                on;
            gzip_types          text/plain application/json text/css application/javascript;
            gzip_min_length     500;
        }

        location / { return 404; }
    }

    # ---- live.siberman515.com ----
    server {
        listen 80;
        server_name live.siberman515.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name live.siberman515.com;

        ssl_certificate     /etc/letsencrypt/live/live.siberman515.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/live.siberman515.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /static/ {
            alias /opt/km_track/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Корень — короткая публичная ссылка на результаты (domain-aware в
        # Python, pages.py:GET /). Отдельный exact-match блок: паттерн
        # "^/(...)" ниже не может включать голый "/" без риска случайно
        # смэтчить вообще все пути.
        location = / {
            proxy_pass          http://127.0.0.1:8000;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            add_header          Cache-Control "no-store";
            gzip                on;
            gzip_types          text/plain application/json text/css application/javascript;
            gzip_min_length     500;
        }

        # Пути Siberman — API (/api/siberman) плюс короткие HTML-страницы
        # /admin, /login, /logout, /participant/{bib}, /siberman/test(/participant/{bib})
        # — тестовая копия публичной страницы (domain-aware в Python — см.
        # pages.py и src/siberman/router.py). Остальное (в т.ч.
        # Красмарафон/Triatleta) изолировано (найдено пользователем
        # 2026-07-24, см. комментарий в server-блоке analytics.krasmarafon.ru
        # выше; /siberman/test добавлен 2026-08-05).
        location ~ ^/(api/siberman|admin|login|logout|participant/|siberman/test) {
            proxy_pass          http://127.0.0.1:8000;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            add_header          Cache-Control "no-store";
            gzip                on;
            gzip_types          text/plain application/json text/css application/javascript;
            gzip_min_length     500;
        }

        location / { return 404; }

        access_log /var/log/nginx/siberman_access.log;
        error_log  /var/log/nginx/siberman_error.log;
    }
}
