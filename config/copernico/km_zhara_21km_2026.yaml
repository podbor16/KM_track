description: >
  Жара 21.1 км, race_id --2026-6118 (общий с Жарой 5км и Детским
  забегом — подтверждено). Само событие в Copernico организатором ещё
  не создано (все проверенные варианты event живым fetch дают 0
  участников) — checkpoint_fields пока пустой, реальные имена полей не
  подтверждены. Заполнить через "python scripts/prerace_check.py
  --config config/events/zhara.yaml --distance '21.1 км' --inspect",
  когда организатор создаст event и появятся данные. Ожидаемые КТ
  (checkpoint_distances в zhara.yaml): 5.0, 6.0, 10.55, 14.65, 15.65,
  20.2 км — 6 точек между стартом и финишем.

fields:
  bib: dorsal
  surname: surname
  name: name
  birthdate: birthdate
  gender: gender
  status: status
  category: category

time_fields:
  gun_start:   "times.official_:::start:::"
  gun_finish:  "times.official_:::finish:::"
  chip_start:  null
  chip_finish: null

checkpoint_fields: {}
