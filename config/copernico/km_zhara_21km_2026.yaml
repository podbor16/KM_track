  --distance '21.1 км' --inspect", когда race_id/event появятся.
  Ожидаемые КТ (checkpoint_distances в zhara.yaml): 5.0, 6.0, 10.55,
  14.65, 15.65, 20.2 км — 6 точек между стартом и финишем.

