description: >
  Жара 21.1 км, race_id --2026-6118, event "21.1km" — подтверждено
  живым fetch 2026-08-21 (20 участников, частичная выгрузка). Пресет
  km_zhara_21km_2026 в Copernico пока отдаёт только старт/финиш плюс
  те же 2,5/4,5 км, что и у 5км (times.official_2,5 / _4,5) — похоже,
  чекпоинты 21.1 км судейская команда ещё не донастроила на своей
  стороне. checkpoint_fields намеренно пустой — реальных полей под 6
  промежуточных точек (5.0/6.0/10.55/14.65/15.65/20.2 км,
  checkpoint_distances в zhara.yaml) в ответе API пока нет. Проверить
  через "python scripts/prerace_check.py --config config/events/zhara.yaml
  --distance '21.1 км' --inspect" ближе к старту 2026-08-23 — если поля
  так и не появятся, live-трекер 21.1 км будет работать только по
  старту/финишу, без промежуточных отметок.

fields:
