description: >
  Дуатлон 222 2026. Один event на всю гонку (подтверждено). Один массовый
  старт, личное непрерывное время: run1 -> T1 -> bike -> T2 -> run2.
  Пресет "222_2026" создан пользователем в Copernico UI 2026-09-03.
  Участник-поля ниже ПОДТВЕРЖДЕНЫ живым fetch (2026-09-03, 15 реальных
  участников). Поля тайминга (stage_fields/stage_lap_fields) — ещё
  ДОГАДКА: живой ответ не содержал ни одного "times.*"-ключа, т.к. гонка
  ещё не стартовала (все status="notstarted") — неясно, отдаёт ли
  Copernico ключ с null до первой реальной отметки, или пропускает вовсе
  (sparse JSON). Проверить после первой тестовой/реальной отметки — см.
  docs/superpowers/plans/2026-08-24-duathlon-222.md Task 0.

fields:
  start_number: dorsal    # подтверждено 2026-09-03
  surname: surname        # подтверждено
  name: name              # подтверждено
  gender: gender          # подтверждено — 'male'/'female', нормализуется загрузчиком в M/F
  status: status          # подтверждено — 'notstarted' у всех сейчас

# Кумулятивное время (мс от общего старта гонки) на финише каждого этапа.
# Имена полей — ДОГАДКА по типовой конвенции Copernico для мультиспорта,
# ОБЯЗАТЕЛЬНО проверить реальным запросом API перед использованием.
stage_fields:
  run1: "times.official_run1"
  bike: "times.official_bike"
  run2: "times.official_finish"

# Круги внутри каждого этапа (подтверждено пользователем 2026-09-02: 4x2.5км
# бег-1, 42x4.04км вело, 12x3.5км бег-2). Имена полей — ДОГАДКА по аналогии с
# tri_24h_2026.yaml ("times.official_{n}kr"), префикс этапа добавлен, чтобы не
# столкнуться с чужими полями внутри одного event — ОБЯЗАТЕЛЬНО проверить.
stage_lap_fields:
  run1: {count: 4,  pattern: "times.official_run1_{n}kr"}
  bike: {count: 42, pattern: "times.official_bike_{n}kr"}
  run2: {count: 12, pattern: "times.official_run2_{n}kr"}

# Т1 (бег-1 -> вело) и Т2 (вело -> бег-2) — ДЛИТЕЛЬНОСТЬ транзита (мс),
# не кумулятивная отметка. Учитываются в общем времени гонки (уже внутри
# run2_s), но вычитаются из "чистого" времени соседних этапов. Имена полей —
# ДОГАДКА, ОБЯЗАТЕЛЬНО проверить реальным запросом API.
transition_fields:
  t1: "times.t1"
  t2: "times.t2"
