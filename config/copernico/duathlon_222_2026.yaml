description: >
  Дуатлон 222 2026. Один event на всю гонку. Один массовый старт, личное
  непрерывное время: run1 -> T1 -> bike -> T2 -> run2. Пресет "222_2026"
  создан пользователем в Copernico UI 2026-09-03, поля тайминга добавлены и
  СОХРАНЕНЫ 2026-09-04 (до этого пресет отдавал только 12 identity-полей без
  единого "times.*" — правки в редакторе Copernico не были опубликованы).
  Все имена полей ниже подтверждены живым fetch 2026-09-04, разобраны кодом
  (не на глаз — избегаем опечаток транскрипции). Гонка круговая на всех
  этапах, но Copernico называет отметки НЕ по номеру круга ("{n}"), а по
  РЕАЛЬНОЙ измеренной кумулятивной дистанции трассы — числа НЕ равномерны
  (см. комментарии у каждого списка), пришлось перечислить точные строки,
  не шаблон.

fields:
  start_number: dorsal    # подтверждено 2026-09-03
  surname: surname        # подтверждено
  name: name              # подтверждено
  gender: gender          # подтверждено — 'male'/'female', нормализуется загрузчиком в M/F
  status: status          # подтверждено — 'notstarted' у всех до старта

# Финиш этапа ЦЕЛИКОМ — отдельное поле от кругов, даже там где казалось бы
# последний круг и есть финиш. Для Бег-1 последний круг равномерной
# последовательности через 1.25км — "9,98 km" (реальная измеренная
# дистанция), но НАСТОЯЩИЙ финиш — отдельное круглое "10 km" (подтверждено
# пользователем 2026-09-04, приоритет круглому числу над "точной" меньшей
# отметкой). Для Вело — "b170-start_T2" (то же значение служит и стартом Т2).
# Для Бег-2 — специальное поле Copernico ":::finish:::" (финиш всей гонки).
stage_fields:
  run1: "times.official_10 km"
  bike: "times.official_b170-start_T2"
  run2: "times.official_:::finish:::"

# Старт-маркеры для расчёта ДЛИТЕЛЬНОСТИ Т1/Т2 — Copernico не отдаёт
# готовую длительность транзита отдельным полем, только кумулятивные
# отметки; длительность = стартовый маркер минус финиш предыдущего этапа
# (stage_fields выше), считается в загрузчике (load_duathlon_results.py).
transition_fields:
  t1_start: "times.official_bike0"                    # конец Т1 = начало вело (км 0)
  t2_start: "times.official_finish_T2-start_R2"        # конец Т2 = начало бег-2

# Круги внутри каждого этапа — ТОЧНЫЕ строки как отдаёт Copernico (не
# шаблон "{n}" — реальные имена не равномерны, есть опечатки/особенности
# ввода: "9,98 km" через запятую вместо точки как у остальных Бег-1 марок,
# "times.official_ 5 km" — с ведущим пробелом внутри имени поля).
#
# Бег-1 (8 отметок через 1.25км — включает середины кругов, по решению
# пользователя 2026-09-04: вдвое больше точек прогресса, чем 4 "круга"
# 2.5км). Финиш ("10 km") — отдельно в stage_fields, не в этом списке.
#
# Вело (42 отметки — ровно число кругов). ВАЖНО: первая отметка на 3.4км,
# а не на 4.04км — короткий "пролог" от старта вело до первой мачты
# подсчёта кругов, все последующие круги ровно по 4.04км (см.
# STAGE_LAP_OFFSET в src/duathlon222/service.py, учитывает это смещение).
#
# Бег-2 (24 отметки, в МЕТРАХ — единственный этап без "km" в имени поля,
# загрузчик делит на 1000 при парсинге distance, не при парсинге времени).
# Включает середины кругов, как и Бег-1. Финиш (":::finish:::") — отдельно
# в stage_fields.
stage_lap_fields:
  run1:
    - "times.official_1.25 km"
    - "times.official_2.5 km"
    - "times.official_3.75 km"
    - "times.official_ 5 km"
