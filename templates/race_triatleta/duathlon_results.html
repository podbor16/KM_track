<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуатлон 222 — Live результаты</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon_tri_dark.ico" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon_tri_light.ico" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tri_results.css?v={{ v }}">
</head>
<body>
    <div class="tri-header">
        <div>
            <div class="tri-header__eyebrow">Triatleta · Дуатлон 222</div>
            <div class="tri-header__title">Дуатлон 222<br>05 сентября 2026</div>
            <div class="tri-header__meta">Красноярск · Бег 10 км → Вело 170 км → Бег 42 км</div>
        </div>
        <div class="tri-elapsed-wrap">
            <div class="tri-elapsed-label" id="elapsed-label">До старта</div>
            <div class="tri-elapsed" id="elapsed">—</div>
        </div>
    </div>

    <!-- Фильтры -->
    <div class="tri-toolbar">
        <div class="tri-filter-group">
            <label class="tri-label">Пол:</label>
            <select id="filter-gender" class="tri-select" onchange="loadStandings()">
                <option value="">Все</option>
                <option value="M">Мужчины</option>
                <option value="F">Женщины</option>
            </select>
        </div>
        <div class="tri-filter-group">
            <input type="search" id="filter-search" class="tri-search"
                   placeholder="Поиск по фамилии"
                   oninput="renderFiltered()" onkeydown="if(event.key==='Enter')renderFiltered()">
        </div>
        <span class="tri-results-count" id="results-count"></span>
    </div>

    <div class="tri-container">
        <div class="tri-table-wrap">
            <table class="tri-table">
                <thead>
                    <tr>
                        <th class="tri-rank">Место</th>
                        <th class="tri-bib">Номер</th>
                        <th>Участник</th>
                        <th>Этап</th>
                        <th>Бег-1<br><span style="font-weight:400">10 км</span></th>
                        <th>Вело<br><span style="font-weight:400">170 км</span></th>
                        <th>Бег-2<br><span style="font-weight:400">42 км</span></th>
                        <th>Итого</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="standings-body">
                    <tr><td colspan="9" style="text-align:center;color:var(--tri-muted);padding:24px">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="tri-refresh" id="refresh-label"></div>
    </div>

    <script>
    const YEAR = {{ year|tojson }};
    const GUN_UTC_MS = new Date('2026-09-05T00:00:00Z').getTime(); // 07:00 Красноярск, подтверждено 2026-09-03
    let allStandings = [];

    function updateElapsed() {
        const diff = Date.now() - GUN_UTC_MS;
        const ms = Math.abs(diff);
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const str = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        document.getElementById('elapsed').textContent = str;
        document.getElementById('elapsed-label').textContent = diff < 0 ? 'До старта' : 'Прошло';
    }
    setInterval(updateElapsed, 1000);
    updateElapsed();

    function fmtS(totalSeconds) {
        if (totalSeconds === null || totalSeconds === undefined) return '—';
        const s = Math.max(0, Math.floor(totalSeconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    }

    const STATUS_LABEL = {
        active: 'На дистанции',
        finished: 'Финишировал',
        dnf: 'DNF',
        dsq: 'DSQ',
    };

    const STAGE_LABEL = {
        run1: 'Бег-1',
        bike: 'Вело',
        run2: 'Бег-2',
        finished: 'Финиш',
    };

    // Живые часы «сколько уже на текущем этапе» — обновляются раз в сек без
    // перезапроса standings (data-start-s — кумулятивный старт этапа от
    // общего выстрела, посчитан на бэкенде вместе со standings).
    function tickStageTimers() {
        const nowElapsedS = (Date.now() - GUN_UTC_MS) / 1000;
        document.querySelectorAll('.stage-timer').forEach(el => {
            const startS = parseFloat(el.dataset.startS);
            el.textContent = fmtS(Math.max(0, nowElapsedS - startS));
        });
    }
    setInterval(tickStageTimers, 1000);

    function stageCell(timeS, speedKmh) {
        if (timeS === null || timeS === undefined) {
            return '<span style="color:var(--tri-muted)">—</span>';
        }
        const speedStr = speedKmh
            ? `<br><span style="font-size:11px;color:var(--tri-muted)">${speedKmh.toFixed(1)} км/ч</span>`
            : '';
        return `<span style="font-variant-numeric:tabular-nums">${fmtS(timeS)}</span>${speedStr}`;
    }

    // Абсолютное время по часам для elapsed-от-старта секунд (прогноз финиша)
    function fmtClock(elapsedFromGunS) {
        const d = new Date(GUN_UTC_MS + elapsedFromGunS * 1000);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function stageColumnCell(r) {
        const label = STAGE_LABEL[r.current_stage] || r.current_stage;
        if (r.current_stage === 'finished' || r.current_stage_start_s === null) {
            return `<span class="stage-badge">${label}</span>`;
        }
        const lapStr = r.current_stage_lap
            ? `<br><span style="font-size:11px;color:var(--tri-muted)">круг ${r.current_stage_lap}/${r.current_stage_lap_total}</span>`
            : '';
        const forecastStr = r.forecast_stage_finish_s != null
            ? `<br><span style="font-size:11px;color:var(--tri-accent)" title="Прогноз финиша этапа">~${fmtClock(r.forecast_stage_finish_s)}</span>`
            : '';
        return `<span class="stage-badge">${label}</span><br>` +
               `<span class="stage-timer" data-start-s="${r.current_stage_start_s}" ` +
               `style="font-size:11px;color:var(--tri-muted);font-variant-numeric:tabular-nums">--:--:--</span>` +
               lapStr + forecastStr;
    }

    async function loadStandings() {
        const gender = document.getElementById('filter-gender').value;
        try {
            const base = `/api/duathlon222_${YEAR}/standings`;
            const url = gender ? `${base}?gender=${gender}` : base;
            const r = await fetch(url);
            const data = await r.json();
            allStandings = data.standings || [];
            renderFiltered();
            document.getElementById('refresh-label').textContent =
                `Обновлено: ${new Date().toLocaleTimeString('ru-RU')}`;
        } catch(e) { console.error('standings error', e); }
    }

    function renderFiltered() {
        const search = document.getElementById('filter-search').value.trim().toLowerCase();
        const rows = allStandings.filter(r => !search || (r.surname || '').toLowerCase().includes(search));
        document.getElementById('results-count').textContent = rows.length ? `${rows.length} участн.` : '';
        renderStandings(rows);
    }

    function renderStandings(rows) {
        const tbody = document.getElementById('standings-body');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--tri-muted);padding:24px">Нет данных</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(r => {
            const isOut = r.status === 'dnf' || r.status === 'dsq';
            const rowStyle = `cursor:pointer;${isOut ? 'opacity:.55' : ''}`;
            return `<tr style="${rowStyle}" onclick="location.href='/duathlon222_${YEAR}/participant/${r.start_number}'">
                <td class="tri-rank">${r.rank}</td>
                <td class="tri-bib">${r.start_number}</td>
                <td><span class="tri-name">${r.surname} ${r.name}</span></td>
                <td>${stageColumnCell(r)}</td>
                <td>${stageCell(r.run1_s, r.run1_speed_kmh)}</td>
                <td>${stageCell(r.bike_s, r.bike_speed_kmh)}</td>
                <td>${stageCell(r.run2_s, r.run2_speed_kmh)}</td>
                <td style="font-variant-numeric:tabular-nums;font-weight:700">${fmtS(r.total_s)}</td>
                <td>${STATUS_LABEL[r.status] || r.status}</td>
            </tr>`;
        }).join('');
        tickStageTimers();
    }

    loadStandings();
    setInterval(loadStandings, 30000);
    </script>
</body>
</html>
