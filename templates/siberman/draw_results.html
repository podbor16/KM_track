<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siberman {{ year }} — Жеребьёвка: зачёты</title>
<link rel="icon" href="/static/images/siberman/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/images/siberman/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/static/css/siberman-draw.css?v={{ v }}">
</head>
<body>
<div class="draw">
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="men">Мужчины</button>
    <button class="tab" data-cat="women">Женщины</button>
    <button class="tab" data-cat="relay">Эстафеты</button>
  </div>
  <div class="legend">⏳ ожидает оплаты · ✅ оплачено · ❌ не оплачено</div>
  <table><tbody id="rows"><tr><td class="state-msg">Загрузка…</td></tr></tbody></table>
</div>
<script src="/static/js/siberman-draw-public.js?v={{ v }}"></script>
<script>
const YEAR = {{ year }};
let cat = 'men', state = null;
document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => {
  cat = b.dataset.cat;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('active', x === b));
  render();
}));
function sectionRow(cls, text) { return `<tr class="section-row ${cls}"><td colspan="3">${text}</td></tr>`; }
function personRow(r) {
  const just = r.is_last ? '<span class="just">только что</span>' : '';
  return `<tr class="${r.is_last ? 'is-last' : ''}"><td class="num">${r.position}</td><td>${drawEscape(r.surname + ' ' + r.name)}${just}</td><td class="pay">${r.status}</td></tr>`;
}
function render() {
  if (!state) return;
  const rows = state.lists[cat], cap = state.capacities[cat];
  let html = '';
  if (cap == null) {
    html = rows.length ? rows.map(personRow).join('') : '<tr><td class="state-msg">Жеребьёвка ещё не началась</td></tr>';
  } else {
    html += sectionRow('', `Победители · ${cap} мест`);
    for (let i = 1; i <= cap; i++) {
      const r = rows[i - 1];
      html += r ? personRow(r) : `<tr class="empty"><td class="num">${i}</td><td>—</td><td class="pay"></td></tr>`;
    }
    const wait = rows.slice(cap);
    if (wait.length) html += sectionRow('waitlist', 'Лист ожидания') + wait.map(personRow).join('');
  }
  document.getElementById('rows').innerHTML = html;
}
drawPoll(YEAR, s => { state = s; render(); });
</script>
</body>
</html>
