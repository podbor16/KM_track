<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siberman — Загрузка результатов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f7f7f7; font-family: system-ui, sans-serif; color: #1a1a1a; }
        .header { background: #1a1a1a; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .container { max-width: 900px; margin: 32px auto; padding: 0 24px; }
        .card { background: #fff; border-radius: 8px; padding: 28px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input[type=file], input[type=number] { display: block; width: 100%; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
        .btn { display: inline-block; padding: 10px 24px; border-radius: 6px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #c0392b; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-disabled { background: #ccc; color: #fff; pointer-events: none; }
        #preview { display: none; }
        #preview table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #preview th { text-align: left; padding: 8px 12px; background: #f0f0f0;
            border-bottom: 2px solid #ddd; font-weight: 600; }
        #preview td { padding: 8px 12px; border-bottom: 1px solid #eee; }
        .status-dnf { color: #c0392b; font-weight: 600; }
        .status-active { color: #27ae60; }
        .msg { padding: 12px 16px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; }
        .msg-error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c2; }
        .msg-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px">Siberman 515</div>
            <h1>Загрузка результатов</h1>
        </div>
    </div>

    <div class="container">
        <div class="msg msg-error" id="msg-error"></div>
        <div class="msg msg-success" id="msg-success"></div>

        <div class="card">
            <h2>1. Загрузить файл Excel</h2>
            <label>Год гонки</label>
            <input type="number" id="race-year" value="2025" min="2020" max="2030" style="width:120px">
            <label>Время старта гонки (день 1, плавание, по красноярскому времени)</label>
            <input type="time" id="race-start" value="08:00" step="1" style="width:120px" required>
            <label>Файл (.xlsx)</label>
            <input type="file" id="file-input" accept=".xlsx,.xls">
            <button class="btn btn-primary" id="btn-upload">Загрузить и проверить</button>
        </div>

        <div class="card" id="preview">
            <h2>2. Проверить данные</h2>
            <p id="preview-summary" style="font-size:14px;color:#555;margin-bottom:16px"></p>
            <table>
                <thead>
                    <tr>
                        <th>Номер</th><th>Участник</th><th>Пол</th>
                        <th>Формат</th><th>Статус</th><th>ЧКП</th>
                    </tr>
                </thead>
                <tbody id="preview-body"></tbody>
            </table>
        </div>

        <div class="card" id="starts-card" style="display:none">
            <h2>Расчётный старт вело-2 (по рангу вело-1)</h2>
            <table>
                <thead>
                    <tr><th>Номер</th><th>Участник</th><th>Старт</th></tr>
                </thead>
                <tbody id="starts-body"></tbody>
            </table>
        </div>

        <div class="card" id="apply-card" style="display:none">
            <button class="btn btn-success" id="btn-apply">Применить в БД</button>
        </div>
    </div>

    <script>
    const $ = id => document.getElementById(id);
    const showErr = msg => { $('msg-error').textContent = msg; $('msg-error').style.display='block'; $('msg-success').style.display='none'; };
    const showOk  = msg => { $('msg-success').textContent = msg; $('msg-success').style.display='block'; $('msg-error').style.display='none'; };
    const hideMsg = () => { $('msg-error').style.display='none'; $('msg-success').style.display='none'; };

    $('btn-upload').addEventListener('click', async () => {
        const file = $('file-input').files[0];
        if (!file) { showErr('Выберите файл'); return; }
        const raceStart = $('race-start').value;
        if (!raceStart) { showErr('Укажите время старта гонки (день 1)'); return; }
        const year = $('race-year').value;
        const fd = new FormData();
        fd.append('file', file);
        $('btn-upload').textContent = 'Загружаю…';
        hideMsg();
        try {
            const r = await fetch(`/api/siberman/admin/upload?race_year=${year}&race_start=${raceStart}`, { method:'POST', body:fd });
            const data = await r.json();
            if (!r.ok) { showErr(data.detail || 'Ошибка'); return; }
            $('preview-summary').textContent =
                `Найдено участников: ${data.participant_count}. Год: ${data.race_year}.` +
                (data.errors.length ? ` Предупреждения: ${data.errors.length}` : '');
            const tbody = $('preview-body');
            tbody.innerHTML = '';
            for (const p of data.participants) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.bib}</td>
                    <td>${p.name}</td>
                    <td>${p.gender}</td>
                    <td>${p.format === 'relay' ? 'Эстафета' : 'Лично'}</td>
                    <td class="status-${p.status}">${p.status}</td>
                    <td>${p.cp_count}</td>`;
                tbody.appendChild(tr);
            }
            const startsBody = $('starts-body');
            startsBody.innerHTML = '';
            for (const s of (data.bike_day2_starts || [])) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${s.bib}</td><td>${s.name}</td><td>${s.start}</td>`;
                startsBody.appendChild(tr);
            }
            $('preview').style.display = 'block';
            $('starts-card').style.display = 'block';
            $('apply-card').style.display = 'block';
            showOk('Файл успешно разобран. Проверьте данные и нажмите «Применить».');
        } catch(e) {
            showErr('Сетевая ошибка: ' + e.message);
        } finally {
            $('btn-upload').textContent = 'Загрузить и проверить';
        }
    });

    $('btn-apply').addEventListener('click', async () => {
        const year = $('race-year').value;
        if (!confirm(`Применить данные за ${year}? Существующие данные за этот год будут удалены.`)) return;
        $('btn-apply').textContent = 'Сохраняю…';
        $('btn-apply').className = 'btn btn-disabled';
        hideMsg();
        try {
            const r = await fetch(`/api/siberman/admin/apply?race_year=${year}`, { method:'POST' });
            const data = await r.json();
            if (!r.ok) { showErr(data.detail || 'Ошибка БД'); return; }
            showOk(`Сохранено: ${data.participants} участников, ${data.checkpoint_times} чекпоинтов.`);
            $('preview').style.display = 'none';
            $('starts-card').style.display = 'none';
            $('apply-card').style.display = 'none';
        } catch(e) {
            showErr('Сетевая ошибка: ' + e.message);
        } finally {
            $('btn-apply').textContent = 'Применить в БД';
            $('btn-apply').className = 'btn btn-success';
        }
    });
    </script>
</body>
</html>
