<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siberman — спортсмен</title>
<link rel="icon" href="/static/images/siberman/favicon.ico" sizes="any">
<link rel="stylesheet" href="/static/css/siberman-hall.css?v={{ v }}">
<link rel="stylesheet" href="/static/css/siberman-nav.css?v={{ v }}">
</head>
<body>
{% with nav_section="rating", nav_detail=true, nav_theme=false, nav_timer=false %}{% include "siberman/site_nav.html" %}{% endwith %}
<div class="ath-top"><a href="/" data-siberman-back>← Результаты Siberman</a></div>
{% if found %}
<div class="hall ath" id="athlete" data-id="{{ slug }}"><div class="state-msg">Загрузка…</div></div>
<script src="/static/js/siberman-hall.js?v={{ v }}"></script>
<script src="/static/js/siberman-athlete.js?v={{ v }}"></script>
{% else %}
<div class="hall ath"><div class="state-msg">Спортсмен не найден — возможно, ссылка устарела.
  Найдите себя в <a href="/hall/rating">рейтинге Siberman</a>.</div></div>
{% endif %}
</body>
</html>
