<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siberman Ultra Triathlon — Результаты 2025</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Brand tokens ── */
        :root {
            --navy:   #003D62;
            --red:    #BE0A21;
            --blue:   #6AABD7;
            --white:  #FFFFFF;
            --radius: 8px;
        }

        /* ── Dark theme (default) ── */
        [data-theme="dark"] {
            --bg:       #071622;
            --bg2:      #0c2035;
            --bg3:      #112840;
            --border:   rgba(106,171,215,.18);
            --text:     #e4eef6;
            --muted:    #7aaabf;
            --accent:   var(--blue);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--blue);
            --logo-main:#FFFFFF;
            --logo-sub: var(--blue);
            --header-bg:var(--bg2);
            --dnf-op:   .45;
            --stat-val: var(--blue);
            --chart-context: rgba(106,171,215,.28);
        }

        /* ── Light theme ── */
        [data-theme="light"] {
            --bg:       #f0f5f9;
            --bg2:      #FFFFFF;
            --bg3:      #e4eef6;
            --border:   #b8d5e8;
            --text:     var(--navy);
            --muted:    #4f7f9b;
            --accent:   var(--navy);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--navy);
            --logo-main:var(--navy);
            --logo-sub: var(--red);
            --header-bg:var(--white);
            --dnf-op:   .4;
            --stat-val: var(--red);
            --chart-context: rgba(79,127,155,.28);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            transition: background .2s, color .2s;
        }

        /* ── Header ── */
        .header {
            background: var(--header-bg);
            border-bottom: 3px solid var(--red);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-block { display: flex; flex-direction: column; gap: 1px; }
        .logo-name {
            font-size: 22px; font-weight: 900; letter-spacing: 3px;
            text-transform: uppercase; color: var(--logo-main);
            line-height: 1;
        }
        .logo-name .m { color: var(--red); }
        .logo-tagline {
            font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
            text-transform: uppercase; color: var(--logo-sub);
        }
        .logo-dist {
            font-size: 9px; font-weight: 600; letter-spacing: 1.5px;
            color: var(--muted); margin-top: 1px;
        }
        .header-spacer { flex: 1; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .year-select {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); padding: 6px 10px; border-radius: var(--radius);
            font-size: 13px; cursor: pointer;
        }
        .theme-btn {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); width: 34px; height: 34px; border-radius: var(--radius);
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .theme-btn:hover { background: var(--border); }

        /* ── Tabs ── */
        .tabs-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 18px;
            font-size: 13px; font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: color .15s, border-color .15s;
            text-transform: uppercase;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }
        .tab .tab-dist { font-size: 10px; font-weight: 400; opacity: .7; margin-left: 4px; }
        .tabs-bar--sub { padding: 0 20px; background: var(--bg); }
        .tabs-bar--sub .tab { padding: 8px 14px; font-size: 11px; }

        /* ── Живой секундомер этапа(ов) ── */
        .stage-timers {
            display: flex; gap: 10px; flex-wrap: wrap;
            padding: 10px 20px; background: var(--bg3);
            border-bottom: 1px solid var(--border);
        }
        .stage-timer {
            display: flex; align-items: baseline; gap: 8px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 6px 14px;
        }
        .stage-timer-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
        .stage-timer-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); }
        .stage-timer--static .stage-timer-val { color: var(--text); font-size: 15px; }

        /* ── График ── */
        .chart-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px;
        }
        .chart-hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
        /* Больше высоты + отступы сверху/снизу канваса (п.9) — раньше линии
           у самой верхней/нижней границы визуально "обрезались". */
        .chart-canvas-wrap { position: relative; height: 520px; padding: 6px 0; }
        .chart-canvas-wrap--position { height: 560px; }
        @media (max-width: 640px) {
            .chart-canvas-wrap { height: 380px; }
            .chart-canvas-wrap--position { height: 420px; }
        }

        /* ── Сайдбар выбора участников для сравнения (п.7.2) ── */
        .chart-layout { display: flex; gap: 14px; align-items: flex-start; }
        .chart-main { flex: 1; min-width: 0; }
        .chart-sidebar {
            width: 220px; flex-shrink: 0;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg3); display: flex; flex-direction: column;
            max-height: 520px;
        }
        .chart-search {
            margin: 8px; padding: 6px 10px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--bg2); color: var(--text);
            font-size: 12px; outline: none;
        }
        .chart-search:focus { border-color: var(--blue); }
        .chart-participant-list { overflow-y: auto; flex: 1; padding: 0 4px 8px; }
        .chart-participant-item {
            display: flex; align-items: center; gap: 6px; padding: 5px 8px;
            font-size: 12px; border-radius: 6px; cursor: pointer;
        }
        .chart-participant-item:hover { background: var(--bg2); }
        .chart-participant-item input { accent-color: var(--red); cursor: pointer; }
        .chart-participant-item input:disabled ~ span { opacity: .4; }
        .chart-clear-btn, .chart-hint-sidebar {
            margin: 6px 8px 8px; font-size: 11px; text-align: center;
        }
        .chart-clear-btn {
            padding: 6px; border-radius: 20px; border: 1px solid var(--border);
            background: transparent; color: var(--muted); cursor: pointer;
        }
        .chart-clear-btn:hover { color: var(--text); border-color: var(--text); }
        .chart-hint-sidebar { color: var(--muted); }
        @media (max-width: 640px) {
            .chart-layout { flex-direction: column; }
            .chart-sidebar { width: 100%; max-height: 220px; }
        }

        /* ── Filters ── */
        .filters {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
        }
        .filter-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
        .filter-group { display: flex; gap: 4px; }
        .filter-btn {
            padding: 4px 12px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }
        .filter-btn:hover { color: var(--text); border-color: var(--text); }
        .filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

        /* ── Content ── */
        .content { padding: 16px 20px 48px; }

        /* ── Stats ── */
        .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px 16px;
        }
        .stat-val { font-size: 20px; font-weight: 800; color: var(--stat-val); }
        .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }

        /* ── Table ── */
        .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--bg2); }
        thead th {
            padding: 9px 10px; text-align: left;
            font-size: 10px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .6px; font-weight: 700;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            white-space: nowrap;
        }
        thead th.r { text-align: right; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--bg3); }
        tbody tr.dnf { opacity: var(--dnf-op); }
        /* Строка эстафетчика двухстрочная (имя + команда) — фиксируем
           высоту строки, чтобы совпадала с однострочной строкой личника. */
        table.stage-table tbody tr { height: 46px; }
        td { padding: 9px 10px; white-space: nowrap; }
        td.r { text-align: right; font-variant-numeric: tabular-nums; }

        /* Top-3 highlight */
        tbody tr.rank-1 { background: rgba(190,10,33,.07); }
        tbody tr.rank-2 { background: rgba(106,171,215,.06); }
        tbody tr.rank-3 { background: rgba(106,171,215,.04); }
        tbody tr.rank-1:hover, tbody tr.rank-2:hover, tbody tr.rank-3:hover { background: var(--bg3); }

        .rank-num { font-size: 13px; font-weight: 800; color: var(--rank-col); }
        .rank-1 .rank-num { color: var(--red); }
        .rank-sub { font-size: 10px; color: var(--muted); display: block; }
        .bib-cell { font-weight: 700; color: var(--muted); font-size: 12px; }
        .name-main { font-weight: 600; }
        .name-city { font-size: 11px; color: var(--muted); }
        .badge {
            display: inline-block; padding: 1px 7px; border-radius: 10px;
            font-size: 10px; font-weight: 700; letter-spacing: .3px;
        }
        .badge-m { background: rgba(0,61,98,.15); color: var(--navy); }
        [data-theme="dark"] .badge-m { background: rgba(106,171,215,.15); color: var(--blue); }
        .badge-f { background: rgba(190,10,33,.1); color: var(--red); }
        .badge-relay { background: rgba(106,171,215,.15); color: var(--blue); font-weight: 700; vertical-align: middle; }
        .badge-dnf  { background: rgba(190,10,33,.12);   color: var(--red); }
        .badge-dns  { background: rgba(120,120,130,.12); color: var(--muted); }
        .badge-dsq  { background: rgba(130,80,200,.12);  color: #a78bfa; }
        .badge-fin  { background: rgba(34,197,94,.12);   color: #22c55e; }
        .badge-live { background: rgba(106,171,215,.15); color: var(--blue); }
        .time-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
        .muted { color: var(--muted); }

        /* Stage icon dots in overall table */
        .stage-icon { font-size: 10px; color: var(--muted); white-space: nowrap; }

        /* ── Section header ── */
        .section-hdr {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
            color: var(--muted); padding: 20px 0 8px;
            border-bottom: 1px solid var(--border); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-hdr::after { content: ''; flex: 1; height: 1px; background: var(--border); display: block; }

        /* ── Empty / loading ── */
        .empty, .loading {
            padding: 60px 20px; text-align: center;
            color: var(--muted); font-size: 15px;
        }
        .loading::before { content: ''; display: block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            .header { padding: 10px 14px; }
            .logo-name { font-size: 18px; }
            .tabs-bar { padding: 0 14px; }
            .tab { padding: 10px 12px; font-size: 12px; }
            .filters { padding: 8px 14px; }
            .content { padding: 12px 14px 32px; }
            td, thead th { padding: 6px 6px; font-size: 11px; }
            thead th { font-size: 9px; }
            .name-main { font-size: 12px; }
            .name-city { font-size: 10px; }
            .rank-num { font-size: 12px; }
            .bib-cell { font-size: 11px; }
            .badge { font-size: 9px; padding: 1px 5px; }
            .time-cell { font-size: 11px; }
            .stat-val { font-size: 17px; }
            .stat-lbl { font-size: 9px; }
            .tabs-bar--sub { padding: 0 14px; }
            .tabs-bar--sub .tab { padding: 7px 10px; font-size: 11px; }
            .stage-timers { padding: 8px 14px; gap: 8px; }
            .stage-timer { padding: 5px 10px; }
            .stage-timer-lbl { font-size: 10px; }
            .stage-timer-val { font-size: 15px; }
        }
    </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
    <div class="logo-block">
        <div class="logo-name">SIBER<span class="m">M</span>AN</div>
        <div class="logo-tagline">Ultra Triathlon</div>
        <div class="logo-dist">10 KM SWIM · 421 KM BIKE · 84 KM RUN</div>
    </div>
    <div class="header-spacer"></div>
    <div class="header-controls">
        <select class="year-select" id="yearSelect" onchange="loadYear(this.value)">
            <option value="2025">2025</option>
        </select>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </div>
</div>

<!-- ── Живой секундомер этапа(ов) ── -->
<div class="stage-timers" id="stageTimers" style="display:none"></div>

<!-- ── Tabs ── -->
<div class="tabs-bar" id="tabs">
    <div class="tab active" data-tab="overall">Итоги гонки</div>
    <div class="tab" data-tab="swim">Плавание <span class="tab-dist">10 км</span></div>
    <div class="tab" data-tab="bike">Вело <span class="tab-dist">421 км</span></div>
    <div class="tab" data-tab="run">Бег <span class="tab-dist">84 км</span></div>
    <div class="tab" data-tab="day1">День 1 <span class="tab-dist">155 км</span></div>
    <div class="tab" data-tab="day2">День 1+2 <span class="tab-dist">431 км</span></div>
    <div class="tab" data-tab="chart">График</div>
    <div class="tab" data-tab="startlist">Старт Вело-2</div>
</div>
<!-- Подвкладки "Вело" — свод по обоим дням / по-дневная разбивка -->
<div class="tabs-bar tabs-bar--sub" id="bikeSubTabs" style="display:none">
    <div class="tab active" data-biketab="combined">Свод (оба дня)</div>
    <div class="tab" data-biketab="bike1">Вело День 1 <span class="tab-dist">145 км</span></div>
    <div class="tab" data-biketab="bike2">Вело День 2 <span class="tab-dist">276 км</span></div>
</div>
<!-- Подвкладки "График" — темп/скорость по этапу / позиция по всей гонке -->
<div class="tabs-bar tabs-bar--sub" id="chartSubTabs" style="display:none">
    <div class="tab active" data-charttab="pace">Темп/скорость</div>
    <div class="tab" data-charttab="position">Позиция</div>
</div>

<!-- ── Filters ── -->
<div class="filters">
    <span class="filter-label">Формат:</span>
    <div class="filter-group" id="fmtGroup">
        <button class="filter-btn active" data-fmt="all">Все</button>
        <button class="filter-btn" data-fmt="individual">Личный</button>
        <button class="filter-btn" data-fmt="relay">Эстафета</button>
    </div>
    <span class="filter-label" id="genderLabel">Пол:</span>
    <div class="filter-group" id="genderGroup">
        <button class="filter-btn active" data-gender="all">Все</button>
        <button class="filter-btn" data-gender="M">Мужчины</button>
        <button class="filter-btn" data-gender="F">Женщины</button>
    </div>
</div>

<!-- ── Content ── -->
<div class="content">
    <div class="loading" id="loading"></div>
    <div id="app" style="display:none"></div>
</div>

<script src="/static/lib/chart4/chart.umd.min.js"></script>
<script src="/static/js/siberman-common.js"></script>
<script>
/* ──────────────── State ──────────────── */
let _data = null;
let _tab = 'overall';
let _bikeSubTab = 'combined';
let _fmt = 'all';
let _gender = 'all';
let _year = 2025;
let _raceStartEpoch = null; // мс, из _data.race_start (ISO) — якорь для секундомеров этапов
let _chartSubTab = 'pace';
let _paceStage = 'swim';
let _paceChart = null;
let _positionChart = null;
// Мультивыбор для сравнения на графике (п.7.2/п.8) — объявлены на верхнем
// уровне (не внутри render-функций), поэтому переживают и render(), и
// периодический refreshData() без сброса; порядок в массиве = порядок
// добавления, от него зависит закреплённый цвет (см. chartCompareColor).
let _chartSelectedBibs = [];
let _chartSearchQuery = '';
let _lastChartDatasets = []; // для лёгкого обновления списка участников без пересборки графика

/* ──────────────── Theme ──────────────── */
siInitTheme();

/* ──────────────── Переход на страницу участника ──────────────── */
function participantLink(bib) {
    return `/siberman/participant/${bib}?year=${_year}`;
}

function buildStats(individual, relay, stageKey) {
    const finInd = individual.filter(r => r.status === 'active' && (stageKey ? r[stageKey+'_s'] != null : r.overall_s != null)).length;
    const finRel = relay.filter(t => t.overall_s != null).length;
    const finished = finInd + finRel;
    const live     = individual.filter(r => r.status === 'active' && (stageKey ? r[stageKey+'_s'] == null : r.overall_s == null)).length;
    const dnfCount = individual.filter(r => r.status === 'dnf').length;
    const dsqCount = individual.filter(r => r.status === 'dsq').length;
    const dnsCount = individual.filter(r => r.status === 'dns').length;
    const total = individual.length + relay.length;
    const relayOnly = individual.length === 0 && relay.length > 0;
    let html = `<div class="stats">`;
    if (relayOnly) {
        html += `<div class="stat"><div class="stat-val">${relay.length}</div><div class="stat-lbl">Команд</div></div>`;
        html += `<div class="stat"><div class="stat-val">${finished}</div><div class="stat-lbl">Финишировали</div></div>`;
    } else {
        html += `<div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Участников</div></div>`;
        html += `<div class="stat"><div class="stat-val">${finished}</div><div class="stat-lbl">Финишировали</div></div>`;
        if (relay.length > 0 && stageKey === null) html += `<div class="stat"><div class="stat-val">${relay.length}</div><div class="stat-lbl">Эстафет</div></div>`;
    }
    if (live > 0)     html += `<div class="stat"><div class="stat-val">${live}</div><div class="stat-lbl">В гонке</div></div>`;
    if (dnfCount > 0) html += `<div class="stat" style="border-color:rgba(190,10,33,.3)"><div class="stat-val" style="color:var(--red)">${dnfCount}</div><div class="stat-lbl">DNF</div></div>`;
    if (dsqCount > 0) html += `<div class="stat"><div class="stat-val" style="color:#a78bfa">${dsqCount}</div><div class="stat-lbl">DSQ</div></div>`;
    if (dnsCount > 0) html += `<div class="stat"><div class="stat-val">${dnsCount}</div><div class="stat-lbl">Не стартовали</div></div>`;
    html += `</div>`;
    return html;
}
/* ──────────────── Filter helpers ──────────────── */
function getFiltered() {
    if (!_data) return { individual: [], relay: [] };
    let ind = _data.individual;
    if (_fmt === 'relay') ind = [];
    else if (_gender !== 'all') ind = ind.filter(r => r.gender === _gender);
    const rel = _fmt === 'individual' ? [] : _data.relay;
    return { individual: ind, relay: rel };
}

/* ──────────────── Render: Overall ──────────────── */
const STAGE_LABEL_RU = { swim: 'Плавание', bike_day1: 'Вело 1', bike_day2: 'Вело 2', run: 'Бег' };

// Заголовок двух колонок места — порядок и подписи меняются местами в
// зависимости от фильтра пола: без фильтра сначала абсолют, с фильтром —
// сначала пересчитанное место внутри пола (см. п.1 задачи).
function rankHeaderCells() {
    return _gender === 'all'
        ? '<th>Место</th><th>По полу</th>'
        : '<th>По полу</th><th>Абсолют</th>';
}
function rankBodyCells(rankAbs, rankGender, gender, rc) {
    const a = `<span class="rank-num ${rc}">${rankAbs ?? '—'}</span>`;
    const g = rankGender != null ? `<span class="rank-num ${rc}">${genderBadge(gender)}${rankGender}</span>` : '<span class="muted">—</span>';
    return _gender === 'all' ? `<td>${a}</td><td>${g}</td>` : `<td>${g}</td><td>${a}</td>`;
}

function buildIndividualOverallRow(r, overallGaps, combinedRanks) {
    const notFinished = r.overall_s == null || r.status !== 'active';
    const rc = notFinished ? '' : rankClass(combinedRanks[r.bib]);
    // Последняя пройденная КТ (этап + отсечка) — отдельная колонка, и для
    // финишировавших (последняя КТ = финиш бега), и для тех, кто ещё в гонке.
    const cur = currentStage(r);
    const pos = cur ? lastReached(r.cp, cur) : null;
    const lastCpCell = pos ? `${STAGE_LABEL_RU[cur]}, ${CHECKPOINT_LABELS[cur][pos.seq]}` : '—';
    return `<tr class="${rc}${notFinished ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(r.bib)}','_blank')">
        ${rankBodyCells(combinedRanks[r.bib], r.overall_rank_g, r.gender, rc)}
        <td class="bib-cell">${r.bib}</td>
        <td>
            <span class="name-main">${r.surname} ${r.name}</span>
            ${r.city ? `<br><span class="name-city">${r.city}</span>` : ''}
        </td>
        <td>${genderBadge(r.gender)}</td>
        ${_fmt === 'all' ? '<td class="muted">Индивидуальный</td>' : ''}
        <td class="r time-cell muted">${fmtTime(r.swim_s)}</td>
        <td class="r time-cell muted">${fmtTime(r.bike1_s)}</td>
        <td class="r time-cell muted">${fmtTime(r.bike2_s)}</td>
        <td class="r time-cell muted">${fmtTime(r.run_s)}</td>
        <td class="r time-cell" style="font-weight:800">${fmtTime(r.overall_s)}</td>
        <td class="muted">${lastCpCell}</td>
        <td class="r muted">${fmtGap(overallGaps[r.bib])}</td>
        <td>${statusBadge(r, null)}</td>
    </tr>`;
}

// Эстафета в Итогах гонки — ОДНА строка (название команды), как и у
// личников, без развёрнутого списка участников по ролям (см. п.14
// задачи 2026-07-19 — раньше это была карточка .relay-card с тремя
// строками участников, дублировавшая место отдельным счётчиком).
function buildRelayOverallRow(team, overallGaps, combinedRanks) {
    const tr = teamGapRow(team);
    const notFinished = team.overall_s == null || tr.status !== 'active';
    const rc = notFinished ? '' : rankClass(combinedRanks[team.bib]);
    const cur = currentStage(tr);
    const pos = cur ? lastReached(tr.cp, cur) : null;
    const lastCpCell = pos ? `${STAGE_LABEL_RU[cur]}, ${CHECKPOINT_LABELS[cur][pos.seq]}` : '—';
    const statusCell = notFinished
        ? (tr.status === 'dnf' ? '<span class="badge badge-dnf">DNF</span>' : '<span class="badge badge-live">В гонке</span>')
        : '<span class="badge badge-fin">Финишировал</span>';
    return `<tr class="${rc}${notFinished ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(team.bib)}','_blank')">
        ${rankBodyCells(combinedRanks[team.bib], null, null, rc)}
        <td class="bib-cell">${team.bib}</td>
        <td><span class="name-main">${team.team_name}</span> <span class="badge badge-relay">Эстафета</span></td>
        <td class="muted">—</td>
        ${_fmt === 'all' ? '<td class="muted">Эстафета</td>' : ''}
        <td class="r time-cell muted">${fmtTime(tr.swim_s)}</td>
        <td class="r time-cell muted">${fmtTime(tr.bike1_s)}</td>
        <td class="r time-cell muted">${fmtTime(tr.bike2_s)}</td>
        <td class="r time-cell muted">${fmtTime(tr.run_s)}</td>
        <td class="r time-cell" style="font-weight:800">${fmtTime(team.overall_s)}</td>
        <td class="muted">${lastCpCell}</td>
        <td class="r muted">${fmtGap(overallGaps[team.bib])}</td>
        <td>${statusCell}</td>
    </tr>`;
}

// Объединяет личников и эстафету в порядок отображения: финишировавшие обоих
// типов перемежаются по времени (единый список по месту), затем не
// финишировавшие личники (свой порядок sortByStatus), затем команды без
// результатов — в конце. Возвращает массив {type, entry}.
function buildMergedOverallEntries(individual, relay) {
    const indSorted = sortByStatus(individual, 'overall_s');
    if (_fmt !== 'all') {
        // Только один тип виден — смешивать нечего.
        return [
            ...indSorted.map(r => ({ type: 'individual', entry: r })),
            ...relay.map(t => ({ type: 'relay', entry: t })),
        ];
    }
    const indFinished = indSorted.filter(r => r.overall_s != null && r.status === 'active');
    const indRest = indSorted.filter(r => !(r.overall_s != null && r.status === 'active'));
    const relFinished = relay.filter(t => t.overall_s != null).sort((a, b) => a.overall_s - b.overall_s);
    const relRest = relay.filter(t => t.overall_s == null);

    const interleaved = [
        ...indFinished.map(r => ({ type: 'individual', entry: r })),
        ...relFinished.map(t => ({ type: 'relay', entry: t })),
    ].sort((a, b) => a.entry.overall_s - b.entry.overall_s);

    return [
        ...interleaved,
        ...indRest.map(r => ({ type: 'individual', entry: r })),
        ...relRest.map(t => ({ type: 'relay', entry: t })),
    ];
}

const OVERALL_TABLE_HEAD = () => `<thead><tr>
    ${rankHeaderCells()}<th>№</th><th>Участник</th><th>Пол</th>${_fmt === 'all' ? '<th>Формат</th>' : ''}
    <th class="r">🏊 Плав.</th>
    <th class="r">🚴 Вело 1</th>
    <th class="r">🚴 Вело 2</th>
    <th class="r">🏃 Бег</th>
    <th class="r">Итого</th>
    <th>Последняя КТ</th>
    <th class="r">Отставание</th>
    <th>Статус</th>
</tr></thead>`;

function renderOverall() {
    const filtered = getFiltered();
    const individual = filtered.individual;
    // Эстафетная команда не имеет единого пола — при выбранном фильтре
    // пола команды в Финале не показываем вовсе (не "какого-то одного пола").
    const relay = _gender === 'all' ? filtered.relay : [];
    const overallGaps = computeOverallGaps([
        ...individual.map(r => ({ key: r.bib, cp: r.cp, status: r.status, swim_s: r.swim_s, bike1_s: r.bike1_s, bike2_s: r.bike2_s, run_s: r.run_s })),
        ...relay.map(teamGapRow),
    ]);
    // Единое место по всей гонке (личники+эстафета) — считается по ПОЛНОМУ
    // ростеру года (не по текущим фильтрам), не "плавает" при переключении
    // формата/пола, см. combinedOverallRankRows/computeCombinedOverallRanks.
    const combinedRanks = computeCombinedOverallRanks(combinedOverallRankRows(_data.individual, _data.relay));
    let html = buildStats(individual, relay, null);

    if (individual.length === 0 && relay.length === 0) {
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';
        document.getElementById('app').innerHTML = html;
        return;
    }

    // Единый порядок отображения (интерливинг при _fmt==='all', иначе просто
    // один тип) — личники и эстафета теперь однородные строки одной таблицы.
    const merged = buildMergedOverallEntries(individual, relay);
    html += `<div class="table-wrap"><table>${OVERALL_TABLE_HEAD()}<tbody>`;
    merged.forEach(item => {
        html += item.type === 'individual'
            ? buildIndividualOverallRow(item.entry, overallGaps, combinedRanks)
            : buildRelayOverallRow(item.entry, overallGaps, combinedRanks);
    });
    html += '</tbody></table></div>';

    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Stage ──────────────── */
const STAGE_CFG = {
    swim:  { timeKey: 'swim_s',  rankKey: 'swim_rank',  rankGKey: 'swim_rank_g',  metaKey: 'swim_pace',   metaFn: fmtPace100m, metaLbl: 'Темп',     relayStage: 'swim' },
    bike1: { timeKey: 'bike1_s', rankKey: 'bike1_rank', rankGKey: 'bike1_rank_g', metaKey: 'bike1_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    bike2: { timeKey: 'bike2_s', rankKey: 'bike2_rank', rankGKey: 'bike2_rank_g', metaKey: 'bike2_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    run:   { timeKey: 'run_s',   rankKey: 'run_rank',   rankGKey: 'run_rank_g',   metaKey: 'run_pace',    metaFn: fmtPace,     metaLbl: 'Темп',     relayStage: 'run'  },
};

function renderStage(stage) {
    const cfg = STAGE_CFG[stage];
    const dbStage = TAB_TO_DB_STAGE[stage];
    const maxSeq = STAGE_MAX_SEQ[dbStage];
    const { individual, relay } = getFiltered();

    // "Тихий" DNF на ЭТОМ этапе: participant.status==='active' в БД (в файле
    // не было явной пометки DNF/ДНФ), но последняя пройденная КТ этапа —
    // не финишная. Подменяем status на 'dnf' ТОЛЬКО в локальной копии для
    // этой вкладки (не мутируя общие данные _data — на других вкладках/в
    // Финале участник мог этот этап пройти полностью раньше). После подмены
    // остальная логика (сортировка, бейдж статуса) отрабатывает как для
    // обычного DNF — включая getDnfStage/statusBadge, которые уже умеют
    // корректно показывать "Финишировал"/DNF/"Не стартовал" по этапам.
    const withStageStatus = r => {
        const pos = lastReached(r.cp, dbStage);
        const silentDnf = r.status === 'active' && pos && pos.seq !== maxSeq;
        return silentDnf ? { ...r, status: 'dnf' } : r;
    };

    const rows = sortByStatus(individual.map(withStageStatus), cfg.timeKey);
    let relayMembers = _fmt !== 'individual'
        ? relay.flatMap(t => t.members
            .filter(m => m.relay_stage === cfg.relayStage && (_gender === 'all' || m.gender === _gender))
            .map(m => withStageStatus({...m, _bib: t.bib, _team: t.team_name})))
        : [];
    // Сортировать эстафеты: сначала реально финишировавшие этап (по времени),
    // затем "тихие" DNF (есть частичное время, но не дошли до финиша), затем
    // те, кто ещё не начал (нет данных вовсе).
    relayMembers = relayMembers.sort((a, b) => {
        const catOf = m => {
            const pos = lastReached(m.cp, dbStage);
            if (!pos) return 2;
            return pos.seq === maxSeq ? 0 : 1;
        };
        const catA = catOf(a), catB = catOf(b);
        if (catA !== catB) return catA - catB;
        const ta = a[cfg.timeKey], tb = b[cfg.timeKey];
        if (ta == null && tb == null) return 0;
        if (ta == null) return 1;
        if (tb == null) return -1;
        return ta - tb;
    });

    if (rows.length === 0 && relayMembers.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Нет данных</div>';
        return;
    }

    // Отставание — общий пул личников этой роли + эстафетчиков той же роли,
    // т.к. они соревнуются на этапе вместе (как и старт вело-2 в задаче 2).
    const gapPool = [
        ...rows.map(r => ({ key: r.bib, cp: r.cp, status: r.status })),
        ...relayMembers.map(m => ({ key: `${m._bib}:${m.relay_stage}`, cp: m.cp, status: m.status })),
    ];
    const gaps = computeStageGaps(gapPool, TAB_TO_DB_STAGE[stage]);

    const showStart = stage === 'bike2';

    // Присваиваем эстафетчикам, финишировавшим этап, собственный порядковый
    // номер (у relay-участников нет DB-поля ранга per-этап, в отличие от
    // личников) — relayMembers уже отсортирован так, что финишировавшие идут
    // первыми по возрастанию времени, так что порядковый номер = позиция+1.
    let _relayRankSeq = 0;
    const relayMembersRanked = relayMembers.map(m => {
        const pos = lastReached(m.cp, dbStage);
        const finished = !!pos && pos.seq === maxSeq;
        return { ...m, _finished: finished, _relayRank: finished ? ++_relayRankSeq : null };
    });

    let html = buildStats(individual, relay, stage);

    // При активном фильтре по полу "Место" должно быть местом ВНУТРИ этого
    // пола (пересчитанным, не абсолютным) — иначе абсолютный ранг (17, 20...)
    // выглядит так, будто места "не пересчитались" под фильтр.
    const mainRankKey = _gender === 'all' ? cfg.rankKey : cfg.rankGKey;

    const buildIndividualStageRow = r => {
        const t = r[cfg.timeKey];
        const noTime = t == null;
        const rc = noTime ? '' : rankClass(r[mainRankKey]);
        const pos = lastReached(r.cp, dbStage);
        const lastCpCell = pos ? CHECKPOINT_LABELS[dbStage][pos.seq] : '—';
        return `<tr class="${rc}${(noTime || r.status !== 'active') ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(r.bib)}','_blank')">
            ${rankBodyCells(r[cfg.rankKey], r[cfg.rankGKey], r.gender, noTime ? '' : rc)}
            <td class="bib-cell">${r.bib}</td>
            <td class="name-main">${r.surname} ${r.name}</td>
            <td>${genderBadge(r.gender)}</td>
            ${_fmt === 'all' ? '<td class="muted">Индивидуальный</td>' : ''}
            <td class="r time-cell">${fmtTime(t)}</td>
            <td class="muted">${lastCpCell}</td>
            <td class="r muted">${fmtGap(gaps[r.bib])}</td>
            <td class="r muted">${noTime ? '—' : cfg.metaFn(r[cfg.metaKey])}</td>
            ${showStart ? `<td class="r muted">${fmtTime(r.bike2_start_s)}</td>` : ''}
            <td>${statusBadge(r, stage)}</td>
        </tr>`;
    };

    const buildRelayStageRow = m => {
        const t = m[cfg.timeKey];
        const meta = cfg.metaFn(stage === 'swim' ? m.swim_pace : stage === 'bike1' ? m.bike1_speed : stage === 'bike2' ? m.bike2_speed : m.run_pace);
        const hasTime = t != null;
        const pos = lastReached(m.cp, dbStage);
        const lastCpCell = pos ? CHECKPOINT_LABELS[dbStage][pos.seq] : '—';
        const rc = m._finished ? rankClass(m._relayRank) : '';
        return `<tr class="${rc}" style="cursor:pointer" onclick="window.open('${participantLink(m._bib)}','_blank')">
            ${rankBodyCells(m._relayRank, null, null, rc)}
            <td class="bib-cell">${m._bib}</td>
            <td>
                <span class="name-main">${m.surname} ${m.name}</span>
                <br><span class="name-city">${m._team}</span>
            </td>
            <td>${genderBadge(m.gender)}</td>
            ${_fmt === 'all' ? '<td class="muted">Эстафета</td>' : ''}
            <td class="r time-cell">${fmtTime(t)}</td>
            <td class="muted">${lastCpCell}</td>
            <td class="r muted">${fmtGap(gaps[`${m._bib}:${m.relay_stage}`])}</td>
            <td class="r muted">${hasTime ? meta : '—'}</td>
            ${showStart ? `<td class="r muted">${fmtTime(m.bike2_start_s)}</td>` : ''}
            <td>${!hasTime && m.status === 'active' ? '<span class="badge badge-live">В гонке</span>' : relayMemberStatusBadge(m)}</td>
        </tr>`;
    };

    // Единый порядок: финишировавшие этот этап (личники + эстафетчики этой
    // роли) перемежаются по времени, затем остальные (не финишировавшие
    // личники — свой порядок sortByStatus, затем не финишировавшие
    // эстафетчики) — без разделительной строки-заголовка "Эстафеты".
    const rowsFinished = rows.filter(r => r[cfg.timeKey] != null && r.status === 'active');
    const rowsRest = rows.filter(r => !(r[cfg.timeKey] != null && r.status === 'active'));
    const relFinished = relayMembersRanked.filter(m => m._finished);
    const relRest = relayMembersRanked.filter(m => !m._finished);

    let orderedRows;
    if (_fmt === 'all') {
        const interleaved = [
            ...rowsFinished.map(r => ({ type: 'individual', entry: r })),
            ...relFinished.map(m => ({ type: 'relay', entry: m })),
        ].sort((a, b) => a.entry[cfg.timeKey] - b.entry[cfg.timeKey]);
        orderedRows = [
            ...interleaved,
            ...rowsRest.map(r => ({ type: 'individual', entry: r })),
            ...relRest.map(m => ({ type: 'relay', entry: m })),
        ];
    } else {
        orderedRows = [
            ...rows.map(r => ({ type: 'individual', entry: r })),
            ...relayMembersRanked.map(m => ({ type: 'relay', entry: m })),
        ];
    }

    html += `<div class="table-wrap"><table class="stage-table">
    <thead><tr>
        ${rankHeaderCells()}<th>№</th><th>Участник</th><th>Пол</th>${_fmt === 'all' ? '<th>Формат</th>' : ''}
        <th class="r">Время</th><th>Последняя КТ</th><th class="r">Отставание</th><th class="r">${cfg.metaLbl}</th>
        ${showStart ? '<th class="r">Старт вело-2</th>' : ''}
        <th>Статус</th>
    </tr></thead><tbody>`;
    orderedRows.forEach(item => {
        html += item.type === 'individual' ? buildIndividualStageRow(item.entry) : buildRelayStageRow(item.entry);
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Вело (свод) / День 1 / День 2 ────────────────
   Общий рендер для "кумулятивных" зачётов, не привязанных к конкретному
   этапу (свод вело за оба дня, снапшот гонки на конец календарного дня).
   В отличие от Итогов/этапов тут нет DB-полей ранга — место считается
   позицией в отсортированном списке, одна колонка "Место" (при активном
   фильтре пола getFiltered() уже отдаёт только участников этого пола —
   позиция и так получается местом внутри пола). */
function progressStatusBadge(status, hasValue) {
    if (status === 'dns') return '<span class="badge badge-dns">Не стартовал</span>';
    if (status === 'dsq') return '<span class="badge badge-dsq">DSQ</span>';
    if (status === 'dnf') return '<span class="badge badge-dnf">DNF</span>';
    return hasValue ? '<span class="badge badge-fin">Пройден</span>' : '<span class="badge badge-live">В гонке</span>';
}

function bikeCombinedTime(row) {
    return (row.bike1_s != null && row.bike2_s != null) ? row.bike1_s + row.bike2_s : null;
}
function day1Progress(row) {
    return globalProgress(row, 'bike_day1', STAGE_MAX_SEQ.bike_day1);
}
function day2Progress(row) {
    return globalProgress(row, 'bike_day2', STAGE_MAX_SEQ.bike_day2);
}

// individual: getValue вызывается на самой строке участника (есть .cp,
// .bike1_s и т.д.). relay: getValue вызывается на teamGapRow(team) —
// том же "виртуальном участнике", что и в Итогах/Отставании.
function buildRankedEntries(individual, relay, getValue) {
    const withVal = [
        ...individual.map(r => ({ type: 'individual', entry: r, v: r.status === 'active' ? getValue(r) : null })),
        ...relay.map(t => {
            const tr = teamGapRow(t);
            return { type: 'relay', entry: t, status: tr.status, v: tr.status === 'active' ? getValue(tr) : null };
        }),
    ];
    return withVal.sort((a, b) => {
        if (a.v == null && b.v == null) return 0;
        if (a.v == null) return 1;
        if (b.v == null) return -1;
        return a.v - b.v;
    });
}

function buildProgressRow(item, pos) {
    const { type, entry, v } = item;
    const hasVal = v != null;
    const rc = hasVal ? rankClass(pos) : '';
    const status = type === 'individual' ? entry.status : item.status;
    const nameCell = type === 'individual'
        ? `<span class="name-main">${entry.surname} ${entry.name}</span>${entry.city ? `<br><span class="name-city">${entry.city}</span>` : ''}`
        : `<span class="name-main">${entry.team_name}</span> <span class="badge badge-relay">Эстафета</span>`;
    return `<tr class="${rc}${hasVal ? '' : ' dnf'}" style="cursor:pointer" onclick="window.open('${participantLink(entry.bib)}','_blank')">
        <td><span class="rank-num ${rc}">${hasVal ? pos : '—'}</span></td>
        <td class="bib-cell">${entry.bib}</td>
        <td>${nameCell}</td>
        <td>${type === 'individual' ? genderBadge(entry.gender) : '<span class="muted">—</span>'}</td>
        ${_fmt === 'all' ? `<td class="muted">${type === 'individual' ? 'Индивидуальный' : 'Эстафета'}</td>` : ''}
        <td class="r time-cell">${fmtTime(v)}</td>
        <td>${progressStatusBadge(status, hasVal)}</td>
    </tr>`;
}

function renderRankedProgress(getValue) {
    const { individual, relay } = getFiltered();
    let html = buildStats(individual, relay, null);
    const entries = buildRankedEntries(individual, relay, getValue);
    if (entries.length === 0) {
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';
        document.getElementById('app').innerHTML = html;
        return;
    }
    html += `<div class="table-wrap"><table>
    <thead><tr><th>Место</th><th>№</th><th>Участник</th><th>Пол</th>${_fmt === 'all' ? '<th>Формат</th>' : ''}<th class="r">Время</th><th>Статус</th></tr></thead><tbody>`;
    let pos = 0;
    entries.forEach(item => {
        if (item.v != null) pos++;
        html += buildProgressRow(item, pos);
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

function renderBikeCombined() { renderRankedProgress(bikeCombinedTime); }
function renderDay1() { renderRankedProgress(day1Progress); }
function renderDay2() { renderRankedProgress(day2Progress); }

/* ──────────────── Render: Графики (Темп/скорость, Позиция) ────────────────
   Форма по умолчанию — "spaghetti + hover-highlight" (эмфазис, не
   категориальный цвет): все линии тонкие/приглушённые, наведение/тап
   подсвечивает ближайшую акцентным цветом. Так график остаётся читаемым
   независимо от числа участников. Поверх этого — опциональный режим
   сравнения (см. chart-sidebar ниже, п.7.2 задачи 2026-07-19): пользователь
   явно выбирает до CHART_COMPARE_MAX участников через поиск+чекбоксы,
   тогда spaghetti уступает место обычным категориальным линиям с легендой
   (сознательно НЕ копирует ручной мультивыбор Суточной велогонки один-в-один
   — там неидеальна мобильная версия, см. план). */
function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function fmtSecClock(s) {
    if (s == null) return '';
    const r = Math.round(s);
    return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`;
}
const STAGE_UNIT_TITLE = { swim: 'Темп, /100 м', bike1: 'Скорость, км/ч', bike2: 'Скорость, км/ч', run: 'Темп, /км' };
const PACE_STAGE_LABEL = { swim: 'Плавание', bike1: 'Вело День 1', bike2: 'Вело День 2', run: 'Бег' };
function paceValueLabel(dbStage, v) {
    if (v == null) return '—';
    if (dbStage === 'bike_day1' || dbStage === 'bike_day2') return fmtSpeed(v);
    const label = fmtSecClock(v);
    return dbStage === 'swim' ? `${label} /100м` : `${label} /км`;
}

/* ──────────────── Мультивыбор для сравнения (п.7.2/п.8) ────────────────
   До 4 одновременных линий — категориальная палитра валидирована skill'ом
   dataviz именно на "all-pairs" (не только соседние) сравнение до 4 цветов
   в обоих режимах темы; больше — цвета начинают визуально сливаться.
   Цвет закреплён за конкретным bib по ПОРЯДКУ выбора (не по позиции в
   отфильтрованном списке) — не "перекрашивает выживших", когда другой
   участник добавляется/убирается из сравнения. */
const CHART_COMPARE_MAX = 4;
const CHART_COMPARE_COLORS = {
    light: ['#2a78d6', '#008300', '#e87ba4', '#eda100'],
    dark:  ['#3987e5', '#008300', '#d55181', '#c98500'],
};
function chartCompareColor(slotIdx) {
    const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const palette = CHART_COMPARE_COLORS[theme];
    return palette[slotIdx % palette.length];
}
function chartToggleSelect(bib) {
    const idx = _chartSelectedBibs.indexOf(bib);
    if (idx !== -1) _chartSelectedBibs.splice(idx, 1);
    else if (_chartSelectedBibs.length < CHART_COMPARE_MAX) _chartSelectedBibs.push(bib);
}
function chartParticipantListItemsHtml(datasets) {
    const q = _chartSearchQuery.trim().toLowerCase();
    const filtered = q ? datasets.filter(d => d._name.toLowerCase().includes(q)) : datasets;
    if (filtered.length === 0) return '<div class="muted" style="padding:10px;font-size:12px">Ничего не найдено</div>';
    return filtered.map(d => {
        const checked = _chartSelectedBibs.includes(d._bib);
        const disabled = !checked && _chartSelectedBibs.length >= CHART_COMPARE_MAX;
        return `<label class="chart-participant-item">
            <input type="checkbox" data-chartbib="${d._bib}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
            <span>${d._name}</span>
        </label>`;
    }).join('');
}
function chartSidebarHtml(datasets) {
    const footer = _chartSelectedBibs.length
        ? `<button class="chart-clear-btn" id="chartClearSelection">Сбросить выбор (${_chartSelectedBibs.length})</button>`
        : `<div class="chart-hint-sidebar">Выберите до ${CHART_COMPARE_MAX} участников для сравнения</div>`;
    return `<div class="chart-sidebar">
        <input type="text" class="chart-search" id="chartSearchInput" placeholder="Поиск участника..." value="${_chartSearchQuery.replace(/"/g, '&quot;')}">
        <div class="chart-participant-list" id="chartParticipantList">${chartParticipantListItemsHtml(datasets)}</div>
        ${footer}
    </div>`;
}
// Лёгкое обновление списка участников (поиск) — НЕ трогает <input>, чтобы
// не терять фокус/курсор на каждое нажатие клавиши (полный render() чата
// пересоздаёт DOM целиком, что сбросило бы фокус посреди набора текста).
function refreshChartParticipantList() {
    const listEl = document.getElementById('chartParticipantList');
    if (!listEl) return;
    listEl.innerHTML = chartParticipantListItemsHtml(_lastChartDatasets);
    attachChartCheckboxHandlers();
}
function attachChartCheckboxHandlers() {
    document.querySelectorAll('[data-chartbib]').forEach(cb => {
        cb.addEventListener('change', () => {
            chartToggleSelect(Number(cb.dataset.chartbib));
            render(); // выбор меняет сами линии графика — нужен полный ре-рендер
        });
    });
}
function attachChartSidebarHandlers() {
    const search = document.getElementById('chartSearchInput');
    if (search) {
        search.addEventListener('input', () => {
            _chartSearchQuery = search.value;
            refreshChartParticipantList();
        });
    }
    attachChartCheckboxHandlers();
    const clearBtn = document.getElementById('chartClearSelection');
    if (clearBtn) clearBtn.addEventListener('click', () => { _chartSelectedBibs = []; render(); });
}
function buildCompareDataset(d, color) {
    return {
        label: d._name, data: d.data,
        borderColor: color, backgroundColor: color,
        borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 6,
        pointBackgroundColor: color, pointBorderColor: cssVar('--bg2'), pointBorderWidth: 1.5,
        tension: 0.15, spanGaps: true,
    };
}

function chartParticipantRowsForStage(tabStage) {
    const dbStage = TAB_TO_DB_STAGE[tabStage];
    const role = STAGE_ROLE[dbStage];
    const { individual, relay } = getFiltered();
    const rows = individual.map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, splits: r.splits }));
    relay.forEach(t => {
        const m = t.members.find(mm => mm.relay_stage === role);
        if (m) rows.push({ bib: t.bib, name: `${m.surname} ${m.name} (${t.team_name})`, splits: m.splits });
    });
    return { dbStage, rows };
}

function buildPaceDatasets(tabStage) {
    const { dbStage, rows } = chartParticipantRowsForStage(tabStage);
    const maxSeq = STAGE_MAX_SEQ[dbStage];
    return rows.map(r => {
        const pts = [];
        for (let seq = 1; seq <= maxSeq; seq++) {
            const v = splitPaceValue(dbStage, seq, r.splits?.[dbStage]?.[seq]);
            if (v != null) pts.push({ x: CHECKPOINT_DIST_KM[dbStage][seq], y: v });
        }
        return pts.length ? { _bib: r.bib, _name: r.name, data: pts } : null;
    }).filter(Boolean);
}

// Приглушённый цвет линий (--chart-context) на тёмной теме не проходит
// порог контраста 3:1 сам по себе (см. dataviz skill validate_palette.js —
// WARN, "not dismissable" без видимой подписи) — активная линия ПОДСВЕЧЕНА
// (толще + акцентный цвет), но дополнительно несёт подпись участника прямо
// на канвасе (не только в тултипе), поэтому опознание не зависит от того,
// хватает ли контраста самой линии.
const activeLineLabelPlugin = {
    id: 'activeLineLabel',
    afterDatasetsDraw(chart) {
        const info = chart._hoverInfo;
        if (!info) return;
        const { ctx } = chart;
        ctx.save();
        ctx.font = '700 11px system-ui, sans-serif';
        const padX = 7, padY = 4;
        const tw = ctx.measureText(info.text).width;
        const bw = tw + padX * 2, bh = 14 + padY * 2;
        let bx = info.x + 10;
        if (bx + bw > chart.width - 4) bx = info.x - bw - 10;
        const by = Math.max(2, Math.min(chart.height - bh - 2, info.y - bh / 2));
        ctx.fillStyle = cssVar('--red');
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 4); else ctx.rect(bx, by, bw, bh);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.text, bx + padX, by + bh / 2);
        ctx.restore();
    },
};

// Общий "hover подсвечивает ближайшую линию" — переиспользуется обоими
// графиками (Темп/скорость и Позиция).
function attachSpaghettiHover(chart, accent, context) {
    chart.options.onHover = function (evt, elements) {
        const activeIdx = elements.length ? elements[0].datasetIndex : null;
        this.data.datasets.forEach((d, i) => {
            const active = i === activeIdx;
            d.borderColor = active ? accent : context;
            d.borderWidth = active ? 2.5 : 1;
            d.pointRadius = active ? 4 : 2;
            d.pointBackgroundColor = active ? accent : context;
        });
        if (activeIdx != null) {
            const el = elements[0];
            const pt = this.getDatasetMeta(activeIdx).data[el.index];
            this._hoverInfo = { x: pt.x, y: pt.y, text: this.data.datasets[activeIdx].label };
        } else {
            this._hoverInfo = null;
        }
        this.update('none');
    };
}

function buildSpaghettiDataset(d, accent, context) {
    return {
        label: d._name, data: d.data,
        borderColor: context, backgroundColor: context,
        // Точки на местах КТ видны всегда (п.7.3), не только на hover —
        // маленькие/приглушённые по умолчанию, крупнее на активной линии
        // (см. attachSpaghettiHover, который переключает pointRadius так же,
        // как сейчас переключает borderColor/borderWidth).
        borderWidth: 1, pointRadius: 2, pointHoverRadius: 5,
        pointBackgroundColor: context, pointBorderWidth: 0,
        pointHoverBackgroundColor: accent, pointHoverBorderColor: cssVar('--bg2'), pointHoverBorderWidth: 2,
        tension: 0.15, spanGaps: true,
    };
}

// Обычный тултип (значение на КТ) — БЕЗ заголовка-имени: имя участника уже
// показывает activeLineLabelPlugin прямо на канвасе рядом с точкой; заголовок
// тултипа дублировал бы тот же текст в двух местах одновременно при
// наведении (см. скриншот пользователя, п.7.1 задачи 2026-07-19).
const CHART_TOOLTIP_NO_TITLE = { title: () => '' };

function renderPaceChart() {
    const dbStage = TAB_TO_DB_STAGE[_paceStage];
    const datasets = buildPaceDatasets(_paceStage);
    _lastChartDatasets = datasets;
    document.getElementById('app').innerHTML = `
        <div class="filters" style="padding:0 0 12px;border-bottom:none;background:transparent">
            <span class="filter-label">Этап:</span>
            <div class="filter-group" id="paceStageGroup">
                ${Object.keys(PACE_STAGE_LABEL).map(s => `<button class="filter-btn${s === _paceStage ? ' active' : ''}" data-pacestage="${s}">${PACE_STAGE_LABEL[s]}</button>`).join('')}
            </div>
        </div>
        <div class="chart-card"><div class="chart-layout">
            ${chartSidebarHtml(datasets)}
            <div class="chart-main">
                <div class="chart-hint">${_chartSelectedBibs.length ? 'Сравнение выбранных участников — снимите отметку слева, чтобы вернуться к общему виду' : 'Наведите курсор (или коснитесь на телефоне) на линию, чтобы увидеть участника, либо выберите нескольких слева для сравнения'}</div>
                <div class="chart-canvas-wrap"><canvas id="sibermanPaceChart"></canvas></div>
            </div>
        </div></div>`;
    document.querySelectorAll('#paceStageGroup [data-pacestage]').forEach(btn => {
        btn.addEventListener('click', () => { _paceStage = btn.dataset.pacestage; renderPaceChart(); });
    });
    attachChartSidebarHandlers();

    if (_paceChart) { _paceChart.destroy(); _paceChart = null; }
    if (datasets.length === 0) {

        return;
    }
    const accent = cssVar('--red');
    const context = cssVar('--chart-context');
    const isCompare = _chartSelectedBibs.length > 0;
    const chartDatasets = isCompare
        ? datasets.filter(d => _chartSelectedBibs.includes(d._bib))
            .map(d => buildCompareDataset(d, chartCompareColor(_chartSelectedBibs.indexOf(d._bib))))
        : datasets.map(d => buildSpaghettiDataset(d, accent, context));
    const ctx = document.getElementById('sibermanPaceChart').getContext('2d');
    _paceChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: chartDatasets },
        plugins: [activeLineLabelPlugin],
        options: {
            responsive: true, maintainAspectRatio: false,
            layout: { padding: { top: 16, bottom: 8 } },
            interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
            plugins: {
                legend: { display: isCompare, position: 'top', labels: { color: cssVar('--text'), boxWidth: 12, font: { size: 11 } } },
                tooltip: {
                    callbacks: isCompare
                        ? { label(item) { return `${item.dataset.label} — ${item.parsed.x.toFixed(1)} км: ${paceValueLabel(dbStage, item.parsed.y)}`; } }
                        : { ...CHART_TOOLTIP_NO_TITLE, label(item) { return `${item.parsed.x.toFixed(1)} км: ${paceValueLabel(dbStage, item.parsed.y)}`; } },
                },
            },
            scales: {
                x: { type: 'linear', title: { display: true, text: 'Километраж этапа', color: cssVar('--muted') }, ticks: { color: cssVar('--muted') }, grid: { color: cssVar('--border') } },
                y: {
                    // Плавание/бег — темп (секунды, меньше = быстрее): быстрый
                    // темп сверху, медленный снизу (п.10) — инвертируем шкалу.
                    // Вело — скорость (км/ч, больше = быстрее) уже естественно
                    // растёт вверх, инверсия не нужна.
                    reverse: dbStage === 'swim' || dbStage === 'run',
                    title: { display: true, text: STAGE_UNIT_TITLE[_paceStage], color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted'), callback: v => (dbStage === 'bike_day1' || dbStage === 'bike_day2') ? v.toFixed(0) : fmtSecClock(v) },
                    grid: { color: cssVar('--border') },
                },
            },
        },
    });
    if (!isCompare) attachSpaghettiHover(_paceChart, accent, context);
}

// Пропорциональная ширина по X для графика "Позиция" (п.7.4) — НЕ реальный
// километраж (тогда плавание 10/515≈2% сжималось бы в почти невидимую
// полоску), а фиксированные доли ширины графика: Плавание 20% / Вело 50%
// (вело1+вело2 идут подряд без разрыва в километраже, 10→431 км — единый
// сегмент) / Бег 30%. Ось X рисуется в этом "виртуальном" пространстве
// [0,100], подписи тиков конвертируются обратно в реальные км.
const POSITION_X_SEGMENTS = [
    { kmStart: 0,   kmEnd: 10,  xStart: 0,  xEnd: 20 },   // Плавание — 20%
    { kmStart: 10,  kmEnd: 431, xStart: 20, xEnd: 70 },   // Вело (день1+день2) — 50%
    { kmStart: 431, kmEnd: 515, xStart: 70, xEnd: 100 },  // Бег — 30%
];
function kmToVirtualX(km) {
    for (const seg of POSITION_X_SEGMENTS) {
        if (km <= seg.kmEnd) {
            const frac = seg.kmEnd === seg.kmStart ? 0 : (km - seg.kmStart) / (seg.kmEnd - seg.kmStart);
            return seg.xStart + frac * (seg.xEnd - seg.xStart);
        }
    }
    return 100;
}
function virtualXToKm(x) {
    for (const seg of POSITION_X_SEGMENTS) {
        if (x <= seg.xEnd) {
            const frac = seg.xEnd === seg.xStart ? 0 : (x - seg.xStart) / (seg.xEnd - seg.xStart);
            return seg.kmStart + frac * (seg.kmEnd - seg.kmStart);
        }
    }
    return 515;
}
// Точки датасета остаются в реальных км (buildPositionDatasets тестируется
// именно на реальных км, см. tests/js) — трансформация в виртуальное
// X-пространство применяется только непосредственно перед передачей в
// Chart.js, отдельным шагом.
function withVirtualX(d) {
    return { ...d, data: d.data.map(p => ({ x: kmToVirtualX(p.x), y: p.y })) };
}

function buildPositionDatasets() {
    const { individual, relay } = getFiltered();
    const rows = [
        ...individual.map(r => ({ key: r.bib, name: `${r.surname} ${r.name}`, cp: r.cp, swim_s: r.swim_s, bike1_s: r.bike1_s, bike2_s: r.bike2_s, run_s: r.run_s })),
        ...relay.map(t => { const tr = teamGapRow(t); return { key: t.bib, name: t.team_name, cp: tr.cp, swim_s: tr.swim_s, bike1_s: tr.bike1_s, bike2_s: tr.bike2_s, run_s: tr.run_s }; }),
    ];
    const ranksByStage = {};
    STAGE_ORDER.forEach(stage => { ranksByStage[stage] = computeGlobalCheckpointRanks(rows, stage, STAGE_MAX_SEQ[stage]); });
    return rows.map(r => {
        const pts = [];
        STAGE_ORDER.forEach(stage => {
            const bySeq = ranksByStage[stage];
            for (let seq = 1; seq <= STAGE_MAX_SEQ[stage]; seq++) {
                const rank = bySeq[seq]?.[r.key];
                if (rank != null) pts.push({ x: STAGE_KM_OFFSET[stage] + CHECKPOINT_DIST_KM[stage][seq], y: rank });
            }
        });
        return pts.length ? { _bib: r.key, _name: r.name, data: pts } : null;
    }).filter(Boolean);
}

function renderPositionChart() {
    const datasets = buildPositionDatasets();
    _lastChartDatasets = datasets;
    document.getElementById('app').innerHTML = `
        <div class="chart-card"><div class="chart-layout">
            ${chartSidebarHtml(datasets)}
            <div class="chart-main">
                <div class="chart-hint">${_chartSelectedBibs.length ? 'Сравнение выбранных участников — снимите отметку слева, чтобы вернуться к общему виду' : 'Место в общем зачёте на каждой пройденной КТ по всей дистанции (0–515 км). Наведите/коснитесь линии, чтобы увидеть участника, либо выберите нескольких слева для сравнения'}</div>
                <div class="chart-canvas-wrap chart-canvas-wrap--position"><canvas id="sibermanPositionChart"></canvas></div>
            </div>
        </div></div>`;
    attachChartSidebarHandlers();

    if (_positionChart) { _positionChart.destroy(); _positionChart = null; }
    if (datasets.length === 0) {
        document.querySelector('.chart-canvas-wrap').innerHTML = '<div class="empty">Нет данных для графика</div>';
        return;
    }
    const maxRank = Math.max(...datasets.flatMap(d => d.data.map(p => p.y)));
    const accent = cssVar('--red');
    const context = cssVar('--chart-context');
    const isCompare = _chartSelectedBibs.length > 0;
    const virtualDatasets = datasets.map(withVirtualX);
    const chartDatasets = isCompare
        ? virtualDatasets.filter(d => _chartSelectedBibs.includes(d._bib))
            .map(d => buildCompareDataset(d, chartCompareColor(_chartSelectedBibs.indexOf(d._bib))))
        : virtualDatasets.map(d => buildSpaghettiDataset(d, accent, context));

    const stageBoundaryPlugin = {
        id: 'stageBoundaries',
        afterDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            ctx.save();
            ctx.strokeStyle = cssVar('--border');
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1;
            ctx.font = '10px system-ui, sans-serif';
            ctx.fillStyle = cssVar('--muted');
            // Границы дней вело (10 и 155 км) внутри общего блока "Вело" —
            // тоньше/без подписи, чтобы не спорить с главными подписями этапов.
            [{ km: 10, label: 'Вело' }, { km: 155, label: null }, { km: 431, label: 'Бег' }].forEach(({ km, label }) => {
                const x = scales.x.getPixelForValue(kmToVirtualX(km));
                ctx.beginPath();
                ctx.moveTo(x, chartArea.top);
                ctx.lineTo(x, chartArea.bottom);
                ctx.stroke();
                if (label) ctx.fillText(label, x + 4, chartArea.top + 12);
            });
            ctx.restore();
        },
    };

    const ctx = document.getElementById('sibermanPositionChart').getContext('2d');
    _positionChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: chartDatasets },
        plugins: [stageBoundaryPlugin, activeLineLabelPlugin],
        options: {
            responsive: true, maintainAspectRatio: false,
            layout: { padding: { top: 16, bottom: 8 } },
            interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
            plugins: {
                legend: { display: isCompare, position: 'top', labels: { color: cssVar('--text'), boxWidth: 12, font: { size: 11 } } },
                tooltip: {
                    callbacks: isCompare
                        ? { label(item) { return `${item.dataset.label} — ${virtualXToKm(item.parsed.x).toFixed(1)} км: место ${item.parsed.y}`; } }
                        : { ...CHART_TOOLTIP_NO_TITLE, label(item) { return `${virtualXToKm(item.parsed.x).toFixed(1)} км: место ${item.parsed.y}`; } },
                },
            },
            scales: {
                x: {
                    type: 'linear', min: 0, max: 100,
                    title: { display: true, text: 'Километраж гонки', color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted'), stepSize: 10, callback: v => Math.round(virtualXToKm(v)) },
                    grid: { color: cssVar('--border') },
                },
                y: { reverse: true, min: 1, max: maxRank, title: { display: true, text: 'Место', color: cssVar('--muted') }, ticks: { color: cssVar('--muted'), precision: 0 }, grid: { color: cssVar('--border') } },
            },
        },
    });
    if (!isCompare) attachSpaghettiHover(_positionChart, accent, context);
}

/* ──────────────── Render: Стартовый лист вело-2 ──────────────── */
function renderStartlist() {
    const { individual, relay } = getFiltered();

    let riders = [];
    if (_fmt !== 'relay') {
        riders = riders.concat(individual
            .filter(r => r.bike2_start_s != null)
            .map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, city: r.city, gender: r.gender, start_s: r.bike2_start_s })));
    }
    if (_fmt !== 'individual') {
        relay.forEach(team => {
            team.members.filter(m => m.relay_stage === 'bike' && m.bike2_start_s != null).forEach(m => {
                riders.push({ bib: team.bib, name: `${m.surname} ${m.name}`, city: team.team_name, gender: m.gender, start_s: m.bike2_start_s });
            });
        });
    }
    riders.sort((a, b) => a.start_s - b.start_s);

    if (riders.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Стартовый лист вело-2 появится после финиша лидеров вело-1</div>';
        return;
    }

    let html = `<div class="section-hdr">Расчётный старт вело-2 (по рангу вело-1, топ-5 — интервал 3 мин, далее 1 мин)</div>`;
    html += `<div class="table-wrap"><table>
    <thead><tr><th>Ранг</th><th>№</th><th>Участник</th><th>Пол</th><th class="r">Старт вело-2</th></tr></thead><tbody>`;
    riders.forEach((r, i) => {
        html += `<tr>
            <td><span class="rank-num">${i + 1}</span></td>
            <td class="bib-cell">${r.bib}</td>
            <td>
                <span class="name-main">${r.name}</span>
                ${r.city ? `<br><span class="name-city">${r.city}</span>` : ''}
            </td>
            <td>${genderBadge(r.gender)}</td>
            <td class="r time-cell">${fmtTime(r.start_s)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Живой секундомер этапа(ов) ──────────────── */
// Виджет над табами, не привязан к фильтрам/вкладке. Плавание и Вело
// День 1 проходят в один календарный день — единый секундомер "День 1"
// от старта гонки (не два отдельных, как могло бы показаться по стадиям).
// Вело День 2 и Бег — отдельные дни, свои секундомеры.
// Сумма total-времён этапов, предшествующих данному — момент входа в этап
// = race_start + эта сумма (у первого дошедшего участника). Для swim — 0
// (масс-старт, начало этапа = старт гонки).
const STAGE_PRIOR_KEYS = { swim: [], bike_day1: ['swim_s'], bike_day2: ['swim_s', 'bike1_s'], run: ['swim_s', 'bike1_s', 'bike2_s'] };
const STAGE_ROLE = { swim: 'swim', bike_day1: 'bike', bike_day2: 'bike', run: 'run' };

function stageParticipantRows(dbStage) {
    const rows = [...(_data.individual || [])];
    (_data.relay || []).forEach(t => {
        const m = t.members.find(mm => mm.relay_stage === STAGE_ROLE[dbStage]);
        if (m) rows.push(m);
    });
    return rows;
}

// Момент входа КОНКРЕТНОГО участника в этап (секунды от старта гонки),
// null — ещё не дошёл (предыдущий этап не завершён).
function stageEntryOffset(row, dbStage) {
    if (dbStage === 'swim') return 0;
    const keys = STAGE_PRIOR_KEYS[dbStage];
    if (keys.some(k => row[k] == null)) return null;
    return keys.reduce((sum, k) => sum + row[k], 0);
}

// Момент начала этапа в целом = вход САМОГО БЫСТРОГО дошедшего участника.
// null — в этап ещё никто не вошёл (этап не начался).
function stageStartOffset(dbStage) {
    if (dbStage === 'swim') return 0;
    let min = null;
    stageParticipantRows(dbStage).forEach(r => {
        const off = stageEntryOffset(r, dbStage);
        if (off != null && (min == null || off < min)) min = off;
    });
    return min;
}

// Остался ли хоть один активный участник, ещё не завершивший этап
// (статус active и не дошёл до последней КТ этапа) — таймер тикает, пока
// это true.
function stageIsPending(dbStage) {
    return stageParticipantRows(dbStage).some(r => {
        if (r.status !== 'active') return false;
        const pos = lastReached(r.cp, dbStage);
        return !(pos && pos.seq === STAGE_MAX_SEQ[dbStage]);
    });
}

// Последовательные "дни" гонки для виджета — swim+bike_day1 склеены в один
// (см. комментарий выше), bike_day2/run идут по отдельности как раньше.
// startOffset() === null значит "ещё не начался" (никто не вошёл), pending()
// значит "кто-то ещё активен внутри".
const WIDGET_STAGES = [
    { label: 'День 1', startOffset: () => 0, pending: () => stageIsPending('swim') || stageIsPending('bike_day1') },
    { label: 'Вело День 2', startOffset: () => stageStartOffset('bike_day2'), pending: () => stageIsPending('bike_day2') },
    { label: 'Бег', startOffset: () => stageStartOffset('run'), pending: () => stageIsPending('run') },
];

// Идём по WIDGET_STAGES по порядку: первый ещё не закрытый элемент и есть
// текущее состояние виджета — тикающий секундомер (уже начался и кто-то
// внутри активен), "следующий этап" (ещё не начался — предыдущий день уже
// закрыт, этот ещё нет) или, если все элементы закрыты, гонка завершена.
function computeStageTimerState() {
    if (!_raceStartEpoch || !_data) return null;
    for (const s of WIDGET_STAGES) {
        const off = s.startOffset();
        if (off == null) return { type: 'next', label: s.label };
        if (s.pending()) return { type: 'timer', label: s.label, startEpoch: _raceStartEpoch + off * 1000 };
    }
    return { type: 'done' };
}

function renderStageTimers() {
    const el = document.getElementById('stageTimers');
    const state = computeStageTimerState();
    if (!state) {
        el.style.display = 'none';
        el.innerHTML = '';
        return;
    }
    el.style.display = '';
    if (state.type === 'timer') {
        el.innerHTML = `<div class="stage-timer" data-start="${state.startEpoch}">
            <span class="stage-timer-lbl">${state.label}</span>
            <span class="stage-timer-val">00:00:00</span>
        </div>`;
        tickStageTimers();
    } else if (state.type === 'next') {
        el.innerHTML = `<div class="stage-timer stage-timer--static">
            <span class="stage-timer-lbl">Следующий этап</span>
            <span class="stage-timer-val">${state.label}</span>
        </div>`;
    } else {
        el.innerHTML = `<div class="stage-timer stage-timer--static">
            <span class="stage-timer-val">Гонка завершена</span>
        </div>`;
    }
}

function tickStageTimers() {
    document.querySelectorAll('.stage-timer[data-start]').forEach(el => {
        const elapsed = Math.max(0, Math.floor((Date.now() - Number(el.dataset.start)) / 1000));
        el.querySelector('.stage-timer-val').textContent = fmtTime(elapsed);
    });
}

/* ──────────────── Автоскролл табов до активного этапа ────────────────
   Только визуальный скролл панели #tabs — НЕ переключает активную
   вкладку (пользователь остаётся там, где кликнул/где был по умолчанию,
   т.е. на «Итоги гонки»). Табы по дням и график не участвуют. Переиспользует
   stageIsPending()/stageStartOffset() из секундомера этапа выше. */
function computeAutoScrollTab() {
    if (!_data) return null;
    if (stageIsPending('swim')) return 'swim';
    if (stageIsPending('bike_day1')) return 'bike';
    // Вело1 закрыт, вело2 ещё не начался (никто не вошёл) — целимся в
    // расчётный стартовый лист вело-2, единственная "промежуточная" вкладка.
    if (stageStartOffset('bike_day2') == null) return 'startlist';
    if (stageIsPending('bike_day2')) return 'bike';
    // Вело2 закрыт, бег ещё не начался — специальной вкладки-ожидания нет,
    // целимся сразу в «Бег» (он и станет активным этапом, когда войдут).
    if (stageStartOffset('run') == null) return 'run';
    if (stageIsPending('run')) return 'run';
    return 'overall'; // гонка полностью завершена
}

let _lastAutoScrollTab = null;
function autoScrollTabs() {
    const target = computeAutoScrollTab();
    if (!target || target === _lastAutoScrollTab) return;
    _lastAutoScrollTab = target;
    const el = document.querySelector(`#tabs [data-tab="${target}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* ──────────────── Main render ──────────────── */
function render() {
    if (!_data) return;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    // Скрыть фильтр пола при выборе Эстафеты
    const genderGroup = document.getElementById('genderGroup');
    const genderLabel = document.getElementById('genderLabel');
    const hideGender = _fmt === 'relay';
    genderGroup.style.display = hideGender ? 'none' : '';
    genderLabel.style.display = hideGender ? 'none' : '';
    document.getElementById('bikeSubTabs').style.display = _tab === 'bike' ? '' : 'none';
    document.getElementById('chartSubTabs').style.display = _tab === 'chart' ? '' : 'none';
    if (_tab === 'overall') renderOverall();
    else if (_tab === 'startlist') renderStartlist();
    else if (_tab === 'day1') renderDay1();
    else if (_tab === 'day2') renderDay2();
    else if (_tab === 'bike') {
        if (_bikeSubTab === 'combined') renderBikeCombined();
        else renderStage(_bikeSubTab);
    }
    else if (_tab === 'chart') {
        if (_chartSubTab === 'pace') renderPaceChart();
        else renderPositionChart();
    }
    else renderStage(_tab);
    autoScrollTabs();
}

/* ──────────────── Data loading ──────────────── */
async function loadYear(year) {
    _year = year;
    document.getElementById('loading').style.display = '';
    document.getElementById('app').style.display = 'none';
    try {
        const resp = await fetch(`/api/siberman/results?year=${year}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        _data = await resp.json();
        _raceStartEpoch = _data.race_start ? new Date(_data.race_start).getTime() : null;
        render();
        renderStageTimers();
    } catch(e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
    }
}

// Медленный поллинг (обновляет данные + состав активных секундомеров,
// без сетевого запроса на каждый тик) — на странице раньше не было вообще
// никакого автообновления, вся загрузка была одноразовой при открытии.
async function refreshData() {
    if (!_data) return;
    try {
        const resp = await fetch(`/api/siberman/results?year=${_year}`);
        if (!resp.ok) return;
        _data = await resp.json();
        _raceStartEpoch = _data.race_start ? new Date(_data.race_start).getTime() : null;
        render();
        renderStageTimers();
    } catch(e) { /* сеть моргнула — подождём следующего цикла поллинга */ }
}
setInterval(refreshData, 20000);
setInterval(tickStageTimers, 1000);

/* ──────────────── Event listeners ──────────────── */
document.querySelectorAll('#tabs .tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _tab = t.dataset.tab;
        render();
    });
});

document.querySelectorAll('#bikeSubTabs .tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('#bikeSubTabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _bikeSubTab = t.dataset.biketab;
        render();
    });
});

document.querySelectorAll('#chartSubTabs .tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('#chartSubTabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _chartSubTab = t.dataset.charttab;
        render();
    });
});

document.querySelectorAll('[data-fmt]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-fmt]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _fmt = btn.dataset.fmt;
        if (_fmt === 'relay') {
            document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
            document.querySelector('[data-gender="all"]').classList.add('active');
            _gender = 'all';
        }
        render();
    });
});

document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _gender = btn.dataset.gender;
        render();
    });
});

loadYear(2025);
</script>
