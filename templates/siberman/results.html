<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siberman Ultra Triathlon — Результаты 2025</title>
    <link rel="icon" href="/static/images/siberman/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/static/images/siberman/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/images/siberman/apple-touch-icon.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Фирменный шрифт (Onest) ── */
        /* Зарегистрированы только 2 реальных начертания (Light/ExtraBold).
           Остальные font-weight в этом файле (600-900 — табы/бейджи/числа)
           резолвятся браузером в ExtraBold по алгоритму CSS Fonts Level 4
           fallback-подбора (ищет вверх от запрошенного веса), а обычный
           текст (unset/400) — в Light (тот же алгоритм для диапазона
           [400,500] сначала ищет вверх до 500, не находит, затем вниз —
           попадает на 300). Поэтому НЕ нужно расставлять font-weight:300
           по всем обычным текстовым элементам вручную. */
        @font-face {
            font-family: 'Onest';
            src: url('/static/fonts/siberman/Onest-Light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Onest';
            src: url('/static/fonts/siberman/Onest-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        /* ── Brand tokens ── */
        :root {
            --navy:   #003D62;
            --red:    #BE0A21;
            --blue:   #6AABD7;
            --white:  #FFFFFF;
            --radius: 8px;
        }

        /* ── Dark theme (default) ── */
        [data-theme="dark"] {
            --bg:       #071622;
            --bg2:      #0c2035;
            --bg3:      #112840;
            --border:   rgba(106,171,215,.18);
            --text:     #e4eef6;
            --muted:    #7aaabf;
            --accent:   var(--blue);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--blue);
            --header-bg:var(--bg2);
            --dnf-op:   .45;
            --stat-val: var(--blue);
            --chart-context: rgba(106,171,215,.28);
        }

        /* ── Light theme ── */
        [data-theme="light"] {
            --bg:       #f0f5f9;
            --bg2:      #FFFFFF;
            --bg3:      #e4eef6;
            --border:   #b8d5e8;
            --text:     var(--navy);
            --muted:    #4f7f9b;
            --accent:   var(--navy);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--navy);
            --header-bg:var(--white);
            --dnf-op:   .4;
            --stat-val: var(--red);
            --chart-context: rgba(79,127,155,.28);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            transition: background .2s, color .2s;
        }

        /* ── Header ── */
        .header {
            background: var(--header-bg);
            border-bottom: 3px solid var(--red);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-block { display: flex; align-items: center; }
        .logo-img { height: 40px; width: auto; display: none; }
        [data-theme="dark"] .logo-img--dark { display: block; }
        [data-theme="light"] .logo-img--light { display: block; }
        .header-spacer { flex: 1; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .theme-btn {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); width: 34px; height: 34px; border-radius: var(--radius);
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .theme-btn:hover { background: var(--border); }

        /* ── Tabs ── */
        .tabs-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            /* Левый padding убран (был 0 20px) — на нём "sticky left:0"
               прилипает ВНУТРИ padding-области контейнера, оставляя слева
               от закреплённого таба зазор шириной с padding, сквозь
               который при скролле видны проскроллившие табы (запрошено
               пользователем 2026-07-23: "за закреплённым табом ничего не
               появлялось"). Отступ первого таба вместо этого — его
               собственный padding-left (см. .tab-pinned). */
            padding: 0 20px 0 0;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 18px;
            font-size: 13px; font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: color .15s, border-color .15s;
            text-transform: uppercase;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }
        /* Индикатор "здесь сейчас гонка" (computeAutoScrollTab) — независим
           от .active (какую вкладку выбрал пользователь): пульсирующая
           точка перед названием, тот же синий, что и бейдж "На трассе"
           (--blue). На мобильных табы уезжают за экран и до них докручивает
           autoScrollTabs() — точка там просто дублирует то же сообщение;
           на десктопе все табы и так помещаются в строку, скроллить нечего,
           и точка — единственный визуальный сигнал (запрошено пользователем
           2026-08-04).
           */
        .tab-live::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; background: var(--blue); margin-right: 6px;
            vertical-align: middle; animation: tabLivePulse 1.6s ease-in-out infinite;
        }
        @keyframes tabLivePulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        .tab .tab-dist { font-size: 10px; font-weight: 400; opacity: .7; margin-left: 4px; }
        /* "Итоги гонки" всегда виден слева при автоскролле #tabs до
           активного этапа (п.10, 2026-07-22) — порядок табов не меняется,
           просто не даём первому табу уехать из виду вместе с остальными. */
        .tab-pinned { position: sticky; left: 0; z-index: 2; background: var(--bg2); border-right: 1px solid var(--border); padding-left: 20px; }
        .tabs-bar--sub { padding: 0 20px; background: var(--bg); }
        .tabs-bar--sub .tab { padding: 8px 14px; font-size: 11px; }

        /* ── Живой секундомер этапа(ов) — теперь инлайн в шапке, на месте
           убранного year-select (2026-08-04), а не отдельной полосой на
           всю ширину. ── */
        .stage-timers { display: flex; gap: 8px; }
        .stage-timer {
            display: flex; align-items: baseline; gap: 6px;
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 6px 12px;
        }
        .stage-timer-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
        .stage-timer-val { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); }
        .stage-timer--static .stage-timer-val { color: var(--text); font-size: 13px; }
        .stage-timer--countdown .stage-timer-val { color: var(--blue); }

        /* ── График ── */
        .chart-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px;
        }
        .chart-hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
        /* Переключатель Темп/скорость↔Позиция — над самим графиком, не в
           строке "Этап:" (уточнено пользователем 2026-07-24 по скриншоту со
           стрелкой: первая реализация "варианта A" смешала переключатель со
           строкой фильтра этапа, а имелась в виду отдельная строка прямо
           над графиком/подсказкой). */
        .chart-mode-switch-row { margin-bottom: 10px; }
        /* Больше высоты + отступы сверху/снизу канваса (п.9) — с 39
           участниками на графике "Позиция" линии визуально не вписывались
           по оси Y при прежней высоте (найдено пользователем 2026-07-19). */
        .chart-canvas-wrap { position: relative; height: 620px; padding: 10px 0; }
        .chart-canvas-wrap--position { height: 720px; }
        @media (max-width: 640px) {
            .chart-canvas-wrap { height: 480px; }
            .chart-canvas-wrap--position { height: 560px; }
        }

        /* ── Сайдбар выбора участников для сравнения (п.7.2) ── */
        .chart-layout { display: flex; gap: 14px; align-items: flex-start; }
        .chart-main { flex: 1; min-width: 0; }
        /* Высота сайдбара подогнана под высоту canvas'а того же графика
           (620px/720px, см. .chart-canvas-wrap/--position) — раньше была
           фиксированной 520px независимо от графика, из-за чего заметно не
           совпадала по размеру и показывала мало участников без скролла
           (запрошено пользователем 2026-07-24). */
        .chart-sidebar {
            width: 220px; flex-shrink: 0;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg3); display: flex; flex-direction: column;
            max-height: 620px;
        }
        .chart-sidebar--tall { max-height: 720px; }
        .chart-search {
            margin: 8px; padding: 6px 10px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--bg2); color: var(--text);
            font-size: 12px; outline: none;
        }
        .chart-search:focus { border-color: var(--blue); }
        .chart-participant-list { overflow-y: auto; flex: 1; padding: 0 4px 8px; }
        .chart-participant-item {
            display: flex; align-items: center; gap: 6px; padding: 5px 8px;
            font-size: 12px; border-radius: 6px; cursor: pointer;
        }
        .chart-participant-item:hover { background: var(--bg2); }
        .chart-participant-item input { accent-color: var(--red); cursor: pointer; }
        .chart-participant-item input:disabled ~ span { opacity: .4; }
        .chart-hint-sidebar {
            margin: 6px 8px 8px; font-size: 11px; text-align: center; color: var(--muted);
        }
        .chart-select-all-btn {
            display: block; width: calc(100% - 16px); margin: 8px 8px 4px;
            padding: 5px; border-radius: 20px; border: 1px solid var(--border);
            background: transparent; color: var(--muted); font-size: 11px; cursor: pointer;
        }
        .chart-select-all-btn:hover { color: var(--text); border-color: var(--text); }
        @media (max-width: 640px) {
            .chart-layout { flex-direction: column; }
        }

        /* ── Мобильный picker участников — bottom sheet (запрошено
           пользователем 2026-07-24: инлайн-сайдбар на мобильном был слишком
           тесным). На мобильном chartSidebarHtml() рендерит ЭТУ разметку
           ВМЕСТО .chart-sidebar (взаимоисключающе, определяется через
           isMobileChartLayout() в момент рендера) — .chart-picker-mobile
           отдельно скрывать на десктопе не нужно, там она просто не
           рендерится. */
        .chart-picker-trigger {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-radius: 12px; margin-bottom: 10px;
            border: 1px solid var(--border); background: var(--bg3); color: var(--text);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .chart-picker-trigger-arrow { color: var(--muted); font-size: 16px; }
        .chart-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.5);
            z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        .chart-sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .chart-sheet {
            width: 100%; max-width: 480px; max-height: 88vh;
            background: var(--bg2); border-radius: 16px 16px 0 0;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform .25s ease;
            box-shadow: 0 -4px 24px rgba(0,0,0,.3);
        }
        .chart-sheet-overlay.open .chart-sheet { transform: translateY(0); }
        .chart-sheet-hdr {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; font-size: 14px; font-weight: 700; color: var(--text);
            border-bottom: 1px solid var(--border);
        }
        .chart-sheet-close {
            border: none; background: transparent; color: var(--muted);
            font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px;
        }
        .chart-sheet .chart-search { margin: 10px 16px; }
        .chart-sheet .chart-participant-list { padding: 0 12px 8px; }
        .chart-sheet-footer {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px 16px;
            border-top: 1px solid var(--border);
        }
        .chart-sheet-footer #chartSelectAllWrap { flex: 1; }
        .chart-sheet-footer .chart-select-all-btn { width: 100%; margin: 0; }
        .chart-sheet-done {
            flex-shrink: 0; padding: 10px 20px; border-radius: 20px; border: none;
            background: var(--red); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
        }

        /* ── Filters ── */
        /* Grid, не flex (п.4 v6, 2026-08-02): "Формат:"/"Пол:" — своя строка
           каждый, метки выровнены по общей колонке (текст встык к кнопкам,
           «Пол:» подтягивается под ширину более длинного «Формат:»), группы
           кнопок обеих строк начинаются с одного и того же x. Другие места,
           переиспользующие класс .filters с ОДНОЙ парой label+group (чарт —
           "Этап:"), визуально не меняются — grid из одной строки выглядит
           как прежний flex-row. */
        .filters {
            display: grid; grid-template-columns: auto 1fr;
            align-items: center; gap: 8px 10px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
        }
        .filter-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; text-align: right; white-space: nowrap; }
        /* flex-wrap: чтобы группы с длинными подписями (этапы: "Вело (оба
           дня)", "Вело День 1"...) на узких экранах переносились НА НОВУЮ
           СТРОКУ целиком, а не сжимались вдоль строки — иначе flex-shrink
           по умолчанию сминал кнопки до нечитаемой ширины, из-за чего
           текст переносился ВНУТРИ кнопки и она превращалась в высокую
           "карточку" (найдено пользователем 2026-07-24 на мобильной
           версии графика). flex-shrink:0 на .filter-btn — кнопки держат
           свой естественный размер и переносятся, а не сжимаются. */
        .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
        .filter-btn {
            padding: 4px 12px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
            flex-shrink: 0; white-space: nowrap;
        }
        .filter-btn:hover { color: var(--text); border-color: var(--text); }
        .filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

        /* ── Content ── */
        .content { padding: 16px 20px 48px; }

        /* ── Stats ── */
        .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px 16px;
        }
        .stat-val { font-size: 20px; font-weight: 800; color: var(--stat-val); }
        .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }

        /* Индикаторы — 2 карточки (Личники/Эстафеты), 3 строки чисел одного
           цвета убывающего размера: N (всего) → M (финишировало) → L
           (DNF/DSQ) (запрошено пользователем 2026-07-23, п.2 v5 — заменяет
           набор разрозненных плашек Участников/Финишировали/Эстафет/DNF). */
        .stats-v2 { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px 18px; min-width: 130px;
        }
        .stat-card .stat-val { font-size: 20px; font-weight: 800; color: var(--stat-val); }
        .stat-card .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }
        .stat-card .stat-sub { font-size: 13px; font-weight: 800; color: var(--stat-val); margin-top: 6px; }
        .stat-card .stat-sub2 { font-size: 11px; font-weight: 800; color: var(--stat-val); margin-top: 2px; }

        /* Время + отставание в одной ячейке (timeGapCell) — заменяет пары
           "колонка Время" + отдельная "колонка Отставание" (п.3/4, v5). */
        .time-gap-sub { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
        .time-gap-sub.lead { color: var(--red); }
        /* Рекорд (2026-08-05) — золотой акцент, отличимый от красного
           "Лидер" и серого отставания; работает и как замена "Лидер"
           (class lead+record вместе), и как отдельная третья строка. */
        .time-gap-sub.record { color: #b8860b; font-weight: 700; }
        [data-theme="dark"] .time-gap-sub.record { color: #e0b23c; }

        /* ── Table ── */
        .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--bg2); }
        thead th {
            padding: 9px 10px; text-align: left;
            font-size: 10px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .6px; font-weight: 700;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            white-space: nowrap;
        }
        /* Числовые колонки (место/№/время/отставание) — по центру, не по
           правому краю (запрошено пользователем 2026-07-23: "не нравится
           выравнивание по правой стороне"). Класс "r" сохранён как есть
           (обозначает "числовая колонка", а не буквально "right"), чтобы не
           трогать разметку всех таблиц ради переименования. */
        thead th.r { text-align: center; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--bg3); }
        tbody tr.dnf { opacity: var(--dnf-op); }
        td { padding: 9px 10px; white-space: nowrap; vertical-align: middle; }
        td.r { text-align: center; font-variant-numeric: tabular-nums; }
        /* Ячейка участника — единственная с переменным числом строк (у
           эстафеты в Итогах/Днях на одну строку меньше — нет города).
           .name-stack — вложенный блочный div (не сам td) с min-height,
           подогнанным под САМЫЙ высокий вариант (личник: имя+город+бейдж,
           3 строки, замерено через agent-browser eval на реальной
           странице). min-height НЕ вешаем на сам td (display:table-cell) —
           браузер игнорирует min-height на table-cell при расчёте высоты
           строки (подтверждено на живом сайте 2026-07-23: getComputedStyle
           показывал min-height корректно, а реальная offsetHeight всё
           равно была меньше) — известная особенность CSS Tables,
           min-height надёжно работает только на обычном block-элементе.
           display:flex + justify-content:center — короткий (2-строчный)
           контент центрируется по вертикали внутри выросшего до min-height
           блока, а не прижимается к верху. */
        .name-stack { min-height: 82px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; }

        /* Колонка "Участник" закреплена слева при горизонтальном скролле
           широких таблиц (много КТ/колонок мест — на мобильных особенно) —
           иначе теряется из виду, для какого участника показаны данные
           (запрошено пользователем 2026-08-04). Колонки левее (Место/№)
           уезжают под неё — тот же приём, что уже у .tab-pinned. Фон
           подобран под КАЖДОЕ состояние строки (hover/эстафета), иначе
           сквозь закреплённую ячейку было бы видно уехавшие соседние
           колонки/несовпадающий фон.*/
        th.name-cell, td.name-cell { position: sticky; left: 0; box-shadow: 1px 0 0 var(--border); }
        th.name-cell { z-index: 2; background: var(--bg3); }
        td.name-cell { z-index: 1; background: var(--bg2); }
        tbody tr:hover td.name-cell { background: var(--bg3); }
        tbody tr.relay-row td.name-cell { background: color-mix(in srgb, var(--blue) 14%, var(--bg2)); }

        /* Ранговая подсветка (rank-1/2/3) полностью убрана — сначала лидер
           (2026-07-22, "и так понятно, что человек первый"), затем и top-2/3
           тоже (запрошено пользователем 2026-07-23). Место видно в колонке
           "Место", отдельного цветового акцента ему не нужно. Единственная
           оставшаяся подсветка строки — у эстафетных команд, ВСЕГДА полной
           силы, независимо от места (класс rank-N в разметке ещё
           присваивается JS'ом для другой логики, но CSS больше не
           реагирует на него у обычных строк). */
        tbody tr.relay-row { background: rgba(106,171,215,.14); box-shadow: inset 3px 0 0 var(--blue); }
        tbody tr.relay-row:hover { background: var(--bg3); }

        .rank-num { font-size: 13px; font-weight: 800; color: var(--rank-col); }
        .rank-sub { font-size: 10px; color: var(--muted); display: block; }
        .bib-cell { font-weight: 700; color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
        .name-main { font-weight: 600; }
        .name-city { font-size: 11px; color: var(--muted); }
        .badge {
            display: inline-block; padding: 1px 7px; border-radius: 10px;
            font-size: 10px; font-weight: 700; letter-spacing: .3px;
        }
        .badge-m { background: rgba(0,61,98,.15); color: var(--navy); }
        [data-theme="dark"] .badge-m { background: rgba(106,171,215,.15); color: var(--blue); }
        .badge-f { background: rgba(190,10,33,.1); color: var(--red); }
        .badge-relay { background: rgba(106,171,215,.15); color: var(--blue); font-weight: 700; vertical-align: middle; }
        .badge-e { background: rgba(106,171,215,.15); color: var(--blue); }
        .badge-individual { background: rgba(190,10,33,.15); color: var(--red); font-weight: 700; }
        /* --red (#BE0A21) при одинаковой alpha даёт заметно менее контрастный
           фон на тёмном фоне, чем --blue (#6AABD7) — красные бейджи "Ж" и
           "Индивидуальный" были почти не видны в тёмной теме, акцент
           смещался на синие "Эстафета"/"М" (запрошено пользователем
           2026-07-23: бейджи должны быть равнозначны по контрасту). */
        [data-theme="dark"] .badge-f { background: rgba(190,10,33,.28); }
        [data-theme="dark"] .badge-individual { background: rgba(190,10,33,.28); }
        /* Бейдж "N предыдущих финишей Siberman" (звезда) — рядом с "Лично"
           на всех табах результатов, только личный зачёт (2026-08-05). */
        .badge-star { background: rgba(190,10,33,.15); color: var(--red); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; vertical-align: middle; }
        .badge-star img { width: 12px; height: 12px; display: block; }
        [data-theme="dark"] .badge-star { background: rgba(190,10,33,.28); }
        .badge-dnf  { background: rgba(190,10,33,.12);   color: var(--red); }
        .badge-dns  { background: rgba(120,120,130,.12); color: var(--muted); }
        .badge-notstarted { background: rgba(120,120,130,.08); color: var(--muted); }
        .badge-dsq  { background: rgba(130,80,200,.12);  color: #a78bfa; }
        .badge-fin  { background: rgba(34,197,94,.12);   color: #22c55e; }
        .badge-live { background: rgba(106,171,215,.15); color: var(--blue); }
        .time-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
        .muted { color: var(--muted); }
        .muted-sub { font-size: 11px; color: var(--muted); }

        /* Stage icon dots in overall table */
        .stage-icon { font-size: 10px; color: var(--muted); white-space: nowrap; }

        /* ── Section header ── */
        .section-hdr {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
            color: var(--muted); padding: 20px 0 8px;
            border-bottom: 1px solid var(--border); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-hdr::after { content: ''; flex: 1; height: 1px; background: var(--border); display: block; }

        /* ── Empty / loading ── */
        .empty, .loading {
            padding: 60px 20px; text-align: center;
            color: var(--muted); font-size: 15px;
        }
        .loading::before { content: ''; display: block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            .header { padding: 10px 14px; flex-wrap: wrap; row-gap: 8px; }
            .logo-img { height: 32px; }
            .stage-timer { padding: 4px 8px; gap: 4px; }
            .stage-timer-lbl { font-size: 9px; }
            .stage-timer-val { font-size: 13px; }
            .tabs-bar { padding: 0 14px 0 0; }
            .tab-pinned { padding-left: 14px; }
            .tab { padding: 10px 12px; font-size: 12px; }
            .filters { padding: 8px 14px; }
            .content { padding: 12px 14px 32px; }
            td, thead th { padding: 6px 4px; font-size: 11px; }
            thead th { font-size: 9px; }
            .name-main { font-size: 12px; }
            .name-city { font-size: 10px; }
            .rank-num { font-size: 12px; }
            .bib-cell { font-size: 11px; }
            .badge { font-size: 9px; padding: 1px 5px; }
            .time-cell { font-size: 11px; }
            /* Имя/город/бейдж всегда на отдельных строках (явные <br> в
               разметке) — колонке не нужно "переносить" текст, нужен только
               меньший минимум высоты под уменьшенные мобильные шрифты. */
            .name-stack { min-height: 65px; }
            .stat-val { font-size: 17px; }
            .stat-lbl { font-size: 9px; }
            .stat-card { padding: 8px 14px; min-width: 110px; }
            .stat-card .stat-val { font-size: 17px; }
            .stat-card .stat-lbl { font-size: 9px; }
            .stat-card .stat-sub { font-size: 12px; }
            .stat-card .stat-sub2 { font-size: 10px; }
            .tabs-bar--sub { padding: 0 14px; }
            .tabs-bar--sub .tab { padding: 7px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
    <div class="logo-block">
        <img class="logo-img logo-img--dark" src="/static/images/siberman/logo-dark.png" alt="Siberman Ultra Triathlon">
        <img class="logo-img logo-img--light" src="/static/images/siberman/logo-light.png" alt="Siberman Ultra Triathlon">
    </div>
    <div class="header-spacer"></div>
    <div class="header-controls">
        <!-- Год больше не выбирается вручную (2026-08-04) — здесь теперь
             живой секундомер этапа (или обратный отсчёт до старта, пока
             гонка не началась), см. renderStageTimers(). -->
        <div class="stage-timers" id="stageTimers" style="display:none"></div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </div>
</div>

<!-- ── Tabs ── -->
<div class="tabs-bar" id="tabs">
    <div class="tab active tab-pinned" data-tab="overall">Итоги гонки</div>
    <div class="tab" data-tab="swim">Плавание <span class="tab-dist">10 км</span></div>
    <div class="tab" data-tab="bike">Вело <span class="tab-dist">421 км</span></div>
    <div class="tab" data-tab="run">Бег <span class="tab-dist">84 км</span></div>
    <div class="tab" data-tab="day1">Итог 1 дня <span class="tab-dist">155 км</span></div>
    <div class="tab" data-tab="day2">Итог 2 дней <span class="tab-dist">431 км</span></div>
    <div class="tab" data-tab="chart">График</div>
    <div class="tab" data-tab="startlist">День 2: Стартовый лист</div>
</div>
<!-- Подвкладки "Вело" — свод по обоим дням / по-дневная разбивка -->
<div class="tabs-bar tabs-bar--sub" id="bikeSubTabs" style="display:none">
    <div class="tab active" data-biketab="combined">Вело итого</div>
    <div class="tab" data-biketab="bike1">Вело День 1 <span class="tab-dist">145 км</span></div>
    <div class="tab" data-biketab="bike2">Вело День 2 <span class="tab-dist">276 км</span></div>
</div>

<!-- ── Filters ── -->
<div class="filters" id="mainFiltersBar">
    <span class="filter-label">Формат:</span>
    <div class="filter-group" id="fmtGroup">
        <button class="filter-btn active" data-fmt="all">Все</button>
        <button class="filter-btn" data-fmt="individual">Лично</button>
        <button class="filter-btn" data-fmt="relay">Эстафета</button>
    </div>
    <span class="filter-label" id="genderLabel">Пол:</span>
    <div class="filter-group" id="genderGroup">
        <button class="filter-btn active" data-gender="all">Все</button>
        <button class="filter-btn" data-gender="M">Мужчины</button>
        <button class="filter-btn" data-gender="F">Женщины</button>
    </div>
</div>

<!-- ── Content ── -->
<div class="content">
    <div class="loading" id="loading"></div>
    <div id="app" style="display:none"></div>
</div>

<script src="/static/lib/chart4/chart.umd.min.js"></script>
<script src="/static/js/siberman-common.js?v={{ v }}"></script>
<script>
/* ──────────────── State ──────────────── */
let _data = null;
let _tab = 'overall';
let _bikeSubTab = 'combined';
let _fmt = 'all';
let _gender = 'all';
let _year = 2025;
let _raceStartEpoch = null; // мс, из _data.race_start (ISO) — якорь для секундомеров этапов
// Расписание Вело Дня 2 / Бега (задаётся в админке, необязательно) —
// используется ТОЛЬКО индикатором активного таба (computeAutoScrollTab/
// computeAutoScrollLiveTabs), не влияет на статусы/секундомер выше.
let _bike2StartEpoch = null;
let _runStartEpoch = null;
// Индекс рекордов "column_key:category" → запись, построен из
// _data.records (buildRecordsIndex, siberman-common.js) при каждой
// загрузке/обновлении данных (2026-08-05).
let _recordsIndex = {};
// Сериализованный снимок последних загруженных данных — refreshData()
// перерисовывает страницу (и графики) ТОЛЬКО когда данные реально
// изменились, а не на каждый тик поллинга (иначе Chart.js пересоздаётся
// каждые 20с даже без изменений — видимое "дёрганье" графика, п.1 2026-07-22).
let _lastDataJson = null;
let _chartSubTab = 'position';
let _paceStage = 'swim';
let _positionStage = null; // null = "Вся гонка"; иначе один из STAGE_ORDER
let _paceChart = null;
let _positionChart = null;
// Мультивыбор для сравнения на графике (п.7.2/п.8) — объявлены на верхнем
// уровне (не внутри render-функций), поэтому переживают и render(), и
// периодический refreshData() без сброса; порядок в массиве = порядок
// добавления, от него зависит закреплённый цвет (см. chartCompareColor).
let _chartSelectedBibs = [];
let _chartSearchQuery = '';
let _lastChartDatasets = []; // для лёгкого обновления списка участников без пересборки графика
// На мобильном (<=640px) сайдбар выбора участников заменяется bottom sheet
// (запрошено пользователем 2026-07-24 — инлайн-окно было слишком тесным);
// _chartSheetOpen переживает render() так же, как _chartSelectedBibs, иначе
// выбор чекбокса (который вызывает render()) закрывал бы шторку.
let _chartSheetOpen = false;

/* ──────────────── Theme ──────────────── */
siInitTheme();

/* ──────────────── Переход на страницу участника ──────────────── */
function participantLink(bib) {
    return `/participant/${bib}?year=${_year}`;
}

// Индикаторы — 2 карточки (Личники/Эстафеты, п.2 v5, 2026-07-23), каждая
// со своими N (всего) / M (финишировало) / L (DNF+DSQ). relayStats
// {total,finished,dnfDsq} ПРЕДВЫЧИСЛЯЕТСЯ каждым вызывающим кодом — форма
// relay-данных отличается по контексту (team-объекты на командных
// таблицах vs персонифицированные участники роли на этапах/Своде вело),
// buildStats не пытается угадывать её единообразно (см. план 2026-07-23).
// Карточка скрывается целиком, если её total === 0.
// maxStage — для "Дней" (граница дня) и Свода вело ('bike_day2', вся
// объединённая дистанция) — статус личника считается ОТНОСИТЕЛЬНО ЭТОГО
// СРЕЗА (dayStatus), а не всей гонки. Для вкладок этапов используется
// stageKey (stageRelativeStatus) — та же логика, что и в бейдже строки
// (statusBadge). Раньше DNF/финишировало на индикаторах считались по
// статусу ВСЕЙ ГОНКИ одинаково на каждой вкладке (2026-08-03, п.1 v7,
// найдено на реальном использовании — сошедший на беге показывал DNF
// даже на вкладке "Плавание", которую честно финишировал).
function buildStats(individual, relayStats, stageKey, maxStage) {
    const relStatus = r => maxStage ? dayStatus(r, maxStage) : stageRelativeStatus(r, stageKey);
    const isFinishedSlice = r => {
        if (stageKey) return lastReached(r.cp, TAB_TO_DB_STAGE[stageKey])?.seq === STAGE_MAX_SEQ[TAB_TO_DB_STAGE[stageKey]];
        const pos = racePos(r, maxStage ?? null);
        if (maxStage) return pos?.stageIdx === STAGE_ORDER.indexOf(maxStage) && pos?.seq === STAGE_MAX_SEQ[maxStage];
        return pos?.seq === STAGE_MAX_SEQ.run;
    };
    const finInd = individual.filter(r => relStatus(r) === 'active' && isFinishedSlice(r)).length;
    const dnfCount = individual.filter(r => relStatus(r) === 'dnf').length;
    const dsqCount = individual.filter(r => r.status === 'dsq').length;
    const indDnfDsq = dnfCount + dsqCount;
    let html = `<div class="stats-v2">`;
    if (individual.length > 0) {
        html += `<div class="stat-card">
            <div class="stat-val">${individual.length}</div><div class="stat-lbl">Лично</div>
            <div class="stat-sub">${finInd} финишировало</div>
            <div class="stat-sub2">${indDnfDsq} DNF/DSQ</div>
        </div>`;
    }
    if (relayStats.total > 0) {
        html += `<div class="stat-card">
            <div class="stat-val">${relayStats.total}</div><div class="stat-lbl">Эстафеты</div>
            <div class="stat-sub">${relayStats.finished} финишировало</div>
            <div class="stat-sub2">${relayStats.dnfDsq} DNF/DSQ</div>
        </div>`;
    }
    html += `</div>`;
    return html;
}

// Время + отставание в одной ячейке (не отдельной колонкой) — п.3/4 v5,
// 2026-07-23. timeStr — уже отформатированная строка (fmtTime/'—'),
// gapSeconds — секунды отставания от лидера пула, null если сравнивать
// не с чем (участник не дошёл/лидер).
// recordCats — категории рекорда (recordCategoriesFor), которые держит
// ИМЕННО этот участник на этой колонке, или undefined/[] — без рекорда.
// Лидер+рекордсмен → "Рекорд: ..." ВМЕСТО "Лидер" (не рядом); рекордсмен
// без лидерства → "Рекорд: ..." ТРЕТЬЕЙ строкой под отставанием (запрошено
// пользователем 2026-08-05).
function timeGapCell(timeStr, gapSeconds, recordCats) {
    if (timeStr === '—' || timeStr == null) return '<span class="muted">—</span>';
    const hasRecord = recordCats && recordCats.length > 0;
    const recordLine = hasRecord ? `<span class="time-gap-sub record">🏆 ${recordLabelText(recordCats)}</span>` : '';
    if (gapSeconds == null) return `<span class="time-main">${timeStr}</span>${recordLine}`;
    if (gapSeconds === 0) {
        const leadHtml = hasRecord
            ? `<span class="time-gap-sub lead record">🏆 ${recordLabelText(recordCats)}</span>`
            : '<span class="time-gap-sub lead">Лидер</span>';
        return `<span class="time-main">${timeStr}</span>${leadHtml}`;
    }
    return `<span class="time-main">${timeStr}</span><span class="time-gap-sub">${fmtGap(gapSeconds)}</span>${recordLine}`;
}

/* ──────────────── Filter helpers ──────────────── */
function getFiltered() {
    if (!_data) return { individual: [], relay: [] };
    let ind = _data.individual;
    if (_fmt === 'relay') ind = [];
    else if (_gender !== 'all') ind = ind.filter(r => r.gender === _gender);
    const rel = _fmt === 'individual' ? [] : _data.relay;
    return { individual: ind, relay: rel };
}

/* ──────────────── Render: Overall ──────────────── */
const STAGE_LABEL_RU = { swim: 'Плавание', bike: 'Вело (оба дня)', bike_day1: 'Вело 1', bike_day2: 'Вело 2', run: 'Бег' };

// Двухстрочная ячейка "Отметка" для Итогов гонки: название этапа первой
// строкой (этап на Итогах меняется от строки к строке — не зафиксирован,
// как на вкладках этапов), "N км (m круг)"/"N км (Финиш)" второй —
// формат по запросу пользователя 2026-08-02 отличается от lastCpTwoLineHtml
// (там круг/финиш на СВОЕЙ строке) — здесь km и круг/финиш в одной строке.
function overallLastCpHtml(dbStage, seq) {
    if (!dbStage || seq == null) return '—';
    const km = CHECKPOINT_DIST_KM[dbStage][seq];
    const isFinish = seq === STAGE_MAX_SEQ[dbStage];
    const lapN = dbStage === 'swim' ? SWIM_LAP_SEQS[seq] : dbStage === 'run' ? seq : null;
    const suffix = isFinish ? ' (Финиш)' : lapN ? ` (${lapN} ${_circleWord(lapN)})` : '';
    return `<div>${STAGE_LABEL_RU[dbStage]}</div><div class="muted-sub">${String(km).replace('.', ',')} км${suffix}</div>`;
}

// Место — генерик-рендерер колонок мест. show2=false → одна колонка
// "Место"; show2=true → две колонки "Место"+secondaryLabel (пол/формат,
// решает вызывающий код). secondaryBadge — HTML готового бейджа буквы
// (genderBadge(gender) или formatBadge()) — тоже решает вызывающий код,
// эта функция не знает, эстафета строка или личник. Порядок колонок
// больше не меняется (swap убран п.7 v6, 2026-08-02) — "Место" всегда
// первая колонка, когда обе колонки вообще показаны.
// Обе rank-колонки — class="r" (числовые, выравнивание по центру, как и
// остальные числовые колонки). Мобильная версия показывает те же колонки,
// что и десктоп — никакого (отменено 2026-07-23, п.1 v5).
function rankHeaderCells(show2, secondaryLabel) {
    if (!show2) return '<th class="r">Место</th>';
    return `<th class="r">Место</th><th class="r">${secondaryLabel}</th>`;
}
function rankBodyCells(show2, rankAbs, rankSecondary, secondaryBadge, rc) {
    const a = `<span class="rank-num ${rc}">${rankAbs ?? '—'}</span>`;
    if (!show2) return `<td class="r">${a}</td>`;
    const s = rankSecondary != null ? `<span class="rank-num ${rc}">${secondaryBadge}${rankSecondary}</span>` : '<span class="muted">—</span>';
    return `<td class="r">${a}</td><td class="r">${s}</td>`;
}

// Подпись второй колонки места на Итогах/Днях, когда она вообще
// показывается (см. showSecondaryRank — при fmt==='relay' вторая колонка
// не показывается никогда, п.7 v6, поэтому ветка на этот случай не нужна).
function overallSecondaryLabel() {
    return _fmt === 'individual' ? 'Место (пол)' : 'Пол/Формат';
}
// Вторая колонка места на Итогах/Днях — только когда Пол=Все И Формат не
// Эстафета (у эстафеты в Итогах/Днях нет личного пола, показывать нечего;
// в остальных случаях — по явному запросу пользователя, п.7 v6, 2026-08-02).
function showSecondaryRank() { return _gender === 'all' && _fmt !== 'relay'; }

// stageGaps — {swim,bike1,bike2,run,bikeCombined} каждая {bib: секунды} от
// computeStageGaps()/bikeCombinedGaps() по ПОЛНОМУ объединённому пулу
// личники+эстафета (см. renderOverall) — у каждой временной колонки своё
// отставание (п.3, v5, 2026-07-23), не только у итогового времени.
function buildIndividualOverallRow(r, overallGaps, combinedRanks, combinedGenderRanks, stageGaps) {
    // "Итого" — живое накопленное время гонки на ТЕКУЩЕЙ позиции
    // (racePos), а не серверное overall_s (которое null всю гонку до
    // полного финиша всех 4 этапов) — сходится с overall_s ровно в
    // момент финиша (globalProgress на последней КТ бега == сумме всех
    // этапов). Считается и для DNF/DSQ (их собственное "застывшее" время
    // — правило "кирпич", просто без отставания/лидерства, см. ниже).
    const pos = racePos(r, null);
    const liveTotal = pos ? pos.value : null;
    const rc = r.status === 'active' && combinedRanks[r.bib] != null ? rankClass(combinedRanks[r.bib]) : '';
    const cur = currentStage(r);
    const cpPos = cur ? lastReached(r.cp, cur) : null;
    const lastCpCell = overallLastCpHtml(cur, cpPos?.seq);
    return `<tr class="${rc}${r.status !== 'active' ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(r.bib)}','_blank')">
        ${rankBodyCells(showSecondaryRank(), combinedRanks[r.bib], combinedGenderRanks[r.gender]?.[r.bib], genderBadge(r.gender), rc)}
        <td class="bib-cell">${r.bib}</td>
        <td class="name-cell"><div class="name-stack">
            <span class="name-main">${r.surname} ${r.name} ${finishStarBadge(r)}</span>
            ${cityLabel(r) ? `<span class="name-city">${cityLabel(r)}</span>` : ''}
            <span class="badge badge-individual">Лично</span>
        </div></td>
        <td class="r time-cell" style="font-weight:800">${timeGapCell(fmtTime(liveTotal), overallGaps[r.bib], recordCategoriesFor(_recordsIndex, 'overall', r.surname, r.name))}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(r.swim_s), stageGaps.swim[r.bib], recordCategoriesFor(_recordsIndex, 'swim', r.surname, r.name))}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(r.bike1_s), stageGaps.bike1[r.bib])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(r.bike2_s), stageGaps.bike2[r.bib])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(bikeCombinedLastPos(r)?.value ?? null), stageGaps.bikeCombined[r.bib], recordCategoriesFor(_recordsIndex, 'bike_total', r.surname, r.name))}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(r.run_s), stageGaps.run[r.bib], recordCategoriesFor(_recordsIndex, 'run', r.surname, r.name))}</td>
        <td class="muted">${lastCpCell}</td>
        <td>${statusBadge(r, null)}</td>
    </tr>`;
}

// Эстафета в Итогах гонки — ОДНА строка (название команды), как и у
// личников, без развёрнутого списка участников по ролям (см. п.14
// задачи 2026-07-19). formatRanks — новое: место среди только эстафетных
// команд (computeRanksByValue по live-позиции ТОЛЬКО эстафеты, полный
// ростер года — не зависит от текущих фильтров, тот же принцип что
// combinedRanks).
function buildRelayOverallRow(team, overallGaps, combinedRanks, formatRanks, stageGaps) {
    const tr = teamGapRow(team);
    const pos = racePos(tr, null);
    const liveTotal = pos ? pos.value : null;
    // Рекорд каждого столбца принадлежит КОНКРЕТНОМУ члену команды (у
    // разных этапов — разные люди), не команде целиком — "гонка" (overall)
    // у эстафеты не считается вовсе (это личное достижение, см. service.py
    // _update_records, 2026-08-05).
    const swimM = team.members.find(m => m.relay_stage === 'swim');
    const bikeM = team.members.find(m => m.relay_stage === 'bike');
    const runM = team.members.find(m => m.relay_stage === 'run');
    const rc = tr.status === 'active' && combinedRanks[team.bib] != null ? rankClass(combinedRanks[team.bib]) : '';
    const cur = currentStage(tr);
    const cpPos = cur ? lastReached(tr.cp, cur) : null;
    const lastCpCell = overallLastCpHtml(cur, cpPos?.seq);
    const statusCell = teamStatusBadge(team);
    return `<tr class="relay-row ${rc}${tr.status !== 'active' ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(team.bib)}','_blank')">
        ${rankBodyCells(showSecondaryRank(), combinedRanks[team.bib], formatRanks[team.bib], formatBadge(), rc)}
        <td class="bib-cell">${team.bib}</td>
        <td class="name-cell"><div class="name-stack">
            <span class="name-main">${team.team_name}</span>
            <span class="badge badge-relay">Эстафета</span>
        </div></td>
        <td class="r time-cell" style="font-weight:800">${timeGapCell(fmtTime(liveTotal), overallGaps[team.bib])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(tr.swim_s), stageGaps.swim[team.bib], swimM ? recordCategoriesFor(_recordsIndex, 'swim', swimM.surname, swimM.name) : [])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(tr.bike1_s), stageGaps.bike1[team.bib])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(tr.bike2_s), stageGaps.bike2[team.bib])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(bikeCombinedLastPos(tr)?.value ?? null), stageGaps.bikeCombined[team.bib], bikeM ? recordCategoriesFor(_recordsIndex, 'bike_total', bikeM.surname, bikeM.name) : [])}</td>
        <td class="r time-cell muted">${timeGapCell(fmtTime(tr.run_s), stageGaps.run[team.bib], runM ? recordCategoriesFor(_recordsIndex, 'run', runM.surname, runM.name) : [])}</td>
        <td class="muted">${lastCpCell}</td>
        <td>${statusCell}</td>
    </tr>`;
}

// Объединяет личников и эстафету в порядок отображения: финишировавшие обоих
// типов перемежаются по времени (единый список по месту), затем не
// финишировавшие личники (свой порядок sortByStatus), затем команды без
// результатов — в конце. Возвращает массив {type, entry}.
function buildMergedOverallEntries(individual, relay) {
    // _liveSortKey — закодированная live-позиция (raceSortKey), а не
    // overall_s — иначе личники всю гонку оставались бы в исходном
    // порядке (overall_s==null у всех до полного финиша), см. 2026-08-03.
    const indWithKey = individual.map(r => ({ ...r, _liveSortKey: raceSortKey(racePos(r, null)) }));
    const indSorted = sortByStatus(indWithKey, '_liveSortKey');
    if (_fmt !== 'all') {
        // Только один тип виден — смешивать нечего.
        return [
            ...indSorted.map(r => ({ type: 'individual', entry: r })),
            ...relay.map(t => ({ type: 'relay', entry: t })),
        ];
    }
    const indFinished = indSorted.filter(r => r._liveSortKey != null && r.status === 'active');
    const indRest = indSorted.filter(r => !(r._liveSortKey != null && r.status === 'active'));
    const relWithKey = relay.map(t => ({ t, tr: teamGapRow(t), key: raceSortKey(racePos(teamGapRow(t), null)) }));
    const relFinished = relWithKey.filter(x => x.key != null && x.tr.status === 'active').sort((a, b) => a.key - b.key).map(x => x.t);
    const relRest = relWithKey.filter(x => !(x.key != null && x.tr.status === 'active')).map(x => x.t);

    const interleaved = [
        ...indFinished.map(r => ({ type: 'individual', entry: r, _k: r._liveSortKey })),
        ...relFinished.map(t => ({ type: 'relay', entry: t, _k: raceSortKey(racePos(teamGapRow(t), null)) })),
    ].sort((a, b) => a._k - b._k);

    return [
        ...interleaved.map(({ type, entry }) => ({ type, entry })),
        ...indRest.map(r => ({ type: 'individual', entry: r })),
        ...relRest.map(t => ({ type: 'relay', entry: t })),
    ];
}

const OVERALL_TABLE_HEAD = () => `<thead><tr>
    ${rankHeaderCells(showSecondaryRank(), overallSecondaryLabel())}<th class="r">№</th><th class="name-cell">Участник</th>
    <th class="r">Итого</th>
    <th class="r">🏊 Плав.</th>
    <th class="r">🚴 Вело 1</th>
    <th class="r">🚴 Вело 2</th>
    <th class="r">🚴 Вело итого</th>
    <th class="r">🏃 Бег</th>
    <th>Отметка</th>
    <th>Статус</th>
</tr></thead>`;

function renderOverall() {
    const filtered = getFiltered();
    const individual = filtered.individual;
    // Эстафетная команда не имеет единого пола — при выбранном фильтре
    // пола команды в Финале не показываем вовсе (не "какого-то одного пола").
    const relay = _gender === 'all' ? filtered.relay : [];
    // DNF/DSQ (общий статус гонки) не участвуют в расчёте отставаний нигде
    // (ни как лидер, ни как получатель отставания) — показывают только своё
    // сырое время, без "+X"/"Лидер" (запрошено пользователем 2026-08-02:
    // Дащенко с DNF ошибочно получала "Лидер" в колонке "Бег" — её частичное
    // время оказывалось меньше настоящих финишных времён активных бегунов).
    const activeIndividual = individual.filter(r => r.status === 'active');
    const activeRelay = relay.filter(t => teamGapRow(t).status === 'active');
    const overallGaps = computeOverallGaps([
        ...activeIndividual.map(r => ({ key: r.bib, cp: r.cp, status: r.status, swim_s: r.swim_s, bike1_s: r.bike1_s, bike2_s: r.bike2_s, run_s: r.run_s })),
        ...activeRelay.map(teamGapRow),
    ]);
    // Единое место по всей гонке (личники+эстафета) — среди ВИДИМЫХ строк
    // (individual/relay уже отфильтрованы по формату/полу выше), тот же
    // откат, что и на вкладках этапов/Свода вело: "Место" не должно
    // учитывать невидимых участников (запрошено пользователем 2026-07-24 —
    // при фильтре "Личный" отсутствующие в зачёте эстафетчики "съедали"
    // номера мест, вызывая пропуски 1,2,3,5,7...). Раньше считалось по
    // полному ростеру года независимо от фильтров — намеренно, чтобы место
    // не "плавало" при переключении фильтров, но это оказалось нежелательно.
    // Теперь считается через racePos/raceSortKey (живая позиция в гонке),
    // а не через overall_s — иначе личники не получали место вообще, пока
    // не финишируют ВСЮ гонку целиком (2026-08-03).
    const combinedRanks = computeCombinedOverallRanks(combinedOverallRankRows(individual, relay), null);
    // Место по полу внутри объединённого пула (личники+эстафета мужского/
    // женского пола нет смысла — считаем только среди личников каждого
    // пола) — раньше бралось из серверного r.overall_rank_g (тоже null до
    // полного финиша), теперь тем же combinedRanks-примитивом на срезе по полу.
    const combinedGenderRanks = {
        M: computeCombinedOverallRanks(combinedOverallRankRows(individual.filter(r => r.gender === 'M'), []), null),
        F: computeCombinedOverallRanks(combinedOverallRankRows(individual.filter(r => r.gender === 'F'), []), null),
    };
    // Формат-ранг — место команды среди ТОЛЬКО эстафетных команд — тоже
    // среди видимых (relay уже пуст, если фильтр пола активен — тогда и
    // сама колонка формата не отображается), тоже по живой позиции.
    const relayFormatRanks = computeRanksByValue(relay.map(t => ({ key: t.bib, val: raceSortKey(racePos(teamGapRow(t), null)), status: teamGapRow(t).status })));
    const relayStats = {
        total: relay.length,
        finished: relay.filter(t => teamGapRow(t).status === 'active' && racePos(teamGapRow(t), null)?.seq === STAGE_MAX_SEQ.run).length,
        dnfDsq: relay.filter(t => teamGapRow(t).status === 'dnf').length,
    };
    let html = buildStats(individual, relayStats, null);

    if (individual.length === 0 && relay.length === 0) {
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';
        document.getElementById('app').innerHTML = html;
        return;
    }

    // Отставание по каждой временной колонке отдельно — та же живая
    // checkpoint-based модель, что и общее "Итого" (computeStageGaps/
    // bikeCombinedGaps), НЕ простое вычитание сырых полей (2026-08-03:
    // раньше fieldGaps сравнивал swim_s/bike1_s/... напрямую — неверно
    // для участников на РАЗНЫХ КТ, см. posSortKey).
    const stageGapPool = [
        ...activeIndividual.map(r => ({ key: r.bib, cp: r.cp, swim_s: r.swim_s, status: 'active' })),
        ...activeRelay.map(t => ({ key: t.bib, cp: teamGapRow(t).cp, swim_s: teamGapRow(t).swim_s, status: 'active' })),
    ];
    const bikeCombinedGapPool = [
        ...activeIndividual.map(r => ({ key: r.bib, entry: r, status: 'active' })),
        ...activeRelay.map(t => ({ key: t.bib, entry: teamGapRow(t), status: 'active' })),
    ];
    const stageGaps = {
        swim: computeStageGaps(stageGapPool, 'swim'),
        bike1: computeStageGaps(stageGapPool, 'bike_day1'),
        bike2: computeStageGaps(stageGapPool, 'bike_day2'),
        bikeCombined: bikeCombinedGaps(bikeCombinedGapPool),
        run: computeStageGaps(stageGapPool, 'run'),
    };

    // Единый порядок отображения (интерливинг при _fmt==='all', иначе просто
    // один тип) — личники и эстафета теперь однородные строки одной таблицы.
    const merged = buildMergedOverallEntries(individual, relay);
    html += `<div class="table-wrap"><table>${OVERALL_TABLE_HEAD()}<tbody>`;
    merged.forEach(item => {
        html += item.type === 'individual'
            ? buildIndividualOverallRow(item.entry, overallGaps, combinedRanks, combinedGenderRanks, stageGaps)
            : buildRelayOverallRow(item.entry, overallGaps, combinedRanks, relayFormatRanks, stageGaps);
    });
    html += '</tbody></table></div>';

    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Stage ──────────────── */
// Рекорд Siberman хранится только для 4 колонок (см. 006_records.sql):
// 'overall'/'swim'/'bike_total'/'run' — Вело1/Вело2 порознь рекорда не
// имеют (только объединённый "Вело итого", см. Свод вело).
const STAGE_TO_RECORD_COLUMN = { swim: 'swim', run: 'run' };
const STAGE_CFG = {
    // rank/rank_g из БД (per-этап, только личники) больше не используются
    // для отображения "Место"/"По полу" — заменены единым computeRanksByValue
    // по личники+эстафетчики вместе (см. stageAbsRanks/stageGenderRanks ниже),
    // иначе места дублировались при интерливинге в общий список.
    swim:  { timeKey: 'swim_s',  metaKey: 'swim_pace',   metaFn: fmtPace100m, metaLbl: 'Темп',     relayStage: 'swim' },
    bike1: { timeKey: 'bike1_s', metaKey: 'bike1_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    bike2: { timeKey: 'bike2_s', metaKey: 'bike2_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    run:   { timeKey: 'run_s',   metaKey: 'run_pace',    metaFn: fmtPace,     metaLbl: 'Темп',     relayStage: 'run'  },
};

function renderStage(stage) {
    const cfg = STAGE_CFG[stage];
    const dbStage = TAB_TO_DB_STAGE[stage];
    const maxSeq = STAGE_MAX_SEQ[dbStage];
    const { individual, relay } = getFiltered();

    // ОТКЛЮЧЕНО НА ВРЕМЯ ЖИВОЙ ГОНКИ (2026-08-03): раньше здесь была "тихая"
    // подмена status на 'dnf' для любого participant.status==='active' в
    // БД, кто ещё не дошёл до финишной КТ этапа — задумано для архивных
    // данных (поймать того, кто молча сошёл, а организатор забыл явно
    // пометить DNF в Excel). Во время ЖИВОЙ гонки это условие истинно
    // почти для КАЖДОГО реально активного участника (он просто ещё не
    // финишировал этап прямо сейчас) — подмена делала тусклыми/DNF-
    // бейджами почти всех активных участников на этапах. Пока гонка идёт,
    // доверяем только явному статусу из файла; _rawStatus сохранён для
    // обратной совместимости с остальным кодом этой функции (сейчас всегда
    // совпадает с status).
    const withStageStatus = r => ({ ...r, _rawStatus: r.status });

    // _sortTime — закодированный ключ "дальше+быстрее" (posSortKey), а не
    // "сырое" время на последней КТ — иначе только что стартовавший этап
    // (маленькое накопленное время) ошибочно обгонял бы того, кто прошёл
    // намного дальше (2026-08-03, тестовый прогон живых данных). Работает
    // одинаково для ещё бегущих и уже финишировавших — для финишировавших
    // вырождается в обычное сравнение по времени.
    const withSortTime = r => ({ ...r, _sortTime: posSortKey(stagePos(r, dbStage)) });
    const rows = sortByStatus(individual.map(withStageStatus).map(withSortTime), '_sortTime');
    // Собственная сортировка здесь больше не нужна (была раньше, до
    // 2026-08-03) — итоговый порядок строк личников+эстафетчиков вместе
    // строится ниже, в orderedRows, единым posSortKey-сравнением.
    // swimCp/bikeCp команды подмешиваются в cp эстафетчика ЭТОЙ роли —
    // нужно только для stageHasStarted (STAGE_PRIOR_FINISH проверяет
    // ПРЕДЫДУЩИЙ этап, а у велосипедиста/бегуна эстафеты своих КТ на нём
    // нет, он не плыл/не крутил день 2 сам — это делал другой член команды).
    const relayMembers = _fmt !== 'individual'
        ? relay.flatMap(t => {
            const swimCp = t.members.find(x => x.relay_stage === 'swim')?.cp?.swim;
            const bikeCp = t.members.find(x => x.relay_stage === 'bike')?.cp?.bike_day2;
            return t.members
                .filter(m => m.relay_stage === cfg.relayStage && (_gender === 'all' || m.gender === _gender))
                .map(m => withStageStatus({
                    ...m, _bib: t.bib, _team: t.team_name,
                    cp: { ...m.cp, swim: m.cp?.swim ?? swimCp, bike_day2: m.cp?.bike_day2 ?? bikeCp },
                }));
        })
        : [];

    if (rows.length === 0 && relayMembers.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Нет данных</div>';
        return;
    }

    // Отставание — общий пул личников этой роли + эстафетчиков той же роли,
    // т.к. они соревнуются на этапе вместе (как и старт вело-2 в задаче 2).
    // Настоящий DNF/DSQ (_rawStatus) исключается из пула целиком — не
    // просто "не кандидат в лидеры", а вообще без отставания (запрошено
    // пользователем 2026-08-02: сошедшие показывают только своё время).
    // "Тихий" DNF (ещё активный, просто не дошёл до финиша ЭТОГО этапа
    // прямо сейчас) в исключение НЕ попадает — у него живое отставание
    // работает как раньше (_rawStatus у него остаётся 'active').
    const gapPool = [
        ...rows.filter(r => r._rawStatus === 'active').map(r => ({ key: r.bib, cp: r.cp, swim_s: r.swim_s, status: 'active' })),
        ...relayMembers.filter(m => m._rawStatus === 'active').map(m => ({ key: `${m._bib}:${m.relay_stage}`, cp: m.cp, swim_s: m.swim_s, status: 'active' })),
    ];
    const gaps = computeStageGaps(gapPool, TAB_TO_DB_STAGE[stage]);

    const showStart = stage === 'bike2';


    // "Абсолют"/"По полу"/"Формат" — ранги СРЕДИ ВИДИМЫХ строк (rows +
    // relayMembers, уже отфильтрованы по текущим _fmt/_gender), не по
    // полному ростеру этапа — полный откат к фильтро-зависимому месту
    // (запрошено пользователем 2026-07-23: "Место" при фильтре "Личный"
    // не пересчитывалось, всё ещё учитывало невидимых эстафетчиков).
    // Данные о "невидимом" участнике не должны влиять на нумерацию мест
    // в таблице, где он не показан.
    // status: r._rawStatus (не r.status) — r.status здесь может быть "тихо"
    // подменён withStageStatus на 'dnf' для ЛЮБОГО реально активного
    // участника, который прямо сейчас ещё не дошёл до финишной КТ ЭТОГО
    // этапа (например, буквально плывёт прямо сейчас) — это управляет
    // бейджем/CSS-классом строки и остаётся как есть, но НЕ должно лишать
    // его места в ранжировании: реально активный участник, лидирующий по
    // live-прогрессу, обязан получать номер места, а не "—" (иначе вся
    // "живая" сортировка этой задачи была бы бессмысленна — see: тест
    // "место считается для АКТИВНЫХ мид-этапа", найдено 2026-08-03).
    // Настоящий DNF/DSQ (_rawStatus не 'active') по-прежнему исключается.
    const visibleIndRows = rows.map(r => ({ key: r.bib, val: posSortKey(stagePos(r, dbStage)), status: r._rawStatus, gender: r.gender, isRelay: false }));
    const visibleRelayRows = relayMembers.map(m => ({ key: `${m._bib}:${m.relay_stage}`, val: posSortKey(stagePos(m, dbStage)), status: m._rawStatus, gender: m.gender, isRelay: true }));
    const visibleStageRows = [...visibleIndRows, ...visibleRelayRows];
    const stageAbsRanks = computeRanksByValue(visibleStageRows);
    const stageGenderRanks = {
        M: computeRanksByValue(visibleStageRows.filter(x => x.gender === 'M')),
        F: computeRanksByValue(visibleStageRows.filter(x => x.gender === 'F')),
    };
    const stageGenderRankFor = (key, gender) => stageGenderRanks[gender]?.[key];

    // Статистика ("Команд"/"Эстафет"/"Финишировали") на вкладке этапа должна
    // отражать ТЕКУЩИЙ фильтр по полу — здесь команда представлена
    // конкретным участником нужной роли (relayMembers, уже отфильтрован по
    // _gender выше), а не собой целиком; передаём "финишировал ЭТОТ этап"
    // (m[cfg.timeKey]), не общее overall_s (найдено пользователем
    // 2026-07-23, п.9 — раньше stats всегда показывала полный relay.length
    // независимо от фильтра пола, например неизменные "13 команд").
    const relayStatsStage = {
        total: relayMembers.length,
        finished: relayMembers.filter(m => lastReached(m.cp, dbStage)?.seq === maxSeq).length,
        dnfDsq: relayMembers.filter(m => m.status === 'dnf' || m.status === 'dsq').length,
    };
    let html = buildStats(individual, relayStatsStage, stage);

    // "Место" всегда = stageAbsRanks (ранг внутри ВИДИМОГО пула) — при
    // активном фильтре по полу видимый пул уже однополый, так что
    // абсолютный ранг внутри него и есть ранг по полу (п.7 v6, 2026-08-02:
    // 3-колоночный режим для эстафеты убран — эстафетчик персонифицирован
    // на этой вкладке точно так же, как личник).
    const showGenderCol = _gender === 'all';

    const buildIndividualStageRow = r => {
        const t = r[cfg.timeKey];
        const noTime = t == null;
        const rc = noTime ? '' : rankClass(stageAbsRanks[r.bib]);
        const pos = stagePos(r, dbStage);
        // "Отметка" на "Бег" учитывает субметки Copernico "-500м до круга"
        // — везде остальном (ранги/темп/статус) остаётся круговой pos.
        const lastCpPos = dbStage === 'run' ? lastReachedIncludingSubmarks(r.cp, dbStage) : pos;
        const lastCpCell = lastCpTwoLineHtml(dbStage, lastCpPos?.seq);
        // Темп/скорость — из ЖИВОЙ позиции (пройденная дистанция / сетевое
        // время до неё), а не из серверного r[cfg.metaKey]: то поле
        // (avg_pace_s/avg_speed_kmh) считается как "дистанция ВСЕГО этапа
        // / total_s" — корректно только для уже финишировавших, а на живой
        // гонке total_s почти всегда лишь ЧАСТЬ дистанции, что даёт
        // абсурдные значения (напр. 900+ км/ч на вело), см. avgPaceLabel,
        // уже применяемый для того же в генераторе постов трансляции
        // (найдено пользователем 2026-08-04).
        const metaCell = pos ? avgPaceLabel(dbStage, CHECKPOINT_DIST_KM[dbStage][pos.seq], pos.value) : '—';
        const started = stageHasStarted(r, dbStage, _raceStartEpoch, Date.now());
        // Рекорд есть только для 'swim'/'run' (нет данных по Вело1/Вело2
        // отдельно, только по объединённому "Вело итого" — см. Свод вело).
        const recordCol = STAGE_TO_RECORD_COLUMN[dbStage];
        const recordCats = recordCol ? recordCategoriesFor(_recordsIndex, recordCol, r.surname, r.name) : [];
        const rankCells = rankBodyCells(showGenderCol, stageAbsRanks[r.bib], stageGenderRankFor(r.bib, r.gender), genderBadge(r.gender), noTime ? '' : rc);
        // Блёклая строка — только по РЕАЛЬНОМУ статусу гонки (DNF/DSQ/DNS),
        // не по "нет времени на этом этапе" (noTime): на живой гонке
        // абсолютно у всех участников noTime===true на этапах, которые они
        // ещё не начали (например, все ещё плывут — колонка "Вело 1"),
        // и это НЕ повод их затемнять, они реально активны, просто ещё не
        // дошли до этого этапа (2026-08-03, тестовый прогон живых данных).
        return `<tr class="${rc}${r.status !== 'active' ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(r.bib)}','_blank')">
            ${rankCells}
            <td class="bib-cell">${r.bib}</td>
            <td class="name-cell"><div class="name-stack">
                <span class="name-main">${r.surname} ${r.name} ${finishStarBadge(r)}</span>
                ${cityLabel(r) ? `<span class="name-city">${cityLabel(r)}</span>` : ''}
                <span class="badge badge-individual">Лично</span>
            </div></td>
            <td class="r time-cell">${timeGapCell(fmtTime(t), gaps[r.bib], recordCats)}</td>
            <td class="r muted">${metaCell}</td>
            <td class="muted">${lastCpCell}</td>
            ${showStart ? `<td class="r muted">${fmtTime(r.bike2_start_s)}</td>` : ''}
            <td>${statusBadge(r, stage, started)}</td>
        </tr>`;
    };

    const buildRelayStageRow = m => {
        const t = m[cfg.timeKey];
        const key = `${m._bib}:${m.relay_stage}`;
        const pos = stagePos(m, dbStage);
        // См. buildIndividualStageRow — темп/скорость из живой позиции,
        // не из серверного avg_pace_s/avg_speed_kmh (неверно для тех, кто
        // ещё не финишировал этап).
        const meta = pos ? avgPaceLabel(dbStage, CHECKPOINT_DIST_KM[dbStage][pos.seq], pos.value) : '—';
        const started = stageHasStarted(m, dbStage, _raceStartEpoch, Date.now());
        const recordCol = STAGE_TO_RECORD_COLUMN[dbStage];
        const recordCats = recordCol ? recordCategoriesFor(_recordsIndex, recordCol, m.surname, m.name) : [];
        const lastCpPos = dbStage === 'run' ? lastReachedIncludingSubmarks(m.cp, dbStage) : pos;
        const lastCpCell = lastCpTwoLineHtml(dbStage, lastCpPos?.seq);
        const rc = stageAbsRanks[key] != null ? rankClass(stageAbsRanks[key]) : '';
        const rankCells = rankBodyCells(showGenderCol, stageAbsRanks[key], stageGenderRankFor(key, m.gender), genderBadge(m.gender), rc);
        return `<tr class="relay-row ${rc}" style="cursor:pointer" onclick="window.open('${participantLink(m._bib)}','_blank')">
            ${rankCells}
            <td class="bib-cell">${m._bib}</td>
            <td class="name-cell"><div class="name-stack">
                <span class="name-main">${m.surname} ${m.name}</span>
                <span class="name-city">${m._team}</span>
                <span class="badge badge-relay">Эстафета</span>
            </div></td>
            <td class="r time-cell">${timeGapCell(fmtTime(t), gaps[`${m._bib}:${m.relay_stage}`], recordCats)}</td>
            <td class="r muted">${meta}</td>
            <td class="muted">${lastCpCell}</td>
            ${showStart ? `<td class="r muted">${fmtTime(m.bike2_start_s)}</td>` : ''}
            <td>${relayMemberStatusBadge(m, pos, maxSeq, started)}</td>
        </tr>`;
    };

    // Единый порядок: личники и эстафетчики этой роли сортируются ВМЕСТЕ
    // по live-позиции на этапе (posSortKey), а не двумя отдельными
    // склеенными блоками. Раньше "финишировавшие" (по сырому времени)
    // одного типа перемежались с другим по времени, а "остальные" личники
    // и эстафетчики просто СКЛЕИВАЛИСЬ друг за другом (сначала все
    // личники, потом все эстафетчики) без реальной сортировки между
    // типами. На архивных данных почти все успевали "финишировать" этот
    // ранний этап, и блок "остальных" был коротким хвостом — баг был
    // незаметен. На живой гонке, когда почти никто ещё не финишировал
    // этап, это проявилось как "сначала ВСЕ личники, потом ВСЕ
    // эстафетчики" независимо от реального прогресса (найдено
    // пользователем 2026-08-03: лидер по прогрессу из эстафеты оказывался
    // в самом низу таблицы). Статус-тир (активные впереди DNF/DSQ/DNS) —
    // по rawStatus (истинный статус всей гонки, не "тихо" подменённый),
    // сортировка внутри тира — по posSortKey (дальше по КТ — впереди, при
    // равной КТ — быстрее); работает одинаково для ещё не
    // финишировавших и уже финишировавших этап.
    const orderedRows = sortByRawStatus(
        [
            ...rows.map(r => ({ type: 'individual', entry: r, rawStatus: r._rawStatus, cp: r.cp })),
            ...relayMembers.map(m => ({ type: 'relay', entry: m, rawStatus: m._rawStatus, cp: m.cp })),
        ],
        item => posSortKey(stagePos(item.entry, dbStage)),
        item => item.entry.bib ?? item.entry._bib
    ).map(({ type, entry }) => ({ type, entry }));

    html += `<div class="table-wrap"><table class="stage-table">
    <thead><tr>
        ${rankHeaderCells(showGenderCol, 'Место (пол)')}<th class="r">№</th><th class="name-cell">Участник</th>
        <th class="r">Время</th><th class="r">${cfg.metaLbl}</th><th>Отметка</th>
        ${showStart ? '<th class="r">Старт вело-2</th>' : ''}
        <th>Статус</th>
    </tr></thead><tbody>`;
    orderedRows.forEach(item => {
        html += item.type === 'individual' ? buildIndividualStageRow(item.entry) : buildRelayStageRow(item.entry);
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Вело (свод) / День 1 / День 2 ────────────────
   Общий рендер для "кумулятивных" зачётов, не привязанных к конкретному
   этапу (свод вело за оба дня, снапшот гонки на конец календарного дня).
   В отличие от Итогов/этапов тут нет DB-полей ранга — место считается
   позицией в отсортированном списке, одна колонка "Место" (при активном
   фильтре пола getFiltered() уже отдаёт только участников этого пола —
   позиция и так получается местом внутри пола). */
function progressStatusBadge(status, pos, isFinished, started) {
    if (status === 'dns') return '<span class="badge badge-dns">Не стартовал</span>';
    if (status === 'dsq') return '<span class="badge badge-dsq">DSQ</span>';
    if (status === 'dnf') return '<span class="badge badge-dnf">DNF</span>';
    // "Финиш"/"На трассе"/"—" (не начал) — тот же 3-состояний бейдж, что и
    // на Этапах/Итогах (activeProgressBadge, siberman-common.js).
    return activeProgressBadge(pos, isFinished, started);
}

// entries — единая форма для Итогов/Дней: v — живое накопленное время
// гонки на текущей позиции, ОГРАНИЧЕННОЙ maxStage (racePos) — не
// требует, чтобы день был пройден ДО КОНЦА (2026-08-03: раньше
// day1Progress/day2Progress требовали точно финишную КТ дня — "Время"
// оставалось пустым весь день, хотя "Отметка" уже показывала прогресс).
// rawStatus (статус ВСЕЙ гонки) — для сортировки/подсветки/ранга/
// отставания; status (dayStatus, статус ИМЕННО дня) — только для
// бейджа/дисплея. _pos считается ВСЕГДА (не только для активных дня) —
// нужен как тай-брейк между двумя DNF, ни один из которых не дошёл до
// конца дня (кто дальше в гонке — выше, тот же принцип, что и на
// вкладках этапов через posSortKey); v (отображаемое "Время") гейтится
// dayStatus отдельно — сошедший на дне не должен показывать время.
function buildRankedEntries(individual, relay, maxStage) {
    const mk = (type, entry, row) => {
        const st = dayStatus(row, maxStage);
        const pos = racePos(row, maxStage);
        return { type, entry, status: st, rawStatus: row.status, v: st === 'active' && pos ? pos.value : null, _pos: pos };
    };
    const withVal = [
        ...individual.map(r => mk('individual', r, r)),
        ...relay.map(t => mk('relay', t, teamGapRow(t))),
    ];
    return sortByRawStatus(withVal, item => raceSortKey(item._pos));
}

// genderRanks/formatRanks — по ПОЛНОМУ ростеру года. В отличие от absRanks
// (renderRankedProgress, теперь считается по видимым строкам — см. фикс
// 2026-07-24) полный ростер здесь безвреден: genderRanks.M/F берут только
// личников своего пола — фильтры формата/пола не выбрасывают "чужих"
// личников ИЗ ЭТОГО пола, а formatRanks берёт всех эстафетчиков — состав
// relay не зависит от фильтра пола (у команды нет общего пола), поэтому оба
// набора совпадают с видимым пулом при любом активном фильтре.
function dayRankOptions(maxStage) {
    const allEntries = buildRankedEntries(_data.individual, _data.relay, maxStage);
    // status для ранжирования — ОБЩИЙ (rawStatus), не дневной: сошедший
    // позже не получает номер места по полу/формату, даже если этот
    // конкретный день пройден полностью (тот же принцип, что на этапах).
    // val — raceSortKey(_pos) (закодированный ключ), не сырое e.v — та же
    // логика, что и сортировка выше (computeRanksByValue сравнивает val
    // напрямую, сырые "живые" секунды между разными этапами гонки не
    // сравнимы, см. шапку файла siberman-common.js).
    const rowsFor = (pred) => allEntries.filter(pred).map(e => ({ key: e.entry.bib, val: raceSortKey(e._pos), status: e.rawStatus }));
    return {
        genderRanks: {
            M: computeRanksByValue(rowsFor(e => e.type === 'individual' && e.entry.gender === 'M')),
            F: computeRanksByValue(rowsFor(e => e.type === 'individual' && e.entry.gender === 'F')),
        },
        formatRanks: computeRanksByValue(rowsFor(e => e.type === 'relay')),
    };
}

// Колонки/вид приведены к единому паттерну Итогов гонки/вкладок этапов
// (rankHeaderCells/rankBodyCells, "Последняя КТ", время+отставание в одной
// ячейке). МЕСТО и ОТСТАВАНИЕ — оба среди ВИДИМЫХ строк (entries уже
// отфильтрованы по формату/полу выше) — тот же откат, что и на Итогах гонки
// (запрошено пользователем 2026-07-24: при фильтре "Личный" невидимые
// эстафетчики "съедали" номера мест, 1,2,3,5,7...). Раньше МЕСТО считалось
// по полному ростеру года намеренно — не подтвердилось на практике. Число
// колонок места и исключение эстафеты при фильтре пола — тот же критерий
// showSecondaryRank(), что и на Итогах гонки (п.7 v6, 2026-08-02).
function renderRankedProgress(options = {}) {
    const maxStage = options.maxStage;
    const filtered = getFiltered();
    const individual = filtered.individual;
    // Эстафетная команда не имеет единого пола — при выбранном фильтре
    // пола команды на "Днях" не показываем вовсе, тот же приём, что и в
    // renderOverall (запрошено пользователем 2026-08-02, п.7 v6).
    const relay = _gender === 'all' ? filtered.relay : [];
    const entries = buildRankedEntries(individual, relay, maxStage);
    // "Финишировало" для эстафетной карточки — дошли до КОНЦА ИМЕННО ЭТОГО
    // дня (проверка через _pos на границе maxStage, не "есть хоть какое-то
    // v" — оно true с самого начала дня). dnfDsq — статус команды
    // ОТНОСИТЕЛЬНО ЭТОГО ДНЯ (dayStatus), не общий статус за всю гонку:
    // если DNF случился ПОЗЖЕ (например, бегун сошёл на дне 3) — день,
    // который команда реально прошла, не должен считаться DNF (2026-08-03,
    // п.1 v7 — раньше индикатор DNF на "Днях" не учитывал открытый день,
    // это была осознанная РАЗВОРОТ-правка прежнего решения от 2026-07-23).
    const isFinishedThisDay = e => e._pos && e._pos.stageIdx === STAGE_ORDER.indexOf(maxStage) && e._pos.seq === STAGE_MAX_SEQ[maxStage];
    const relayStatsDay = {
        total: relay.length,
        finished: entries.filter(e => e.type === 'relay' && isFinishedThisDay(e)).length,
        dnfDsq: relay.filter(t => dayStatus(teamGapRow(t), maxStage) === 'dnf').length,
    };
    let html = buildStats(individual, relayStatsDay, null, maxStage);
    if (entries.length === 0) {
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';
        document.getElementById('app').innerHTML = html;
        return;
    }
    // Место/отставание — та же живая cross-stage модель, что и в Итогах
    // гонки (computeCombinedOverallRanks/computeOverallGaps), ограниченная
    // "Днём" (maxStage) — единый код-путь вместо отдельной, менее полной
    // реализации (poolGap, удалена).
    const absRanks = computeCombinedOverallRanks(combinedOverallRankRows(individual, relay), maxStage);
    const gapPool = entries.filter(e => e.rawStatus === 'active').map(e => {
        const row = e.type === 'individual' ? e.entry : teamGapRow(e.entry);
        return { key: e.entry.bib, cp: row.cp, status: 'active', swim_s: row.swim_s, bike1_s: row.bike1_s, bike2_s: row.bike2_s, run_s: row.run_s };
    });
    const gaps = computeOverallGaps(gapPool, maxStage);
    const showGenderCol = showSecondaryRank();
    html += `<div class="table-wrap"><table>
    <thead><tr>${rankHeaderCells(showGenderCol, overallSecondaryLabel())}<th class="r">№</th><th class="name-cell">Участник</th><th class="r">Время</th>${options.speedFn ? '<th class="r">Скорость</th>' : ''}<th>Отметка</th><th>Статус</th></tr></thead><tbody>`;
    entries.forEach(item => {
        const { type, entry, v, rawStatus } = item;
        const hasVal = v != null;
        const genderRank = options.genderRanks && type === 'individual' ? options.genderRanks[entry.gender]?.[entry.bib] : null;
        const formatRank = options.formatRanks && type === 'relay' ? options.formatRanks[entry.bib] : null;
        const secondaryRank = type === 'individual' ? genderRank : formatRank;
        const secondaryBadge = type === 'individual' ? genderBadge(entry.gender) : formatBadge();
        const absRank = absRanks[entry.bib];
        const rc = absRank != null ? rankClass(absRank) : '';
        const status = item.status;
        // "Последняя КТ" — тот же приём, что и в Итогах гонки, но
        // ограничена границей дня (maxStage: 'bike_day1' для Дня 1,
        // 'bike_day2' для Дня 1+2) — раньше могла показать этап "Бег",
        // если участник уже добежал до него, хотя вкладка про вело
        // (найдено пользователем 2026-08-02, п.1 v6). Двухстрочный формат
        // (N км / круг или Финиш) — тот же, что на вкладках этапов (п.3 v6),
        // без названия этапа (убрано по запросу пользователя 2026-08-02 —
        // формулировка должна быть идентична этапам).
        const statusEntity = type === 'individual' ? entry : teamGapRow(entry);
        const cur = currentStage(statusEntity, maxStage);
        const pos = cur ? lastReached(statusEntity.cp, cur) : null;
        // cumulativeLastCpHtml — не lastCpTwoLineHtml: "Отметка" на "Днях"
        // должна расти к границе ДНЯ (155/431 км), а не начинаться заново
        // с 0 на каждом этапе внутри дня (найдено пользователем 2026-08-04).
        const lastCpCell = cur ? cumulativeLastCpHtml(cur, pos?.seq) : '—';
        const nameCell = type === 'individual'
            ? `<span class="name-main">${entry.surname} ${entry.name} ${finishStarBadge(entry)}</span>${cityLabel(entry) ? `<span class="name-city">${cityLabel(entry)}</span>` : ''}<span class="badge badge-individual">Лично</span>`
            : `<span class="name-main">${entry.team_name}</span><span class="badge badge-relay">Эстафета</span>`;
        // "Финиш" в бейдже статуса — только если РЕАЛЬНО дошёл до конца
        // ИМЕННО этого дня (item._pos на границе maxStage), "—" — если ещё
        // не начал день вовсе (item._pos===null), "На трассе" — где-то
        // между (2026-08-03: раньше не различали "не начал" и "в
        // процессе" — оба показывали "На трассе"/"Финиш" по одной и той
        // же грубой проверке "есть ли какое-то значение").
        const isFinishedDay = p => p.stageIdx === STAGE_ORDER.indexOf(maxStage) && p.seq === STAGE_MAX_SEQ[maxStage];
