<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siberman 515 — Результаты 2025</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0d1117;
            --bg2:      #161b22;
            --bg3:      #21262d;
            --border:   #30363d;
            --text:     #e6edf3;
            --muted:    #8b949e;
            --accent:   #e85d04;
            --accent2:  #f48c06;
            --dnf:      #444c56;
            --radius:   8px;
        }

        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; }

        /* Header */
        .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: #fff; white-space: nowrap; }
        .logo span { color: var(--accent); }
        .logo-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
        .header-spacer { flex: 1; }
        .year-select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: var(--radius); font-size: 13px; cursor: pointer; }

        /* Tabs */
        .tabs { display: flex; gap: 2px; padding: 16px 20px 0; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 8px 16px; border-radius: var(--radius) var(--radius) 0 0; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border: 1px solid transparent; border-bottom: none; white-space: nowrap; transition: color .15s, background .15s; }
        .tab:hover { color: var(--text); }
        .tab.active { background: var(--bg); color: var(--accent); border-color: var(--border); margin-bottom: -1px; }

        /* Filters */
        .filters { display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap; }
        .filter-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
        .filter-group { display: flex; gap: 4px; }
        .filter-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .filter-btn:hover { color: var(--text); border-color: var(--text); }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Content */
        .content { padding: 0 20px 40px; }

        /* Stats row */
        .stats { display: flex; gap: 16px; padding: 16px 0; flex-wrap: wrap; }
        .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
        .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 8px 10px; text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
        thead th.r { text-align: right; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
        tbody tr:hover { background: var(--bg2); }
        tbody tr.dnf { opacity: .55; }
        td { padding: 9px 10px; white-space: nowrap; }
        td.r { text-align: right; font-variant-numeric: tabular-nums; }

        .rank { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 32px; display: inline-block; }
        .rank-sub { font-size: 11px; color: var(--muted); }
        .bib { font-weight: 700; color: var(--muted); }
        .name { font-weight: 600; }
        .city { color: var(--muted); font-size: 12px; }
        .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .badge-m { background: rgba(56,139,253,.15); color: #58a6ff; }
        .badge-f { background: rgba(248,81,73,.15); color: #f85149; }
        .badge-e { background: rgba(232,93,4,.15); color: var(--accent); }
        .badge-dnf { background: var(--bg3); color: var(--muted); }
        .time { font-variant-numeric: tabular-nums; }
        .muted { color: var(--muted); }

        /* Section header */
        .section-hdr { padding: 20px 0 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 2px; }

        /* Relay table */
        .relay-team { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
        .relay-team-header { padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
        .relay-team-name { font-weight: 700; font-size: 14px; }
        .relay-team-time { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
        .relay-members { padding: 0 0 8px; }
        .relay-member { display: flex; gap: 12px; padding: 6px 14px; align-items: center; border-top: 1px solid var(--border); }
        .relay-stage-badge { width: 60px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
        .relay-member-name { flex: 1; font-size: 13px; }
        .relay-member-time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text); }
        .relay-member-meta { font-size: 11px; color: var(--muted); }

        /* Empty state */
        .empty { padding: 40px; text-align: center; color: var(--muted); }
        .loading { padding: 60px; text-align: center; color: var(--muted); font-size: 16px; }

        @media (max-width: 640px) {
            .header { padding: 12px 14px; }
            .tabs { padding: 12px 14px 0; }
            .filters { padding: 10px 14px; gap: 8px; }
            .content { padding: 0 14px 32px; }
            td, thead th { padding: 7px 6px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <div class="logo">SIBER<span>MAN</span></div>
        <div class="logo-sub">515 · Ультратриатлон · Сибирь</div>
    </div>
    <div class="header-spacer"></div>
    <select class="year-select" id="yearSelect" onchange="loadYear(this.value)">
        <option value="2025">2025</option>
    </select>
</div>

<div class="tabs" id="tabs">
    <div class="tab active" data-tab="overall">Финал</div>
    <div class="tab" data-tab="swim">Плавание</div>
    <div class="tab" data-tab="bike1">Вело День 1</div>
    <div class="tab" data-tab="bike2">Вело День 2</div>
    <div class="tab" data-tab="run">Бег</div>
</div>

<div class="filters" id="filters">
    <span class="filter-label">Формат:</span>
    <div class="filter-group" id="fmtGroup">
        <button class="filter-btn active" data-fmt="all">Все</button>
        <button class="filter-btn" data-fmt="individual">Личный</button>
        <button class="filter-btn" data-fmt="relay">Эстафета</button>
    </div>
    <span class="filter-label">Пол:</span>
    <div class="filter-group" id="genderGroup">
        <button class="filter-btn active" data-gender="all">Все</button>
        <button class="filter-btn" data-gender="M">Муж</button>
        <button class="filter-btn" data-gender="F">Жен</button>
    </div>
</div>

<div class="content">
    <div class="loading" id="loading">Загрузка результатов…</div>
    <div id="app" style="display:none"></div>
</div>

<script>
let _data = null;
let _tab = 'overall';
let _fmt = 'all';
let _gender = 'all';

function fmtTime(s) {
    if (s == null) return '—';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtPace(s) {
    if (s == null) return '—';
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} /км`;
}
function fmtSpeed(v) {
    if (v == null) return '—';
    return `${Number(v).toFixed(1)} км/ч`;
}
function genderBadge(g) {
    if (g === 'M') return '<span class="badge badge-m">М</span>';
    if (g === 'F') return '<span class="badge badge-f">Ж</span>';
    return '<span class="badge badge-e">Э</span>';
}

function getFiltered() {
    if (!_data) return { individual: [], relay: [] };
    let ind = _data.individual;
    if (_fmt === 'relay') ind = [];
    else if (_gender !== 'all') ind = ind.filter(r => r.gender === _gender);

    let rel = _data.relay;
    if (_fmt === 'individual') rel = [];

    return { individual: ind, relay: rel };
}

function renderOverall() {
    const { individual, relay } = getFiltered();
    let html = '';

    // Stats
    const finished = individual.filter(r => r.overall_s != null).length;
    const dnf = individual.filter(r => r.overall_s == null && r.status !== 'dns').length;
    html += `<div class="stats">
        <div class="stat"><div class="stat-val">${individual.length}</div><div class="stat-lbl">Личников</div></div>
        <div class="stat"><div class="stat-val">${relay.length}</div><div class="stat-lbl">Эстафет</div></div>
        <div class="stat"><div class="stat-val">${finished}</div><div class="stat-lbl">Финишировали</div></div>
        ${dnf > 0 ? `<div class="stat"><div class="stat-val">${dnf}</div><div class="stat-lbl">DNF</div></div>` : ''}
    </div>`;

    // Individual table
    if (_fmt !== 'relay' && individual.length > 0) {
        html += `<div class="table-wrap"><table>
        <thead><tr>
            <th>Место</th><th>№</th><th>Участник</th><th>Пол</th>
            <th class="r">Плавание</th><th class="r">Вело 1</th><th class="r">Вело 2</th><th class="r">Бег</th>
            <th class="r">Итого</th>
        </tr></thead><tbody>`;
        individual.forEach(r => {
            const isDnf = r.overall_s == null;
            html += `<tr class="${isDnf ? 'dnf' : ''}">
                <td><span class="rank">${isDnf ? '' : r.rank_overall ?? '—'}</span>${r.rank_gender != null && !isDnf ? `<br><span class="rank-sub">${genderBadge(r.gender)}${r.rank_gender}</span>` : ''}</td>
                <td class="bib">${r.bib}</td>
                <td><span class="name">${r.surname} ${r.name}</span>${r.city ? `<br><span class="city">${r.city}</span>` : ''}</td>
                <td>${genderBadge(r.gender)}</td>
                <td class="r time">${fmtTime(r.swim_s)}</td>
                <td class="r time">${fmtTime(r.bike1_s)}</td>
                <td class="r time">${fmtTime(r.bike2_s)}</td>
                <td class="r time">${fmtTime(r.run_s)}</td>
                <td class="r time" style="font-weight:700;color:${isDnf ? 'var(--muted)' : 'var(--text)'}">
                    ${isDnf ? '<span class="badge badge-dnf">DNF</span>' : fmtTime(r.overall_s)}
                </td>
            </tr>`;
        });
        html += '</tbody></table></div>';
    }

    // Relay teams
    if (_fmt !== 'individual' && relay.length > 0) {
        html += `<div class="section-hdr">Эстафетные команды</div>`;
        const STAGE_LABELS = { swim: 'Плавание', bike: 'Велосипед', run: 'Бег' };
        relay.forEach((team, idx) => {
            const pos = idx + 1;
            html += `<div class="relay-team">
                <div class="relay-team-header">
                    <span class="rank">${pos}</span>
                    <span class="bib">${team.bib}</span>
                    <span class="relay-team-name">${team.team_name}</span>
                    <span class="relay-team-time">${fmtTime(team.overall_s)}</span>
                </div>
                <div class="relay-members">`;
            team.members.forEach(m => {
                const stageTime = m.relay_stage === 'swim' ? m.swim_s :
                                  m.relay_stage === 'bike' ? (m.bike1_s != null || m.bike2_s != null ? (m.bike1_s ?? 0) + (m.bike2_s ?? 0) : null) :
                                  m.run_s;
                const stageMeta = m.relay_stage === 'swim' ? fmtPace(m.swim_pace) :
                                  m.relay_stage === 'bike' ? fmtSpeed(m.bike2_speed ?? m.bike1_speed) :
                                  fmtPace(m.run_pace);
                html += `<div class="relay-member">
                    <span class="relay-stage-badge">${STAGE_LABELS[m.relay_stage] ?? m.relay_stage}</span>
                    <span class="relay-member-name">${m.surname} ${m.name}</span>
                    <span class="relay-member-time">${fmtTime(stageTime)}</span>
                    <span class="relay-member-meta">${stageMeta}</span>
                </div>`;
            });
            html += `</div></div>`;
        });
    }

    if (individual.length === 0 && relay.length === 0) {
        html += `<div class="empty">Нет данных для выбранного фильтра</div>`;
    }

    document.getElementById('app').innerHTML = html;
}

function renderStage(stage) {
    const { individual, relay } = getFiltered();
    const stageInfo = {
        swim:  { key: 's', rankKey: 'swim_rank', rankGKey: 'swim_rank_g', metaKey: 'swim_pace', metaFn: fmtPace,  metaLbl: 'Темп',      distLbl: '10 км',  timeKey: 'swim_s'  },
        bike1: { key: 's', rankKey: 'bike1_rank', rankGKey: 'bike1_rank_g', metaKey: 'bike1_speed', metaFn: fmtSpeed, metaLbl: 'Скорость', distLbl: '145 км', timeKey: 'bike1_s' },
        bike2: { key: 's', rankKey: 'bike2_rank', rankGKey: 'bike2_rank_g', metaKey: 'bike2_speed', metaFn: fmtSpeed, metaLbl: 'Скорость', distLbl: '276 км', timeKey: 'bike2_s' },
        run:   { key: 's', rankKey: 'run_rank',   rankGKey: 'run_rank_g',   metaKey: 'run_pace',   metaFn: fmtPace,  metaLbl: 'Темп',      distLbl: '84 км',  timeKey: 'run_s'   },
    }[stage];

    // Отфильтровать тех, у кого нет данных этапа и нет DNF
    const rows = individual.filter(r => r[stageInfo.timeKey] != null || r.status === 'dnf');
    // Эстафетные члены для этого этапа
    let relayStageKey = { swim: 'swim', bike1: 'bike', bike2: 'bike', run: 'run' }[stage];
    const relayMembers = _fmt !== 'individual'
        ? relay.flatMap(t => t.members.filter(m => m.relay_stage === relayStageKey))
        : [];

    let html = `<div class="table-wrap"><table>
    <thead><tr>
        <th>Место</th><th>№</th><th>Участник</th><th>Пол/Тип</th>
        <th class="r">Время</th><th class="r">${stageInfo.metaLbl}</th>
    </tr></thead><tbody>`;

    rows.forEach(r => {
        const t = r[stageInfo.timeKey];
        const isDnf = t == null;
        html += `<tr class="${isDnf ? 'dnf' : ''}">
            <td><span class="rank">${isDnf ? '' : r[stageInfo.rankKey] ?? '—'}</span>${!isDnf && r[stageInfo.rankGKey] != null ? `<br><span class="rank-sub">${genderBadge(r.gender)}${r[stageInfo.rankGKey]}</span>` : ''}</td>
            <td class="bib">${r.bib}</td>
            <td class="name">${r.surname} ${r.name}</td>
            <td>${genderBadge(r.gender)}</td>
            <td class="r time">${isDnf ? '<span class="badge badge-dnf">DNF</span>' : fmtTime(t)}</td>
            <td class="r muted">${isDnf ? '—' : stageInfo.metaFn(r[stageInfo.metaKey])}</td>
        </tr>`;
    });

    // Relay members for this stage
    if (relayMembers.length > 0) {
        html += `<tr><td colspan="6" style="padding:4px 10px;background:var(--bg2);color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Эстафеты</td></tr>`;
        relayMembers.forEach(m => {
            const t = m.relay_stage === 'swim' ? m.swim_s :
                      stage === 'bike1' ? m.bike1_s : stage === 'bike2' ? m.bike2_s : m.run_s;
            const meta = m.relay_stage === 'swim' ? fmtPace(m.swim_pace) :
                         stage === 'bike1' ? fmtSpeed(m.bike1_speed) : stage === 'bike2' ? fmtSpeed(m.bike2_speed) : fmtPace(m.run_pace);
            html += `<tr>
                <td><span class="badge badge-e">Э</span></td>
                <td class="bib muted">—</td>
                <td class="name">${m.surname} ${m.name}</td>
                <td><span class="badge badge-e">Э</span></td>
                <td class="r time">${fmtTime(t)}</td>
                <td class="r muted">${meta}</td>
            </tr>`;
        });
    }

    html += '</tbody></table></div>';

    if (rows.length === 0 && relayMembers.length === 0) {
        html = '<div class="empty">Нет данных для выбранного фильтра</div>';
    }

    document.getElementById('app').innerHTML = html;
}

function render() {
    if (!_data) return;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';

    // Управление видимостью фильтра пола (не нужен при фильтре Эстафета)
    const genderGroup = document.getElementById('genderGroup');
    genderGroup.style.display = _fmt === 'relay' ? 'none' : '';

    if (_tab === 'overall') renderOverall();
    else renderStage(_tab);
}

async function loadYear(year) {
    document.getElementById('loading').style.display = '';
    document.getElementById('app').style.display = 'none';
    try {
        const resp = await fetch(`/api/siberman/results?year=${year}`);
        if (!resp.ok) throw new Error(resp.statusText);
        _data = await resp.json();
        render();
    } catch(e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки данных: ' + e.message;
    }
}

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _tab = t.dataset.tab;
        render();
    });
});

// Format filter
document.querySelectorAll('[data-fmt]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-fmt]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _fmt = btn.dataset.fmt;
        if (_fmt === 'relay') {
            document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
            document.querySelector('[data-gender="all"]').classList.add('active');
            _gender = 'all';
        }
        render();
    });
});

// Gender filter
document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _gender = btn.dataset.gender;
        render();
    });
});

// Initial load
loadYear(2025);
</script>
</body>
</html>
