        // Блёклая строка — по ОБЩЕМУ статусу гонки (см. sortByRawStatus).
        html += `<tr class="${type === 'relay' ? 'relay-row ' : ''}${rc}${rawStatus !== 'active' ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(entry.bib)}','_blank')">
            ${rankBodyCells(showGenderCol, absRank, secondaryRank, secondaryBadge, rc)}
            <td class="bib-cell">${entry.bib}</td>
            <td class="name-cell"><div class="name-stack">${nameCell}</div></td>
            <td class="r time-cell">${timeGapCell(fmtTime(v), gaps[entry.bib])}</td>
            ${options.speedFn ? `<td class="r muted">${hasVal ? fmtSpeed(options.speedFn(v)) : '—'}</td>` : ''}
            <td class="muted">${lastCpCell}</td>
            <td>${progressStatusBadge(status, item._pos, isFinishedDay)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

// Велоэтап эстафетной команды (день1+день2) всегда едет ОДИН И ТОТ ЖЕ
// человек — в отличие от Итогов/Дней 1-2, где команда объединяет трёх
// разных людей на трёх разных этапах, здесь "команда" на Своде вело — это
// фактически один конкретный велосипедист с реальным полом. Возвращает
// personal-подобный объект (bib команды, но ФИО/пол велосипедиста), чтобы
// он мог получить настоящее место по полу наравне с личниками.
function bikeCombinedRelayRider(team) {
    const m = team.members.find(x => x.relay_stage === 'bike');
    if (!m) return null;
    // swim_s велосипедиста эстафеты — от ЕГО КОМАНДЫ (сам он не плавает),
    // нужен bikeCombinedRawCp() для вычитания заплыва из cp.bike_day1
    // (та же база, что у individual bike1_s) — без этого live-время
    // Дня 1 у эстафетного велосипедиста было бы завышено на время
    // заплыва команды (найдено 2026-08-03 при переходе на live-время).
    const swimMember = team.members.find(x => x.relay_stage === 'swim');
    const swimS = swimMember?.swim_s ?? null;
    // cp.swim подмешан от пловца команды — нужен только stageHasStarted()
    // (велосипедист сам не плавает, его собственный cp.swim пуст).
    return { bib: team.bib, surname: m.surname, name: m.name, gender: m.gender, team_name: team.team_name, status: m.status, swim_s: swimS, bike1_s: m.bike1_s, bike2_s: m.bike2_s, cp: { ...m.cp, swim: m.cp?.swim ?? swimMember?.cp?.swim } };
}

// Статус ИМЕННО вело-этапа (оба дня) — по факту достижения последней КТ
// bike_day2, а не по общему статусу гонки (row.status относится ко ВСЕЙ
// гонке: DNF на беге не должен превращать в DNF уже пройденное вело —
// найдено пользователем 2026-08-02, п.2 v6, тот же класс бага, что уже
// чинили в renderStage через withStageStatus, только для составного этапа).
function bikeCombinedStatus(row) {
    if (row.status === 'active') return 'active';
    const pos = lastReached(row.cp, 'bike_day2');
    return (pos && pos.seq === STAGE_MAX_SEQ.bike_day2) ? 'active' : row.status;
}

// Свод вело (421 км = 145+276) — единственная сводная вкладка с однородной
// метрикой на всей дистанции, поэтому только у неё осмысленны средняя
// скорость и настоящее место по полу и для личников, и для велосипедиста
// эстафетной команды (запрошено пользователем 2026-07-19). Не переиспользует
// renderRankedProgress/buildRankedEntries (те рассчитаны на команду как
// единое целое без пола — верно для Итогов/Дней 1-2, но не здесь).
function renderBikeCombined() {
    const { individual, relay } = getFiltered();
    // riders — конкретные велосипедисты эстафеты (реальный личный пол) —
    // должны уважать фильтр по полу так же, как личники; getFiltered() его
    // не применяет к relay (командные таблицы не имеют единого пола), но
    // здесь, на персонифицированной вкладке, применяем сами (найдено
    // пользователем 2026-07-23, п.9 — тот же класс бага, что и на этапах:
    // строки/статистика эстафеты не пересчитывались под фильтр пола).
    const riders = relay.map(bikeCombinedRelayRider).filter(Boolean).filter(r => _gender === 'all' || r.gender === _gender);

    // pos — считается ОДИН раз на человека: и для "живого" времени/
    // скорости (пока Свод вело не пройден целиком), и для сортировки/
    // ранга/отставания (2026-08-03: раньше bikeCombinedTime() требовал
    // ПОЛНОСТЬЮ пройденных обоих дней — всю первую половину гонки колонка
    // "Время" была пустой у всех).
    const withPos = [
        ...individual.map(r => ({ isRelay: false, entry: r, rawStatus: r.status, pos: bikeCombinedStatus(r) === 'active' ? bikeCombinedLastPos(r) : null })),
        ...riders.map(r => ({ isRelay: true, entry: r, rawStatus: r.status, pos: bikeCombinedStatus(r) === 'active' ? bikeCombinedLastPos(r) : null })),
    ];
    const maxVseq = STAGE_MAX_SEQ.bike_day1 + STAGE_MAX_SEQ.bike_day2;
    const relayStatsBike = {
        total: riders.length,
        finished: withPos.filter(x => x.isRelay && x.pos != null && x.pos.seq === maxVseq).length,
        dnfDsq: riders.filter(r => r.status === 'dnf' || r.status === 'dsq').length,
    };
    let html = buildStats(individual, relayStatsBike, null, 'bike_day2');

    // rawStatus — общий статус ВСЕЙ гонки (не только вело) — сошедший
    // позже (напр. на беге) должен "тонуть" вниз списка и блёкнуть, даже
    // если вело он прошёл полностью (bikeCombinedStatus 'active' для этого
    // случая) — тот же принцип, что уже на вкладках этапов (найдено
    // пользователем 2026-08-02).
    // Тай-брейк между "утонувшими" (rawStatus!=='active') — по posSortKey
    // (та же кросс-этапная модель "кто дальше — выше", что и на вкладках
    // этапов, запрошено пользователем 2026-08-02).
    const rows = sortByRawStatus(withPos, item => posSortKey(item.pos));

    if (rows.length === 0) {
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';
        document.getElementById('app').innerHTML = html;
        return;
    }

    // Ранг (абсолют + по полу) — среди ВИДИМЫХ строк (rows, уже
    // отфильтрованы по _fmt/_gender), не по полному ростеру года — тот же
    // откат, что и на вкладках этапов (запрошено пользователем 2026-07-23:
    // "Место" не должно учитывать невидимых участников). status для
    // ранжирования — ОБЩИЙ (rawStatus), как на вкладках этапов: сошедший
    // позже не получает номер места, даже если вело показывает "Финиш".
    const rankPool = rows.map(({ isRelay, entry, rawStatus, pos }) => ({ key: entry.bib, val: posSortKey(pos), status: rawStatus, gender: entry.gender, isRelay }));
    const absRanks = computeRanksByValue(rankPool);
    const genderRanks = {
        M: computeRanksByValue(rankPool.filter(x => x.gender === 'M')),
        F: computeRanksByValue(rankPool.filter(x => x.gender === 'F')),
    };
    // Отставание — только среди настоящих active (rawStatus) — DNF/DSQ не
    // может быть лидером и не получает отставание, от лидера ПРЯМО
    // СЕЙЧАС, не обязательно финишировавшего (bikeCombinedGaps, Задача 2).
    const gaps = bikeCombinedGaps(
        rows.filter(r => r.rawStatus === 'active').map(({ entry }) => ({ key: entry.bib, entry, status: 'active' }))
    );
    const showGenderCol = _gender === 'all';

    html += `<div class="table-wrap"><table>
    <thead><tr>${rankHeaderCells(showGenderCol, 'Место (пол)')}<th class="r">№</th><th class="name-cell">Участник</th><th class="r">Время</th><th class="r">Скорость</th><th>Отметка</th><th>Статус</th></tr></thead><tbody>`;
    rows.forEach(({ isRelay, entry, rawStatus, pos }) => {
        const hasVal = pos != null;
        const v = pos ? pos.value : null;
        const distKm = pos ? bikeCombinedDistKm(pos.seq) : 0;
        const absRank = hasVal ? absRanks[entry.bib] : null;
        const genderRank = hasVal ? genderRanks[entry.gender]?.[entry.bib] : null;
        const rc = absRank != null ? rankClass(absRank) : '';
        const subLine = isRelay ? entry.team_name : cityLabel(entry);
        const badgeHtml = isRelay ? '<span class="badge badge-relay">Эстафета</span>' : '<span class="badge badge-individual">Лично</span>';
        const nameCell = `<span class="name-main">${entry.surname} ${entry.name} ${isRelay ? '' : finishStarBadge(entry)}</span>${subLine ? `<span class="name-city">${subLine}</span>` : ''}${badgeHtml}`;
        const rankCells = rankBodyCells(showGenderCol, absRank, genderRank, genderBadge(entry.gender), rc);
        const status = bikeCombinedStatus(entry);
        // "Финиш" — только если РЕАЛЬНО дошёл до конца ОБОИХ вело-дней
        // (421 км), "—" — если ещё не начал вело вовсе (pos===null),
        // "На трассе" — где-то между (2026-08-03: раньше не различали
        // "не начал" и "в процессе").
        const isFinishedBike = p => p.seq === maxVseq;
        const started = stageHasStarted(entry, 'bike_day1', _raceStartEpoch, Date.now());
        const recordCats = recordCategoriesFor(_recordsIndex, 'bike_total', entry.surname, entry.name);
        // Блёклая строка — по ОБЩЕМУ статусу гонки (сошедший позже, напр.
        // на беге, "тонет" визуально даже если у него есть время и статус
        // "Финиш" на вело — см. sortByRawStatus).
        html += `<tr class="${isRelay ? 'relay-row ' : ''}${rc}${rawStatus !== 'active' ? ' dnf' : ''}" style="cursor:pointer" onclick="window.open('${participantLink(entry.bib)}','_blank')">
            ${rankCells}
            <td class="bib-cell">${entry.bib}</td>
            <td class="name-cell"><div class="name-stack">${nameCell}</div></td>
            <td class="r time-cell">${timeGapCell(fmtTime(v), gaps[entry.bib], recordCats)}</td>
            <td class="r muted">${hasVal ? fmtSpeed(distKm / (v / 3600)) : '—'}</td>
            <td class="muted">${bikeCombinedLastCpHtml(entry.cp)}</td>
            <td>${progressStatusBadge(status, pos, isFinishedBike, started)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}
function renderDay1() { renderRankedProgress({ ...dayRankOptions('bike_day1'), maxStage: 'bike_day1' }); }
function renderDay2() { renderRankedProgress({ ...dayRankOptions('bike_day2'), maxStage: 'bike_day2' }); }

/* ──────────────── Render: Графики (Темп/скорость, Позиция) ────────────────
   Форма по умолчанию — "spaghetti + hover-highlight" (эмфазис, не
   категориальный цвет): все линии тонкие/приглушённые, наведение/тап
   подсвечивает ближайшую акцентным цветом. Так график остаётся читаемым
   независимо от числа участников. Поверх этого — опциональный режим
   сравнения (см. chart-sidebar ниже, п.7.2 задачи 2026-07-19): пользователь
   явно выбирает участников через поиск+чекбоксы (без ограничения по числу),
   тогда spaghetti уступает место обычным категориальным линиям с легендой
   (сознательно НЕ копирует ручной мультивыбор Суточной велогонки один-в-один
   — там неидеальна мобильная версия, см. план). */
function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function fmtSecClock(s) {
    if (s == null) return '';
    const r = Math.round(s);
    return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`;
}
const STAGE_UNIT_TITLE = { swim: 'Темп, /100 м', bike: 'Скорость, км/ч', bike1: 'Скорость, км/ч', bike2: 'Скорость, км/ч', run: 'Темп, /км' };
const PACE_STAGE_LABEL = { swim: 'Плавание', bike: 'Вело (оба дня)', bike1: 'Вело День 1', bike2: 'Вело День 2', run: 'Бег' };
function paceValueLabel(dbStage, v) {
    if (v == null) return '—';
    if (dbStage === 'bike_day1' || dbStage === 'bike_day2') return fmtSpeed(v);
    const label = fmtSecClock(v);
    return dbStage === 'swim' ? `${label} /100м` : `${label} /км`;
}

/* ──────────────── Мультивыбор для сравнения (п.7.2/п.8) ────────────────
   Без ограничения на число участников (снято по просьбе пользователя
   2026-07-19) — категориальная палитра из 4 цветов (валидирована skill'ом
   dataviz на "all-pairs" сравнение) переиспользуется по кругу для 5-го и
   далее участника; цвет закреплён за конкретным bib по ПОРЯДКУ выбора (не
   по позиции в отфильтрованном списке) — не "перекрашивает выживших", когда
   другой участник добавляется/убирается из сравнения. */
const CHART_COMPARE_COLORS = {
    light: ['#2a78d6', '#008300', '#e87ba4', '#eda100'],
    dark:  ['#3987e5', '#008300', '#d55181', '#c98500'],
};
function chartCompareColor(slotIdx) {
    const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const palette = CHART_COMPARE_COLORS[theme];
    return palette[slotIdx % palette.length];
}
function chartToggleSelect(bib) {
    const idx = _chartSelectedBibs.indexOf(bib);
    if (idx !== -1) _chartSelectedBibs.splice(idx, 1);
    else _chartSelectedBibs.push(bib);
}
function chartParticipantListItemsHtml(datasets) {
    const q = _chartSearchQuery.trim().toLowerCase();
    const filtered = (q ? datasets.filter(d => d._name.toLowerCase().includes(q)) : datasets)
        .slice().sort((a, b) => a._name.localeCompare(b._name, 'ru'));
    if (filtered.length === 0) return '<div class="muted" style="padding:10px;font-size:12px">Ничего не найдено</div>';
    return filtered.map(d => {
        const checked = _chartSelectedBibs.includes(d._bib);
        return `<label class="chart-participant-item">
            <input type="checkbox" data-chartbib="${d._bib}" ${checked ? 'checked' : ''}>
            <span>${d._name}</span>
        </label>`;
    }).join('');
}
// Одна кнопка "Выбрать всех/Очистить всех" — учитывает текущий поиск (жмут
// её обычно после того как отфильтровали список по имени, ожидая выбрать
// именно видимых, а не вообще всех участников гонки).
function chartFilteredDatasets(datasets) {
    const q = _chartSearchQuery.trim().toLowerCase();
    return q ? datasets.filter(d => d._name.toLowerCase().includes(q)) : datasets;
}
function chartSelectAllToggleHtml(datasets) {
    const filtered = chartFilteredDatasets(datasets);
    if (filtered.length === 0) return '';
    const allSelected = filtered.every(d => _chartSelectedBibs.includes(d._bib));
    return `<button class="chart-select-all-btn" id="chartSelectAllToggle">${allSelected ? 'Очистить всех' : 'Выбрать всех'}</button>`;
}
function isMobileChartLayout() {
    return window.matchMedia('(max-width: 640px)').matches;
}
function chartSidebarHtml(datasets, tall) {
    if (isMobileChartLayout()) return chartPickerMobileHtml(datasets);
    // Раньше здесь были ДВЕ кнопки очистки одновременно — "Выбрать/Очистить
    // всех" над списком и "Сбросить выбор (N)" под ним, дублирующие друг
    // друга при полном выборе. Оставили одну, под списком (найдено
    // пользователем 2026-07-22).
    const hint = _chartSelectedBibs.length ? '' : `<div class="chart-hint-sidebar">Выберите участников для сравнения</div>`;
    return `<div class="chart-sidebar${tall ? ' chart-sidebar--tall' : ''}">
        <input type="text" class="chart-search" id="chartSearchInput" placeholder="Поиск участника..." value="${_chartSearchQuery.replace(/"/g, '&quot;')}">
        <div class="chart-participant-list" id="chartParticipantList">${chartParticipantListItemsHtml(datasets)}</div>
        <div id="chartSelectAllWrap">${chartSelectAllToggleHtml(datasets)}</div>
        ${hint}
    </div>`;
}
// Мобильный picker — компактная кнопка-триггер + bottom sheet, вместо тесного
// инлайн-сайдбара (запрошено пользователем 2026-07-24). Переиспользует те же
// id (#chartSearchInput/#chartParticipantList/#chartSelectAllWrap), что и
// десктопный .chart-sidebar — на экране одновременно есть только один из
// двух вариантов (см. isMobileChartLayout() в chartSidebarHtml), поэтому
// конфликта дублирующихся id нет, а весь остальной handler-код (поиск,
// чекбоксы, "выбрать всех") работает без изменений в обоих вариантах.
function chartPickerMobileHtml(datasets) {
    const n = _chartSelectedBibs.length;
    return `<div class="chart-picker-mobile">
        <button class="chart-picker-trigger" id="chartPickerTrigger">
            <span>${n ? `Сравниваю: ${n} участник${n === 1 ? '' : n < 5 ? 'а' : 'ов'}` : 'Выбрать участников для сравнения'}</span>
            <span class="chart-picker-trigger-arrow">›</span>
        </button>
    </div>
    <div class="chart-sheet-overlay${_chartSheetOpen ? ' open' : ''}" id="chartSheetOverlay">
        <div class="chart-sheet">
            <div class="chart-sheet-hdr">
                <span>Выбор участников</span>
                <button class="chart-sheet-close" id="chartSheetClose" aria-label="Закрыть">✕</button>
            </div>
            <input type="text" class="chart-search" id="chartSearchInput" placeholder="Поиск участника..." value="${_chartSearchQuery.replace(/"/g, '&quot;')}">
            <div class="chart-participant-list" id="chartParticipantList">${chartParticipantListItemsHtml(datasets)}</div>
            <div class="chart-sheet-footer">
                <div id="chartSelectAllWrap">${chartSelectAllToggleHtml(datasets)}</div>
                <button class="chart-sheet-done" id="chartSheetDone">Готово</button>
            </div>
        </div>
    </div>`;
}
// Лёгкое обновление списка участников (поиск) — НЕ трогает <input>, чтобы
// не терять фокус/курсор на каждое нажатие клавиши (полный render() чата
// пересоздаёт DOM целиком, что сбросило бы фокус посреди набора текста).
function refreshChartParticipantList() {
    const listEl = document.getElementById('chartParticipantList');
    if (!listEl) return;
    listEl.innerHTML = chartParticipantListItemsHtml(_lastChartDatasets);
    attachChartCheckboxHandlers();
    // Кнопка "Выбрать/Очистить всех" зависит от текущего поиска (тот же
    // фильтр, что применяется к списку) — при вводе в поиск её текст и
    // набор участников, на которых она действует, тоже должны обновляться.
    const toggleWrapEl = document.getElementById('chartSelectAllWrap');
    if (toggleWrapEl) {
        toggleWrapEl.innerHTML = chartSelectAllToggleHtml(_lastChartDatasets);
        attachChartSelectAllHandler();
    }
}
function attachChartCheckboxHandlers() {
    document.querySelectorAll('[data-chartbib]').forEach(cb => {
        cb.addEventListener('change', () => {
            // bib из API приходит СТРОКОЙ (JSON), а dataset.chartbib — тоже
            // строка (HTML data-атрибуты всегда строки) — раньше здесь стоял
            // Number(...), из-за чего _chartSelectedBibs (числа) никогда не
            // совпадал с d._bib (строки) в .includes()/.indexOf() — выбор
            // визуально "срабатывал" (чекбокс отмечался), но график тут же
            // не находил совпадений и оставался пустым/несравнивающим.
            chartToggleSelect(cb.dataset.chartbib);
            render(); // выбор меняет сами линии графика — нужен полный ре-рендер
        });
    });
}
function attachChartSidebarHandlers() {
    const search = document.getElementById('chartSearchInput');
    if (search) {
        search.addEventListener('input', () => {
            _chartSearchQuery = search.value;
            refreshChartParticipantList();
        });
    }
    attachChartCheckboxHandlers();
    attachChartSelectAllHandler();
    attachChartSheetHandlers();
}
// Открытие/закрытие мобильного bottom sheet (см. chartPickerMobileHtml).
// Клик по фону (не по самой шторке) закрывает — сама шторка не всплывает
// клик наверх благодаря проверке e.target === overlay. Пока шторка открыта,
// скролл фоновой страницы заблокирован (overflow:hidden на body), иначе
// свайп по затемнённому фону прокручивал бы список результатов под ней.
function attachChartSheetHandlers() {
    const overlay = document.getElementById('chartSheetOverlay');
    if (!overlay) { document.body.style.overflow = ''; return; }
    document.body.style.overflow = _chartSheetOpen ? 'hidden' : '';
    const trigger = document.getElementById('chartPickerTrigger');
    if (trigger) trigger.addEventListener('click', () => { _chartSheetOpen = true; render(); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) { _chartSheetOpen = false; render(); } });
    const closeBtn = document.getElementById('chartSheetClose');
    if (closeBtn) closeBtn.addEventListener('click', () => { _chartSheetOpen = false; render(); });
    const doneBtn = document.getElementById('chartSheetDone');
    if (doneBtn) doneBtn.addEventListener('click', () => { _chartSheetOpen = false; render(); });
}
function attachChartSelectAllHandler() {
    const btn = document.getElementById('chartSelectAllToggle');
    if (!btn) return;
    btn.addEventListener('click', () => {
        const filtered = chartFilteredDatasets(_lastChartDatasets);
        const allSelected = filtered.length > 0 && filtered.every(d => _chartSelectedBibs.includes(d._bib));
        if (allSelected) {
            // "Очистить всех" — снимаем выбор только с видимых (по поиску),
            // остальной ранее выбранный вне фильтра остаётся нетронутым.
            const filteredBibs = new Set(filtered.map(d => d._bib));
            _chartSelectedBibs = _chartSelectedBibs.filter(bib => !filteredBibs.has(bib));
        } else {
            filtered.forEach(d => { if (!_chartSelectedBibs.includes(d._bib)) _chartSelectedBibs.push(d._bib); });
        }
        render();
    });
}
function buildCompareDataset(d, color) {
    return {
        _bib: d._bib, label: d._name, data: d.data,
        borderColor: color, backgroundColor: color,
        borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 6,
        pointBackgroundColor: color, pointBorderColor: cssVar('--bg2'), pointBorderWidth: 1.5,
        tension: 0.15, spanGaps: true,
    };
}

function chartParticipantRowsForStage(tabStage) {
    const dbStage = TAB_TO_DB_STAGE[tabStage];
    const role = STAGE_ROLE[dbStage];
    const { individual, relay } = getFiltered();
    // swimRef — время заплыва (у относящегося участника лично, у эстафеты —
    // пловца команды) — нужно, чтобы скорректировать первую КТ вело1 (см.
    // buildPaceDatasets: cumulative этой КТ считается от старта ГОНКИ,
    // включает заплыв+переход, а не только время на самом велосипеде).
    const rows = individual.map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, splits: r.splits, swimRef: r.swim_s }));
    relay.forEach(t => {
        const m = t.members.find(mm => mm.relay_stage === role);
        // Участник этой роли — конкретный человек с реальным полом,
        // фильтр по полу должен на него распространяться (найдено
        // пользователем 2026-07-23, п.5).
        if (m && (_gender === 'all' || m.gender === _gender)) rows.push({ bib: t.bib, name: `${m.surname} ${m.name} (${t.team_name})`, splits: m.splits, swimRef: t.members.find(x => x.relay_stage === 'swim')?.swim_s });
    });
    return { dbStage, rows };
}

// Вело (оба дня) — непрерывная линия скорости через весь велоэтап (421 км):
// вело1 (0-145км) сразу продолжается вело2 (145-421км), X — накопительный
// километраж, без разрыва на границе дней (запрошено пользователем
// 2026-07-19, по аналогии со Сводом вело в таблице результатов).
function buildBikeCombinedPaceDatasets() {
    const { individual, relay } = getFiltered();
    const rows = individual.map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, splits: r.splits, swimRef: r.swim_s }));
    relay.forEach(t => {
        const m = t.members.find(mm => mm.relay_stage === 'bike');
        // См. chartParticipantRowsForStage — фильтр по полу применяется к
        // личному полу велосипедиста (найдено пользователем 2026-07-23, п.5).
        if (m && (_gender === 'all' || m.gender === _gender)) rows.push({ bib: t.bib, name: `${m.surname} ${m.name} (${t.team_name})`, splits: m.splits, swimRef: t.members.find(x => x.relay_stage === 'swim')?.swim_s });
    });
    const BIKE1_KM = CHECKPOINT_DIST_KM.bike_day1[STAGE_MAX_SEQ.bike_day1]; // 145
    return rows.map(r => {
        const pts = [];
        for (let seq = 1; seq <= STAGE_MAX_SEQ.bike_day1; seq++) {
            let splitRaw = r.splits?.bike_day1?.[seq];
            if (seq === 1 && splitRaw != null && r.swimRef != null) splitRaw -= r.swimRef; // см. buildPaceDatasets
            const v = splitPaceValue('bike_day1', seq, splitRaw);
            if (v != null) pts.push({ x: CHECKPOINT_DIST_KM.bike_day1[seq], y: v });
        }
        for (let seq = 1; seq <= STAGE_MAX_SEQ.bike_day2; seq++) {
            const v = splitPaceValue('bike_day2', seq, r.splits?.bike_day2?.[seq]);
            if (v != null) pts.push({ x: BIKE1_KM + CHECKPOINT_DIST_KM.bike_day2[seq], y: v });
        }
        if (pts.length && pts[0].x > 0) pts.unshift({ x: 0, y: pts[0].y });
        return pts.length ? { _bib: r.bib, _name: r.name, data: pts } : null;
    }).filter(Boolean);
}

function buildPaceDatasets(tabStage) {
    if (tabStage === 'bike') return buildBikeCombinedPaceDatasets();
    const { dbStage, rows } = chartParticipantRowsForStage(tabStage);
    const maxSeq = STAGE_MAX_SEQ[dbStage];
    return rows.map(r => {
        const pts = [];
        for (let seq = 1; seq <= maxSeq; seq++) {
            let splitRaw = r.splits?.[dbStage]?.[seq];
            // Первая КТ bike_day1: cumulative_s в БД = elapsed от старта
            // ГОНКИ (единый таймер со swim, нет seq=0 от которого вычесть),
            // значит она "впридачу" содержит время всего заплыва+перехода —
            // без вычитания скорость на первом отрезке считалась бы по
            // раздутому времени (см. тот же нюанс на странице участника,
            // stageBody()). Баг найден пользователем 2026-07-19.
            if (dbStage === 'bike_day1' && seq === 1 && splitRaw != null && r.swimRef != null) {
                splitRaw = splitRaw - r.swimRef;
            }
            const v = splitPaceValue(dbStage, seq, splitRaw);
            if (v != null) pts.push({ x: CHECKPOINT_DIST_KM[dbStage][seq], y: v });
        }
        // Реального темпа на 0 км не существует (старт этапа) — первая КТ
        // обычно на 1+ км, из-за чего линия визуально "не доходила" до
        // начала оси (даже с min:0 на шкале). Экстраполируем горизонтально
        // от старта до первой КТ на уровне её темпа — читаемости ради,
        // не как измеренное значение (запрошено пользователем 2026-07-19).
        if (pts.length && pts[0].x > 0) pts.unshift({ x: 0, y: pts[0].y });
        return pts.length ? { _bib: r.bib, _name: r.name, data: pts } : null;
    }).filter(Boolean);
}

// Приглушённый цвет линий (--chart-context) на тёмной теме не проходит
// порог контраста 3:1 сам по себе (см. dataviz skill validate_palette.js —
// WARN, "not dismissable" без видимой подписи) — активная линия ПОДСВЕЧЕНА
// (толще + акцентный цвет), но дополнительно несёт подпись участника прямо
// на канвасе (не только в тултипе), поэтому опознание не зависит от того,
// хватает ли контраста самой линии.
const activeLineLabelPlugin = {
    id: 'activeLineLabel',
    afterDatasetsDraw(chart) {
        const info = chart._hoverInfo;
        if (!info) return;
        const { ctx } = chart;
        ctx.save();
        ctx.font = '700 11px system-ui, sans-serif';
        const padX = 7, padY = 4;
        const tw = ctx.measureText(info.text).width;
        const bw = tw + padX * 2, bh = 14 + padY * 2;
        let bx = info.x + 10;
        if (bx + bw > chart.width - 4) bx = info.x - bw - 10;
        // Клэмп в границы канваса — на узких мобильных ширинах плашка шире
        // свободного места С ОБЕИХ сторон точки, и без этого могла вылезать
        // за левый край (найдено пользователем 2026-07-24, текст обрезался).
        bx = Math.max(4, Math.min(chart.width - bw - 4, bx));
        const by = Math.max(2, Math.min(chart.height - bh - 2, info.y - bh / 2));
        ctx.fillStyle = cssVar('--red');
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 4); else ctx.rect(bx, by, bw, bh);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.text, bx + padX, by + bh / 2);
        ctx.restore();
    },
};

// Единый геометрический hit-test для графиков-"спагетти" (Темп/скорость и
// Позиция) — какая ЛИНИЯ ближе всего к пикселю курсора/клика. Chart.js'овский
// interaction.mode:'nearest' ищет ближайшую ОТДЕЛЬНУЮ плотную точку (там, где
// стоят КТ) среди ВСЕХ линий сразу — при большом числе пересекающихся линий
// и редких КТ он мог подсветить линию, чья ближайшая точка формально ближе
// курсору в пикселях, хотя сама линия МЕЖДУ КТ проходит визуально далеко от
// курсора (баг-репорт пользователя со скриншотом, 2026-07-22). Вместо этого
// для каждого датасета берём Y на прямой, соединяющей два соседних по X
// точки, РОВНО в X курсора (линейная интерполяция — так же, как Chart.js
// физически рисует линию между КТ) и сравниваем пиксельное Y-расстояние от
// курсора именно до этой интерполированной линии, а не до одиночных точек.
function nearestDatasetIndexAtPixel(chart, xPixel, yPixel, maxDistPx = null) {
    const xScale = chart.scales?.x, yScale = chart.scales?.y;
    if (!xScale || !yScale) return null;
    const cursorX = xScale.getValueForPixel(xPixel);
    let bestIdx = null, bestDist = Infinity;
    chart.data.datasets.forEach((ds, i) => {
        const pts = ds.data;
        if (!pts || pts.length === 0) return;
        let p0 = null, p1 = null;
        for (let k = 0; k < pts.length - 1; k++) {
            if (pts[k].x <= cursorX && cursorX <= pts[k + 1].x) { p0 = pts[k]; p1 = pts[k + 1]; break; }
        }
        let yAtCursor;
        if (p0 && p1) {
            const frac = p1.x === p0.x ? 0 : (cursorX - p0.x) / (p1.x - p0.x);
            yAtCursor = p0.y + frac * (p1.y - p0.y);
        } else {
            // Курсор левее первой или правее последней точки датасета —
            // ближайшая точка линии в этом направлении это её крайняя точка.
            const edge = cursorX < pts[0].x ? pts[0] : pts[pts.length - 1];
            yAtCursor = edge.y;
        }
        const dist = Math.abs(yScale.getPixelForValue(yAtCursor) - yPixel);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    });
    if (bestIdx == null) return null;
    return (maxDistPx != null && bestDist > maxDistPx) ? null : bestIdx;
}

// Общий "hover подсвечивает ближайшую линию" — переиспользуется обоими
// графиками (Темп/скорость и Позиция). formatPoint(rawX, rawY) — строит
// текст значения ("3.9 км: 0:22 /100м" и т.п.); ОДНА плашка
// (activeLineLabelPlugin) показывает имя+значение вместе — раньше имя
// рисовал канвас-плагин, а значение отдельно стандартный тултип Chart.js,
// и они могли перекрываться (найдено пользователем 2026-07-20). Активная
// линия определяется через nearestDatasetIndexAtPixel (см. выше), не через
// встроенный elements/interaction.mode Chart.js.
function attachSpaghettiHover(chart, accent, context, formatPoint) {
    chart.options.onHover = function (evt) {
        const activeIdx = nearestDatasetIndexAtPixel(this, evt.x, evt.y);
        this.data.datasets.forEach((d, i) => {
            const active = i === activeIdx;
            d.borderColor = active ? accent : context;
            d.borderWidth = active ? 2.5 : 1;
            d.pointRadius = active ? 4 : 2;
            d.pointBackgroundColor = active ? accent : context;
        });
        if (activeIdx != null) {
            const dataPts = this.data.datasets[activeIdx].data;
            // Плашка/значение по-прежнему привязаны к РЕАЛЬНОЙ точке КТ —
            // ближайшей по X к курсору внутри уже выбранного (по линии) датасета.
            const cursorX = this.scales.x.getValueForPixel(evt.x);
            let nearestI = 0, nearestDist = Infinity;
            dataPts.forEach((p, i) => {
                const dx = Math.abs(p.x - cursorX);
                if (dx < nearestDist) { nearestDist = dx; nearestI = i; }
            });
            const pt = this.getDatasetMeta(activeIdx).data[nearestI]; // пиксельные координаты
            const raw = dataPts[nearestI]; // реальные x/y значения
            const name = this.data.datasets[activeIdx].label;
            const valueText = formatPoint ? formatPoint(raw.x, raw.y) : '';
            this._hoverInfo = { x: pt.x, y: pt.y, text: valueText ? `${name} — ${valueText}` : name };
        } else {
            this._hoverInfo = null;
        }
        this.update('none');
    };
}

// Клик по линии на графике-"спагетти" добавляет/убирает участника из
// сравнения (_chartSelectedBibs) — та же кнопка, что и чекбокс в сайдбаре
// (chartToggleSelect). Использует ТОТ ЖЕ hit-test, что и hover
// (nearestDatasetIndexAtPixel) — иначе клик мог бы выбрать не того
// участника, которого только что подсвечивал hover. Клик мимо всех линий
// (дальше maxDistPx) ничего не делает.
//
// На тач-устройствах (pointer: coarse) клик/тап по линии ОТКЛЮЧЁН — тап на
// телефоне это единственный способ увидеть activeLineLabelPlugin в точке
// касания (hover там же эмулируется через touchmove), и если тап ЕЩЁ и
// переключает сравнение — график сразу перестраивается в режим сравнения
// вместо показа значения в точке (запрошено пользователем 2026-07-24: "я
// хочу посмотреть информацию в точке, а у меня перестраивается график").
// На мобильном сравнение включается только через чекбоксы (сайдбар/модалка).
function attachSpaghettiClick(chart) {
    chart.options.onClick = function (evt) {
        if (window.matchMedia('(pointer: coarse)').matches) return;
        const idx = nearestDatasetIndexAtPixel(this, evt.x, evt.y, 30);
        if (idx == null) return;
        const bib = this.data.datasets[idx]._bib;
        if (bib == null) return;
        chartToggleSelect(bib);
        render();
    };
}

function buildSpaghettiDataset(d, accent, context) {
    return {
        _bib: d._bib, label: d._name, data: d.data,
        borderColor: context, backgroundColor: context,
        // Точки на местах КТ видны всегда (п.7.3), не только на hover —
        // маленькие/приглушённые по умолчанию, крупнее на активной линии
        // (см. attachSpaghettiHover, который переключает pointRadius так же,
        // как сейчас переключает borderColor/borderWidth).
        borderWidth: 1, pointRadius: 2, pointHoverRadius: 5,
        pointBackgroundColor: context, pointBorderWidth: 0,
        pointHoverBackgroundColor: accent, pointHoverBorderColor: cssVar('--bg2'), pointHoverBorderWidth: 2,
        tension: 0.15, spanGaps: true,
    };
}

// Переключатель Темп/скорость ↔ Позиция — компактный filter-group/filter-btn
// (тот же паттерн, что у остальных фильтров), но выведен ОТДЕЛЬНОЙ строкой
// над графиком внутри .chart-main (см. .chart-mode-switch-row), а не в
// строке .filters рядом с "Этап:" — так, как реально имел в виду пользователь
// в "варианте A" брейншторминга (2026-07-23, п.6 v5), уточнено скриншотом
// 2026-07-24 после того, как первая попытка смешала его со строкой "Этап:".
function chartModeSwitchHtml() {
    return `<div class="filter-group" id="chartModeGroup">
        <button class="filter-btn${_chartSubTab === 'position' ? ' active' : ''}" data-chartmode="position">Позиция</button>
        <button class="filter-btn${_chartSubTab === 'pace' ? ' active' : ''}" data-chartmode="pace">Темп/скорость</button>
    </div>`;
}
function attachChartModeSwitchHandler() {
    document.querySelectorAll('#chartModeGroup [data-chartmode]').forEach(btn => {
        btn.addEventListener('click', () => { _chartSubTab = btn.dataset.chartmode; render(); });
    });
}

function renderPaceChart() {
    // "Вело (оба дня)" — bike_day1 как эталон единиц (км/ч, без инверсии Y)
    // для форматирования/тултипа; сама шкала X считается отдельно ниже
    // (0-421 км на весь объединённый велоэтап, не 0-145 одного дня).
    const isBikeCombined = _paceStage === 'bike';
    const dbStage = isBikeCombined ? 'bike_day1' : TAB_TO_DB_STAGE[_paceStage];
    const datasets = buildPaceDatasets(_paceStage);
    _lastChartDatasets = datasets;
    // Ранее выбранные для сравнения участники могли "выпасть" из текущего
    // списка при смене фильтра формата/пола (getFiltered() внутри
    // chartParticipantRowsForStage) — без этой очистки график сравнения
    // становился пустым, а чекбоксы не совпадали с "Сбросить выбор (N)".
    const visibleBibs = new Set(datasets.map(d => d._bib));
    _chartSelectedBibs = _chartSelectedBibs.filter(bib => visibleBibs.has(bib));
    document.getElementById('app').innerHTML = `
        <div class="filters" style="padding:0 0 12px;border-bottom:none;background:transparent">
            <span class="filter-label">Этап:</span>
            <div class="filter-group" id="paceStageGroup">
                ${Object.keys(PACE_STAGE_LABEL).map(s => `<button class="filter-btn${s === _paceStage ? ' active' : ''}" data-pacestage="${s}">${PACE_STAGE_LABEL[s]}</button>`).join('')}
            </div>
        </div>
        <div class="chart-card"><div class="chart-layout">
            ${chartSidebarHtml(datasets)}
            <div class="chart-main">
                <div class="chart-mode-switch-row">${chartModeSwitchHtml()}</div>
                <div class="chart-hint">${_chartSelectedBibs.length ? 'Сравнение выбранных участников — снимите отметку слева, чтобы вернуться к общему виду' : 'Наведите курсор (или коснитесь на телефоне) на линию, чтобы увидеть участника, либо выберите нескольких слева для сравнения'}</div>
                <div class="chart-canvas-wrap"><canvas id="sibermanPaceChart"></canvas></div>
            </div>
        </div></div>`;
    document.querySelectorAll('#paceStageGroup [data-pacestage]').forEach(btn => {
        btn.addEventListener('click', () => { _paceStage = btn.dataset.pacestage; renderPaceChart(); });
    });
    attachChartModeSwitchHandler();
    attachChartSidebarHandlers();

    if (_paceChart) { _paceChart.destroy(); _paceChart = null; }
    if (datasets.length === 0) {
        document.querySelector('.chart-canvas-wrap').innerHTML = '<div class="empty">Нет данных для графика</div>';
        return;
    }
    const accent = cssVar('--red');
    const context = cssVar('--chart-context');
    const isCompare = _chartSelectedBibs.length > 0;
    const chartDatasets = isCompare
        ? datasets.filter(d => _chartSelectedBibs.includes(d._bib))
            .map(d => buildCompareDataset(d, chartCompareColor(_chartSelectedBibs.indexOf(d._bib))))
        : datasets.map(d => buildSpaghettiDataset(d, accent, context));
    const ctx = document.getElementById('sibermanPaceChart').getContext('2d');
    _paceChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: chartDatasets },
        plugins: [activeLineLabelPlugin],
        options: {
            responsive: true, maintainAspectRatio: false,
            layout: { padding: { top: 24, bottom: 12, left: 4, right: 12 } },
            interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
            plugins: {
                legend: { display: isCompare, position: 'top', labels: { color: cssVar('--text'), boxWidth: 12, font: { size: 11 } } },
                // В обычном режиме (не сравнение) значение уже показывает
                // ОДНА плашка activeLineLabelPlugin (имя+значение вместе) —
                // встроенный тултип Chart.js отключён, чтобы не рисовать
                // вторую плашку поверх/рядом с первой (найдено 2026-07-20).
                // В режиме сравнения (легенда уже называет линии) — обычный
                // тултип с именем в подписи, без activeLineLabelPlugin.
                tooltip: isCompare
                    ? { callbacks: { label(item) { return `${item.dataset.label} — ${item.parsed.x.toFixed(1)} км: ${paceValueLabel(dbStage, item.parsed.y)}`; } } }
                    : { enabled: false },
            },
            scales: {
                // min:0 — иначе Chart.js авто-подбирает диапазон от первой КТ
                // (напр. 1.3 км для заплыва), визуально создавая впечатление,
                // что гонка стартует не от нуля, а от первой точки данных.
                x: {
                    type: 'linear', min: 0,
                    max: isBikeCombined ? CHECKPOINT_DIST_KM.bike_day1[STAGE_MAX_SEQ.bike_day1] + CHECKPOINT_DIST_KM.bike_day2[STAGE_MAX_SEQ.bike_day2] : CHECKPOINT_DIST_KM[dbStage][STAGE_MAX_SEQ[dbStage]],
                    title: { display: true, text: 'Километраж этапа', color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted') }, grid: { color: cssVar('--border') },
                },
                y: {
                    // Плавание/бег — темп (секунды, меньше = быстрее): быстрый
                    // темп сверху, медленный снизу (п.10) — инвертируем шкалу.
                    // Вело — скорость (км/ч, больше = быстрее) уже естественно
                    // растёт вверх, инверсия не нужна.
                    reverse: dbStage === 'swim' || dbStage === 'run',
                    // grace — запас поверх авто-подобранного диапазона данных,
                    // иначе крайняя точка (напр. самая быстрая скорость)
                    // рисуется ровно на границе области графика и визуально
                    // "обрезается" (найдено пользователем 2026-07-19).
                    grace: '8%',
                    title: { display: true, text: STAGE_UNIT_TITLE[_paceStage], color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted'), callback: v => (dbStage === 'bike_day1' || dbStage === 'bike_day2') ? v.toFixed(0) : fmtSecClock(v) },
                    grid: { color: cssVar('--border') },
                },
            },
        },
    });
    if (!isCompare) attachSpaghettiHover(_paceChart, accent, context, (x, y) => `${x.toFixed(1)} км: ${paceValueLabel(dbStage, y)}`);
    // Клик работает и в режиме сравнения — тем же кликом по линии участника
    // можно снять его со сравнения (симметрично чекбоксу в сайдбаре).
    attachSpaghettiClick(_paceChart);
}

function virtualXToKm(x) {
    for (const seg of POSITION_X_SEGMENTS) {
        if (x <= seg.xEnd) {
            const frac = seg.xEnd === seg.xStart ? 0 : (x - seg.xStart) / (seg.xEnd - seg.xStart);
            return seg.kmStart + frac * (seg.kmEnd - seg.kmStart);
        }
    }
    return 515;
}
// Точки датасета остаются в реальных км (buildPositionDatasets тестируется
// именно на реальных км, см. tests/js) — трансформация в виртуальное
// X-пространство применяется только непосредственно перед передачей в
// Chart.js, отдельным шагом.
function withVirtualX(d) {
    return { ...d, data: d.data.map(p => ({ x: kmToVirtualX(p.x), y: p.y })) };
}

// На графике "Позиция" эстафету на конкретном этапе подписываем как
// "Имя Фамилия (Команда)" — участник, который реально бежал/плыл/крутил
// педали этот этап, по аналогии с chartParticipantRowsForStage/
// buildBikeCombinedPaceDatasets (график Темп/скорость). На "Вся гонка"
// (stage falsy) оставляем только название команды — там сравнивается
// команда целиком, а не конкретный её участник (подтверждено пользователем
// 2026-07-22: "На всей гонке показывается только название команды").
function relayDisplayName(team, stage) {
    if (!stage) return team.team_name;
    const role = stage === 'bike' ? 'bike' : STAGE_ROLE[stage];
    const m = team.members.find(x => x.relay_stage === role);
    return m ? `${m.surname} ${m.name} (${team.team_name})` : team.team_name;
}

function buildPositionDatasets(stage) {
    const { individual, relay } = getFiltered();
    // getFiltered() не фильтрует эстафету по полу вообще (команда не имеет
    // единого пола) — корректно для этапов (там команду представляет один
    // участник со своим полом), но не для графика "Вся гонка": там ранг
    // считается на уровне всей команды, и сравнивать её с полом-фильтром
    // некорректно. Убираем эстафету из "Вся гонка" при активном фильтре
    // пола, оставляем как есть на конкретном этапе (найдено пользователем
    // 2026-07-22).
    // На конкретном этапе (stage truthy) команду представляет один
    // персонифицированный участник этой роли — его личный пол должен
    // уважать фильтр, как и у личников (найдено пользователем 2026-07-23,
    // п.5: при фильтре по полу в списке выбора графика оставались
    // участники не того пола).
    const relayForRows = !stage
        ? ((_gender !== 'all') ? [] : relay)
        : relay.filter(t => {
            const role = stage === 'bike' ? 'bike' : STAGE_ROLE[stage];
            const m = t.members.find(x => x.relay_stage === role);
            return m && (_gender === 'all' || m.gender === _gender);
        });
    const rows = [
        ...individual.map(r => ({ key: r.bib, name: `${r.surname} ${r.name}`, cp: r.cp, swim_s: r.swim_s, bike1_s: r.bike1_s, bike2_s: r.bike2_s, run_s: r.run_s })),
        ...relayForRows.map(t => { const tr = teamGapRow(t); return { key: t.bib, name: relayDisplayName(t, stage), cp: tr.cp, swim_s: tr.swim_s, bike1_s: tr.bike1_s, bike2_s: tr.bike2_s, run_s: tr.run_s }; }),
    ];
    if (stage === 'bike') {
        // Вело (оба дня) — единый велоэтап 421 км без разрыва на границе
        // дней, по аналогии с buildBikeCombinedPaceDatasets (запрошено
        // пользователем 2026-07-22).
        const n1 = STAGE_MAX_SEQ.bike_day1, n2 = STAGE_MAX_SEQ.bike_day2;
        const bySeq = computeBikeCombinedCheckpointRanks(rows);
        const BIKE1_KM = CHECKPOINT_DIST_KM.bike_day1[n1];
        return rows.map(r => {
            const pts = [];
            for (let vseq = 1; vseq <= n1; vseq++) {
                const rank = bySeq[vseq]?.[r.key];
                if (rank != null) pts.push({ x: CHECKPOINT_DIST_KM.bike_day1[vseq], y: rank });
            }
            for (let vseq = n1 + 1; vseq <= n1 + n2; vseq++) {
                const rank = bySeq[vseq]?.[r.key];
                if (rank != null) pts.push({ x: BIKE1_KM + CHECKPOINT_DIST_KM.bike_day2[vseq - n1], y: rank });
            }
            if (pts.length && pts[0].x > 0) pts.unshift({ x: 0, y: pts[0].y });
            return pts.length ? { _bib: r.key, _name: r.name, data: pts } : null;
        }).filter(Boolean);
    }
    if (stage) {
        // Место ВНУТРИ этапа (не по всей гонке) — сравнение только по
        // сырому времени НА этом этапе (computeCheckpointRanks), не по
        // накопленному времени гонки. X — реальный км этапа.
        const bySeq = computeCheckpointRanks(rows, stage, STAGE_MAX_SEQ[stage]);
        return rows.map(r => {
            const pts = [];
            for (let seq = 1; seq <= STAGE_MAX_SEQ[stage]; seq++) {
                const rank = bySeq[seq]?.[r.key];
                if (rank != null) pts.push({ x: CHECKPOINT_DIST_KM[stage][seq], y: rank });
            }
            // Та же экстраполяция до X=0, что и в глобальном режиме ниже —
            // первая КТ этапа обычно не на 0 км, без неё линии визуально
            // начинаются с "воздуха" вместо самого начала оси (найдено
            // пользователем 2026-07-21 на графике "Плавание").
            if (pts.length && pts[0].x > 0) pts.unshift({ x: 0, y: pts[0].y });
            return pts.length ? { _bib: r.key, _name: r.name, data: pts } : null;
        }).filter(Boolean);
    }
    const ranksByStage = {};
    STAGE_ORDER.forEach(s => { ranksByStage[s] = computeGlobalCheckpointRanks(rows, s, STAGE_MAX_SEQ[s]); });
    return rows.map(r => {
        const pts = [];
        STAGE_ORDER.forEach(s => {
            const bySeq = ranksByStage[s];
            for (let seq = 1; seq <= STAGE_MAX_SEQ[s]; seq++) {
                const rank = bySeq[seq]?.[r.key];
                if (rank != null) pts.push({ x: STAGE_KM_OFFSET[s] + CHECKPOINT_DIST_KM[s][seq], y: rank });
            }
        });
        // Та же экстраполяция до X=0, что и в buildPaceDatasets (первая КТ
        // плавания обычно на 1+ км, не на 0) — читаемости ради, не как
        // измеренное место (запрошено пользователем 2026-07-19).
        if (pts.length && pts[0].x > 0) pts.unshift({ x: 0, y: pts[0].y });
        return pts.length ? { _bib: r.key, _name: r.name, data: pts } : null;
    }).filter(Boolean);
}

function renderPositionChart() {
    const datasets = buildPositionDatasets(_positionStage);
    _lastChartDatasets = datasets;
    const visibleBibs = new Set(datasets.map(d => d._bib));
    _chartSelectedBibs = _chartSelectedBibs.filter(bib => visibleBibs.has(bib));
    // Порядок как в переключателе "Темп/скорость" — объединённое "Вело
    // (оба дня)" сразу после Плавания, до раздельных Вело 1/Вело 2.
    const positionStageOptions = [
        { key: 'all', label: 'Вся гонка' },
        { key: 'swim', label: STAGE_LABEL_RU.swim },
        { key: 'bike', label: STAGE_LABEL_RU.bike },
        { key: 'bike_day1', label: STAGE_LABEL_RU.bike_day1 },
        { key: 'bike_day2', label: STAGE_LABEL_RU.bike_day2 },
        { key: 'run', label: STAGE_LABEL_RU.run },
    ];
    document.getElementById('app').innerHTML = `
        <div class="filters" style="padding:0 0 12px;border-bottom:none;background:transparent">
            <span class="filter-label">Этап:</span>
            <div class="filter-group" id="positionStageGroup">
                ${positionStageOptions.map(o => `<button class="filter-btn${(o.key === 'all' ? _positionStage === null : o.key === _positionStage) ? ' active' : ''}" data-positionstage="${o.key}">${o.label}</button>`).join('')}
            </div>
        </div>
        <div class="chart-card"><div class="chart-layout">
            ${chartSidebarHtml(datasets, true)}
            <div class="chart-main">
                <div class="chart-mode-switch-row">${chartModeSwitchHtml()}</div>
                <div class="chart-hint">${_chartSelectedBibs.length ? 'Сравнение выбранных участников — снимите отметку слева, чтобы вернуться к общему виду' : (_positionStage ? `Место на этапе «${STAGE_LABEL_RU[_positionStage]}» на каждой пройденной КТ. Наведите/коснитесь линии, чтобы увидеть участника, либо выберите нескольких слева для сравнения` : 'Место в общем зачёте на каждой пройденной КТ по всей дистанции (0–515 км). Наведите/коснитесь линии, чтобы увидеть участника, либо выберите нескольких слева для сравнения')}</div>
                <div class="chart-canvas-wrap chart-canvas-wrap--position"><canvas id="sibermanPositionChart"></canvas></div>
            </div>
        </div></div>`;
    document.querySelectorAll('#positionStageGroup [data-positionstage]').forEach(btn => {
        btn.addEventListener('click', () => { _positionStage = btn.dataset.positionstage === 'all' ? null : btn.dataset.positionstage; renderPositionChart(); });
    });
    attachChartModeSwitchHandler();
    attachChartSidebarHandlers();

    if (_positionChart) { _positionChart.destroy(); _positionChart = null; }
    if (datasets.length === 0) {
        document.querySelector('.chart-canvas-wrap').innerHTML = '<div class="empty">Нет данных для графика</div>';
        return;
    }
    const positionStageMaxKm = _positionStage === 'bike'
        ? CHECKPOINT_DIST_KM.bike_day1[STAGE_MAX_SEQ.bike_day1] + CHECKPOINT_DIST_KM.bike_day2[STAGE_MAX_SEQ.bike_day2]
        : (_positionStage ? CHECKPOINT_DIST_KM[_positionStage][STAGE_MAX_SEQ[_positionStage]] : 100);
    const accent = cssVar('--red');
    const context = cssVar('--chart-context');
    const isCompare = _chartSelectedBibs.length > 0;
    // В per-stage режиме X уже реальный км этапа — виртуальное преобразование
    // (kmToVirtualX/withVirtualX) применимо только к графику "вся гонка".
    const virtualDatasets = _positionStage ? datasets : datasets.map(withVirtualX);
    const chartDatasets = isCompare
        ? virtualDatasets.filter(d => _chartSelectedBibs.includes(d._bib))
            .map(d => buildCompareDataset(d, chartCompareColor(_chartSelectedBibs.indexOf(d._bib))))
        : virtualDatasets.map(d => buildSpaghettiDataset(d, accent, context));
    // Диапазон оси Y — по ФАКТИЧЕСКИ отображаемым линиям (при сравнении —
    // только выбранные участники), а не по всему полю; иначе при выборе
    // маленькой группы (например, топ-4 среди 39) отступы становятся
    // огромными и бесполезными (п.5, найдено пользователем 2026-07-22).
    const displayedRanks = chartDatasets.flatMap(d => d.data.map(p => p.y));
    const rangeMinRank = Math.min(...displayedRanks);
    const rangeMaxRank = Math.max(...displayedRanks);
    const rankSpan = rangeMaxRank - rangeMinRank + 1;
    // В режиме "Вся гонка" (!_positionStage) сверху ещё рисуются подписи
    // границ этапов (stageBoundaryPlugin) — при маленьком диапазоне мест
    // (сравнение узкой группы) запаса в 2 места не хватало, подписи почти
    // прилипали к верхней линии (найдено пользователем 2026-07-23, п.6 v5).
    const topBufferMin = _positionStage ? 2 : 4;
    const yAxisMin = rangeMinRank - Math.max(topBufferMin, Math.round(rankSpan * 0.15));
    const yAxisMax = rangeMaxRank + Math.max(1, Math.round(rankSpan * 0.08));

    const stageBoundaryPlugin = {
        id: 'stageBoundaries',
        afterDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            ctx.save();
            ctx.strokeStyle = cssVar('--border');
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1;
            ctx.font = '10px system-ui, sans-serif';
            ctx.fillStyle = cssVar('--muted');
            // Границы дней вело (10 и 155 км) внутри общего блока "Вело" —
            // тоньше/без подписи, чтобы не спорить с главными подписями этапов.
            [{ km: 10, label: 'Вело' }, { km: 155, label: null }, { km: 431, label: 'Бег' }].forEach(({ km, label }) => {
                const x = scales.x.getPixelForValue(kmToVirtualX(km));
                ctx.beginPath();
                ctx.moveTo(x, chartArea.top);
                ctx.lineTo(x, chartArea.bottom);
                ctx.stroke();
                if (label) ctx.fillText(label, x + 4, chartArea.top + 12);
            });
            ctx.restore();
        },
    };

    const formatHoverPoint = _positionStage
        ? (x, y) => `${x.toFixed(1)} км: место ${y}`
        : (x, y) => `${virtualXToKm(x).toFixed(1)} км: место ${y}`;

    const ctx = document.getElementById('sibermanPositionChart').getContext('2d');
    _positionChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: chartDatasets },
        plugins: [...(_positionStage ? [] : [stageBoundaryPlugin]), activeLineLabelPlugin],
        options: {
            responsive: true, maintainAspectRatio: false,
            // Больше отступа сверху, чем у графика Темп/скорость — иначе
            // подписи этапов ("Вело"/"Бег", stageBoundaryPlugin) пересекались
            // с линией 1-го места (найдено пользователем 2026-07-20).
            layout: { padding: { top: 36, bottom: 12, left: 4, right: 12 } },
            interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
            plugins: {
                legend: { display: isCompare, position: 'top', labels: { color: cssVar('--text'), boxWidth: 12, font: { size: 11 } } },
                // См. комментарий в renderPaceChart — одна плашка вместо двух.
                tooltip: isCompare
                    ? { callbacks: { label(item) { const km = _positionStage ? item.parsed.x : virtualXToKm(item.parsed.x); return `${item.dataset.label} — ${km.toFixed(1)} км: место ${item.parsed.y}`; } } }
                    : { enabled: false },
            },
            scales: {
                x: {
                    type: 'linear', min: 0,
                    max: positionStageMaxKm,
                    title: { display: true, text: _positionStage ? 'Километраж этапа' : 'Километраж гонки', color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted'), stepSize: _positionStage ? undefined : 10, callback: v => _positionStage ? v.toFixed(0) : Math.round(virtualXToKm(v)) },
                    grid: { color: cssVar('--border') },
                },
                y: {
                    reverse: true,
                    // min/max заданы явно (не авто-подбор Chart.js) — запас
                    // пропорционален диапазону ОТОБРАЖАЕМЫХ мест (rankSpan),
                    // не всему полю участников: при сравнении маленькой
                    // группы отступы автоматически становятся компактными.
                    // Сверху запас больше — там же подписи границ этапов
                    // (stageBoundaryPlugin) в режиме "Вся гонка"; тики всё
                    // равно строятся ТОЛЬКО целыми ниже (afterBuildTicks),
                    // так что дробный/отрицательный min никогда не станет
                    // видимой подписью.
                    min: yAxisMin, max: yAxisMax,
                    afterBuildTicks: axis => {
                        // Тики — только по РЕАЛЬНО отображаемому диапазону мест
                        // (rangeMinRank..rangeMaxRank), не по yAxisMin/Max —
                        // те включают буферную зону под подписи этапов, там
                        // не должно быть подписей тиков без реальных данных.
                        axis.ticks = [];
                        for (let v = Math.max(1, rangeMinRank); v <= rangeMaxRank; v++) axis.ticks.push({ value: v });
                    },
                    title: { display: true, text: 'Место', color: cssVar('--muted') },
                    ticks: { color: cssVar('--muted') },
                    grid: { color: cssVar('--border') },
                },
            },
        },
    });
    if (!isCompare) attachSpaghettiHover(_positionChart, accent, context, formatHoverPoint);
    // Клик работает и в режиме сравнения — тем же кликом по линии участника
    // можно снять его со сравнения (симметрично чекбоксу в сайдбаре).
    attachSpaghettiClick(_positionChart);
}

/* ──────────────── Render: Стартовый лист вело-2 ──────────────── */
// Без фильтров формата/пола (п.8 v6, 2026-08-02, UI-кнопки скрыты в
// render()) — читает _data напрямую, а не getFiltered(), иначе список
// молча остался бы отфильтрованным по формату/полу, унаследованному с
// другой вкладки, без единого видимого элемента, объясняющего почему.
function renderStartlist() {
    const individual = _data.individual;
    const relay = _data.relay;

    let riders = [];
    riders = riders.concat(individual
        .filter(r => r.bike2_start_s != null)
        .map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, city: cityLabel(r), gender: r.gender, start_s: r.bike2_start_s, star: finishStarBadge(r) })));
    relay.forEach(team => {
        team.members.filter(m => m.relay_stage === 'bike' && m.bike2_start_s != null).forEach(m => {
            riders.push({ bib: team.bib, name: `${m.surname} ${m.name}`, city: team.team_name, gender: m.gender, start_s: m.bike2_start_s });
        });
    });
    riders.sort((a, b) => a.start_s - b.start_s);

    if (riders.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Стартовый лист вело-2 появится после финиша лидеров вело-1</div>';
        return;
    }

    let html = `<div class="section-hdr">Расчётный старт вело-2 (по рангу вело-1, топ-5 — интервал 3 мин, далее 1 мин)</div>`;
    html += `<div class="table-wrap"><table>
    <thead><tr><th>Порядок<br>старта</th><th class="r">№</th><th class="name-cell">Участник</th><th>Пол</th><th class="r">Время<br>старта</th></tr></thead><tbody>`;
    riders.forEach((r, i) => {
        html += `<tr>
            <td><span class="rank-num">${i + 1}</span></td>
            <td class="bib-cell">${r.bib}</td>
            <td class="name-cell">
                <span class="name-main">${r.name}</span>${r.star || ''}
                ${r.city ? `<br><span class="name-city">${r.city}</span>` : ''}
            </td>
            <td>${genderBadge(r.gender)}</td>
            <td class="r time-cell">${fmtTime(r.start_s)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Живой секундомер этапа(ов) ──────────────── */
// Виджет над табами, не привязан к фильтрам/вкладке. Плавание и Вело
// День 1 проходят в один календарный день — единый секундомер "День 1"
// от старта гонки (не два отдельных, как могло бы показаться по стадиям).
// Вело День 2 и Бег — отдельные дни, свои секундомеры.
// Сумма total-времён этапов, предшествующих данному — момент входа в этап
// = race_start + эта сумма (у первого дошедшего участника). Для swim — 0
// (масс-старт, начало этапа = старт гонки).
const STAGE_PRIOR_KEYS = { swim: [], bike_day1: ['swim_s'], bike_day2: ['swim_s', 'bike1_s'], run: ['swim_s', 'bike1_s', 'bike2_s'] };
const STAGE_ROLE = { swim: 'swim', bike_day1: 'bike', bike_day2: 'bike', run: 'run' };
// Вкладки, где у эстафетчика уже есть настоящий личный пол (этапы + Свод
// вело) — используется в render() для видимости фильтра по полу (п.8).
const PERSONIFIED_TABS = ['swim', 'run', 'bike'];

function stageParticipantRows(dbStage) {
    const rows = [...(_data.individual || [])];
    (_data.relay || []).forEach(t => {
        const m = t.members.find(mm => mm.relay_stage === STAGE_ROLE[dbStage]);
        if (m) rows.push(m);
    });
    return rows;
}

// Момент входа КОНКРЕТНОГО участника в этап (секунды от старта гонки),
// null — ещё не дошёл (предыдущий этап не завершён).
function stageEntryOffset(row, dbStage) {
    if (dbStage === 'swim') return 0;
    const keys = STAGE_PRIOR_KEYS[dbStage];
    if (keys.some(k => row[k] == null)) return null;
    return keys.reduce((sum, k) => sum + row[k], 0);
}

// Момент начала этапа в целом = вход САМОГО БЫСТРОГО дошедшего участника.
// null — в этап ещё никто не вошёл (этап не начался).
function stageStartOffset(dbStage) {
    if (dbStage === 'swim') return 0;
    let min = null;
    stageParticipantRows(dbStage).forEach(r => {
        const off = stageEntryOffset(r, dbStage);
        if (off != null && (min == null || off < min)) min = off;
    });
    return min;
}

// Остался ли хоть один активный участник, ещё не завершивший этап
// (статус active и не дошёл до последней КТ этапа) — таймер тикает, пока
// это true.
function stageIsPending(dbStage) {
    return stageParticipantRows(dbStage).some(r => {
        if (r.status !== 'active') return false;
        const pos = lastReached(r.cp, dbStage);
        return !(pos && pos.seq === STAGE_MAX_SEQ[dbStage]);
    });
}

// Последовательные "дни" гонки для виджета — swim+bike_day1 склеены в один
// (см. комментарий выше), bike_day2/run идут по отдельности как раньше.
// startOffset() === null значит "ещё не начался" (никто не вошёл), pending()
// значит "кто-то ещё активен внутри".
const WIDGET_STAGES = [
    { label: 'День 1', startOffset: () => 0, pending: () => stageIsPending('swim') || stageIsPending('bike_day1') },
    { label: 'Вело День 2', startOffset: () => stageStartOffset('bike_day2'), pending: () => stageIsPending('bike_day2') },
    { label: 'Бег', startOffset: () => stageStartOffset('run'), pending: () => stageIsPending('run') },
];

// Идём по WIDGET_STAGES по порядку: первый ещё не закрытый элемент и есть
// текущее состояние виджета — тикающий секундомер (уже начался и кто-то
// внутри активен), "следующий этап" (ещё не начался — предыдущий день уже
// закрыт, этот ещё нет) или, если все элементы закрыты, гонка завершена.
function computeStageTimerState() {
    if (!_raceStartEpoch || !_data) return null;
    // Фактическое время старта ещё не наступило — обратный отсчёт до гонки
    // (2026-08-04, запрошено пользователем: раньше секундомер День 1 сразу
    // считал "прошедшее" время от race_start, даже если та дата ещё в
    // будущем — с любым будущим race_start это ушло бы в отрицательные/
    // абсурдные значения при наивном Date.now()-start).
    if (Date.now() < _raceStartEpoch) return { type: 'countdown', startEpoch: _raceStartEpoch };
    for (const s of WIDGET_STAGES) {
        const off = s.startOffset();
        if (off == null) return { type: 'next', label: s.label };
        if (s.pending()) return { type: 'timer', label: s.label, startEpoch: _raceStartEpoch + off * 1000 };
    }
    return { type: 'done' };
}

function renderStageTimers() {
    const el = document.getElementById('stageTimers');
    const state = computeStageTimerState();
    if (!state) {
        el.style.display = 'none';
        el.innerHTML = '';
        return;
    }
    el.style.display = '';
    if (state.type === 'countdown') {
        el.innerHTML = `<div class="stage-timer stage-timer--countdown" data-countdown="${state.startEpoch}">
            <span class="stage-timer-lbl">До старта</span>
            <span class="stage-timer-val">00:00:00</span>
        </div>`;
        tickStageTimers();
    } else if (state.type === 'timer') {
        el.innerHTML = `<div class="stage-timer" data-start="${state.startEpoch}">
            <span class="stage-timer-lbl">${state.label}</span>
            <span class="stage-timer-val">00:00:00</span>
        </div>`;
        tickStageTimers();
    } else if (state.type === 'next') {
        el.innerHTML = `<div class="stage-timer stage-timer--static">
            <span class="stage-timer-lbl">Следующий этап</span>
            <span class="stage-timer-val">${state.label}</span>
        </div>`;
    } else {
        el.innerHTML = `<div class="stage-timer stage-timer--static">
            <span class="stage-timer-val">Гонка завершена</span>
        </div>`;
    }
}

function tickStageTimers() {
    document.querySelectorAll('.stage-timer[data-start]').forEach(el => {
        const elapsed = Math.max(0, Math.floor((Date.now() - Number(el.dataset.start)) / 1000));
        el.querySelector('.stage-timer-val').textContent = fmtTime(elapsed);
    });
    document.querySelectorAll('.stage-timer[data-countdown]').forEach(el => {
        const remaining = Math.max(0, Math.floor((Number(el.dataset.countdown) - Date.now()) / 1000));
        el.querySelector('.stage-timer-val').textContent = fmtTime(remaining);
        // Отсчёт дошёл до нуля — гонка стартовала, пересчитываем состояние
        // целиком (следующий тик уже не должен быть countdown).
        if (remaining === 0) renderStageTimers();
    });
}

/* ──────────────── Автоскролл + live-индикатор табов до активного этапа ────
   Только визуальный эффект панели #tabs — НЕ переключает активную вкладку
   (пользователь остаётся там, где кликнул/где был по умолчанию, т.е. на
   «Итоги гонки»). Два независимых сигнала одного вычисленного состояния:
   скролл (полезен на мобильных, где табы уезжают за экран) и пульсирующая
   точка .tab-live (нужна на десктопе, где все табы и так помещаются в
   строку и скроллить нечего, 2026-08-04).

   Границы этапов (2026-08-04, второй раунд — раньше переход между этапами
   определялся ТОЛЬКО тем, что данные предыдущего этапа "закрыты", из-за
   чего индикатор мог указать на этап, где ещё вообще нет данных, пока
   реальное время до него не дошло):
     Плавание   — масс-старт (race_start), закрывается когда не осталось
                  активных недоплывших (stageIsPending).
     Вело День 1 — начинается по ФАКТУ первого финиша заплыва (не по
                  расписанию — у него нет единого времени старта, каждый
                  входит сразу по своему финишу заплыва), поэтому в момент
                  первого финиша ОБА таба (Плавание+Вело) "живые"
                  одновременно, но автоскролл ещё держится на Плавании,
                  пока оно не закроется полностью.
     Вело День 2 — по расписанию (bike2HasStarted): если админ задал время
                  в админке — по нему; если нет — прежнее поведение (по
                  факту первого входа в вело-2).
     Бег         — аналогично, по расписанию (runHasStarted) или по факту.
   Переиспользует stageIsPending()/stageStartOffset() из секундомера этапа
   выше. */
function anyoneFinishedSwim() {
    return stageParticipantRows('swim').some(r => lastReached(r.cp, 'swim')?.seq === STAGE_MAX_SEQ.swim);
}
function bike2HasStarted() {
    if (_bike2StartEpoch != null) return Date.now() >= _bike2StartEpoch;
    return stageStartOffset('bike_day2') != null;
}
function runHasStarted() {
    if (_runStartEpoch != null) return Date.now() >= _runStartEpoch;
    return stageStartOffset('run') != null;
}
function computeAutoScrollState() {
    if (!_data || !_raceStartEpoch || Date.now() < _raceStartEpoch) return { live: [], scroll: null };
    if (stageIsPending('swim')) {
        const live = anyoneFinishedSwim() ? ['swim', 'bike'] : ['swim'];
        return { live, scroll: 'swim' };
    }
    // Заплыв закрыт целиком — минимум Вело День 1 уже идёт. Пока не
    // наступило (по расписанию/факту) ни Вело День 2, ни Бег — остаёмся
    // на едином табе "Вело" (там и живут оба дня), не убегая вперёд.
    if (!bike2HasStarted() || !runHasStarted()) return { live: ['bike'], scroll: 'bike' };
    if (stageIsPending('run')) return { live: ['run'], scroll: 'run' };
    return { live: ['overall'], scroll: 'overall' }; // гонка полностью завершена
}
// Только цель скролла — сохранён отдельной функцией (не только полем
// объекта) ради обратной совместимости вызовов/тестов.
function computeAutoScrollTab() {
    return computeAutoScrollState().scroll;
}

let _lastAutoScrollTab = null;
function autoScrollTabs() {
    const state = computeAutoScrollState();
    // Визуальный акцент (.tab-live, пульсирующая точка) — обновляется на
    // КАЖДОМ рендере независимо от скролла ниже: на десктопе табы обычно
    // и так все видны (нечего скроллить), точка — единственный сигнал,
    // где сейчас гонка (2026-08-04). Может гореть на НЕСКОЛЬКИХ табах
    // одновременно (Плавание+Вело в момент первого финиша заплыва).
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('tab-live', state.live.includes(t.dataset.tab)));
    if (!state.scroll || state.scroll === _lastAutoScrollTab) return;
    _lastAutoScrollTab = state.scroll;
    const el = document.querySelector(`#tabs [data-tab="${state.scroll}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* ──────────────── Main render ──────────────── */
// Есть ли хоть один участник с расчётным стартом вело-2 (bike2_start_s
// пишется сервером ТОЛЬКО тем, кто реально ФИНИШИРОВАЛ вело-1, см.
// convert_bike_times_to_elapsed/_finished_stage в service.py) — таб
// "День 2: Стартовый лист" не должен быть доступен в навигации, пока
// список пуст (найдено пользователем 2026-08-04: до фикса таб был кликабелен
// и показывал (иногда пустой, иногда преждевременный) список ещё до того,
// как хоть кто-то финишировал вело-1).
function startlistHasRiders() {
    if (!_data) return false;
    if (_data.individual.some(r => r.bike2_start_s != null)) return true;
    return _data.relay.some(t => t.members.some(m => m.relay_stage === 'bike' && m.bike2_start_s != null));
}
function render() {
    if (!_data) return;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.querySelector('#tabs [data-tab="startlist"]').style.display = startlistHasRiders() ? '' : 'none';
    // Скрыть фильтр пола при выборе Эстафеты
    const genderGroup = document.getElementById('genderGroup');
    const genderLabel = document.getElementById('genderLabel');
    // Фильтр по полу скрыт при "Эстафета" на командных вкладках (Итоги/Дни —
    // у команды нет личного пола на этом уровне), но виден на
    // персонифицированных (этапы + Свод вело — там уже настоящий личный пол
    // конкретного эстафетчика, задача 2026-07-22 п.8). "bike" покрывает и
    // Свод, и Вело1/Вело2 (оба сабтаба). График/Старт вело-2 — вне скопа,
    // фильтр там остаётся скрытым при эстафете как раньше.
    const hideGender = _fmt === 'relay' && !PERSONIFIED_TABS.includes(_tab);
    genderGroup.style.display = hideGender ? 'none' : '';
    genderLabel.style.display = hideGender ? 'none' : '';
    // Стартовый лист вело-2 не фильтруется по формату/полу пользователем —
    // список и так показывает всех стартующих в порядке старта (п.8 v6,
    // 2026-08-02): фильтры на этой вкладке только путают, скрываем целиком.
    document.getElementById('mainFiltersBar').style.display = _tab === 'startlist' ? 'none' : '';
    document.getElementById('bikeSubTabs').style.display = _tab === 'bike' ? '' : 'none';
    if (_tab === 'overall') renderOverall();
    else if (_tab === 'startlist') renderStartlist();
    else if (_tab === 'day1') renderDay1();
    else if (_tab === 'day2') renderDay2();
    else if (_tab === 'bike') {
        if (_bikeSubTab === 'combined') renderBikeCombined();
        else renderStage(_bikeSubTab);
    }
    else if (_tab === 'chart') {
        if (_chartSubTab === 'pace') renderPaceChart();
        else renderPositionChart();
    }
    else renderStage(_tab);
    autoScrollTabs();
    syncUrlFromState();
}

/* ──────────────── Состояние в URL (сохранение таба/фильтров при
   обновлении страницы) ──────────────── */
// Раньше _tab/_bikeSubTab/_chartSubTab/_fmt/_gender жили только в
// JS-переменных — обновление страницы (F5) сбрасывало их к дефолтам,
// пользователь "перекидывался" на "Итоги гонки" со снятыми фильтрами
// (2026-08-03, п.4 v7). Пишем текущее состояние в query-параметры при
// каждом render() (history.replaceState — НЕ pushState, иначе кнопка
// "назад" браузера шагала бы по каждому клику фильтра, а не по
// осмысленным переходам) и читаем обратно при загрузке страницы.
function syncUrlFromState() {
    const params = new URLSearchParams();
    params.set('tab', _tab);
    if (_tab === 'bike') params.set('bikeSubTab', _bikeSubTab);
    if (_tab === 'chart') params.set('chartSubTab', _chartSubTab);
    if (_fmt !== 'all') params.set('fmt', _fmt);
    if (_gender !== 'all') params.set('gender', _gender);
    const qs = params.toString();
    const newUrl = qs ? `${location.pathname}?${qs}` : location.pathname;
    if (newUrl !== location.pathname + location.search) history.replaceState(null, '', newUrl);
}
function readStateFromUrl() {
    const params = new URLSearchParams(location.search);
    const pick = (key, allowed, current) => {
        const v = params.get(key);
        return v && allowed.includes(v) ? v : current;
    };
    _tab = pick('tab', ['overall', 'swim', 'bike', 'run', 'day1', 'day2', 'chart', 'startlist'], _tab);
    _bikeSubTab = pick('bikeSubTab', ['combined', 'bike1', 'bike2'], _bikeSubTab);
    _chartSubTab = pick('chartSubTab', ['position', 'pace'], _chartSubTab);
    _fmt = pick('fmt', ['all', 'individual', 'relay'], _fmt);
    _gender = pick('gender', ['all', 'M', 'F'], _gender);
    // Тот же инвариант, что и в click-обработчике фильтра формата — у
    // эстафеты нет личного пола на командных вкладках, "Пол" должен
    // остаться "Все" (защита от вручную собранного/устаревшего URL).
    if (_fmt === 'relay') _gender = 'all';
}
// #tabs/#bikeSubTabs/фильтры формата и пола — статичная разметка в HTML
// (не перерисовываются render()-ом), поэтому класс "active" нужно
// проставить вручную под восстановленное из URL состояние ДО первого
// render() — иначе кнопки визуально не совпадут с реально открытым табом.
function syncStaticButtonClasses() {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === _tab));
    document.querySelectorAll('#bikeSubTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.biketab === _bikeSubTab));
    document.querySelectorAll('[data-fmt]').forEach(b => b.classList.toggle('active', b.dataset.fmt === _fmt));
    document.querySelectorAll('[data-gender]').forEach(b => b.classList.toggle('active', b.dataset.gender === _gender));
}

/* ──────────────── Data loading ──────────────── */
// Год больше не выбирается вручную (year-select убран, 2026-08-04) —
// первая загрузка не передаёт year вовсе, сервер сам берёт год, явно
// помеченный ПУБЛИЧНЫМ в админке (get_public_race_year) — НЕ обязательно
// последний загруженный (2026-08-05, см. set_public_race_year).
// _year фиксируется из ответа (data.race_year) и используется дальше для
// поллинга/ссылок на карточки участников — сессия не "переключит" год сама
// по себе, даже если админ загрузит новый, пока страница открыта.
async function loadResults() {
    document.getElementById('loading').style.display = '';
    document.getElementById('app').style.display = 'none';
    try {
        const resp = await fetch('/api/siberman/results');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const raw = await resp.text();
        _lastDataJson = raw;
        _data = JSON.parse(raw);
        _year = _data.race_year;
        _raceStartEpoch = _data.race_start ? new Date(_data.race_start).getTime() : null;
        _bike2StartEpoch = _data.bike2_start ? new Date(_data.bike2_start).getTime() : null;
        _runStartEpoch = _data.run_start ? new Date(_data.run_start).getTime() : null;
        _recordsIndex = buildRecordsIndex(_data.records);
        render();
        renderStageTimers();
    } catch(e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
    }
}

// Сравнение с последним загруженным телом ответа — перерисовываем
// (и пересоздаём Chart.js) ТОЛЬКО когда данные реально изменились, а не
// на каждый тик поллинга (п.1 2026-07-22, найдено пользователем как
// "дёрганье" графика).
function dataChanged(rawBody) {
    return rawBody !== _lastDataJson;
}
// Медленный поллинг (обновляет данные + состав активных секундомеров,
// без сетевого запроса на каждый тик) — на странице раньше не было вообще
// никакого автообновления, вся загрузка была одноразовой при открытии.
async function refreshData() {
    if (!_data) return;
    try {
        const resp = await fetch(`/api/siberman/results?year=${_year}`);
        if (!resp.ok) return;
        const raw = await resp.text();
        if (!dataChanged(raw)) return;
        _lastDataJson = raw;
        _data = JSON.parse(raw);
        _raceStartEpoch = _data.race_start ? new Date(_data.race_start).getTime() : null;
        _bike2StartEpoch = _data.bike2_start ? new Date(_data.bike2_start).getTime() : null;
        _runStartEpoch = _data.run_start ? new Date(_data.run_start).getTime() : null;
        _recordsIndex = buildRecordsIndex(_data.records);
        render();
        renderStageTimers();
    } catch(e) { /* сеть моргнула — подождём следующего цикла поллинга */ }
}
setInterval(refreshData, 20000);
setInterval(tickStageTimers, 1000);

/* ──────────────── Event listeners ──────────────── */
document.querySelectorAll('#tabs .tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _tab = t.dataset.tab;
        render();
    });
});

document.querySelectorAll('#bikeSubTabs .tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('#bikeSubTabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _bikeSubTab = t.dataset.biketab;
        render();
    });
});

document.querySelectorAll('[data-fmt]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-fmt]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _fmt = btn.dataset.fmt;
        if (_fmt === 'relay') {
            document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
            document.querySelector('[data-gender="all"]').classList.add('active');
            _gender = 'all';
        }
        render();
    });
});

document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _gender = btn.dataset.gender;
        render();
    });
});

readStateFromUrl();
syncStaticButtonClasses();
loadResults();
</script>
</body>
</html>
