<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siberman Ultra Triathlon — Результаты 2025</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Brand tokens ── */
        :root {
            --navy:   #003D62;
            --red:    #BE0A21;
            --blue:   #6AABD7;
            --white:  #FFFFFF;
            --radius: 8px;
        }

        /* ── Dark theme (default) ── */
        [data-theme="dark"] {
            --bg:       #071622;
            --bg2:      #0c2035;
            --bg3:      #112840;
            --border:   rgba(106,171,215,.18);
            --text:     #e4eef6;
            --muted:    #7aaabf;
            --accent:   var(--blue);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--blue);
            --logo-main:#FFFFFF;
            --logo-sub: var(--blue);
            --header-bg:var(--bg2);
            --dnf-op:   .45;
            --stat-val: var(--blue);
        }

        /* ── Light theme ── */
        [data-theme="light"] {
            --bg:       #f0f5f9;
            --bg2:      #FFFFFF;
            --bg3:      #e4eef6;
            --border:   #b8d5e8;
            --text:     var(--navy);
            --muted:    #4f7f9b;
            --accent:   var(--navy);
            --accent2:  var(--red);
            --tab-act:  var(--bg);
            --rank-col: var(--navy);
            --logo-main:var(--navy);
            --logo-sub: var(--red);
            --header-bg:var(--white);
            --dnf-op:   .4;
            --stat-val: var(--red);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            transition: background .2s, color .2s;
        }

        /* ── Header ── */
        .header {
            background: var(--header-bg);
            border-bottom: 3px solid var(--red);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-block { display: flex; flex-direction: column; gap: 1px; }
        .logo-name {
            font-size: 22px; font-weight: 900; letter-spacing: 3px;
            text-transform: uppercase; color: var(--logo-main);
            line-height: 1;
        }
        .logo-name .m { color: var(--red); }
        .logo-tagline {
            font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
            text-transform: uppercase; color: var(--logo-sub);
        }
        .logo-dist {
            font-size: 9px; font-weight: 600; letter-spacing: 1.5px;
            color: var(--muted); margin-top: 1px;
        }
        .header-spacer { flex: 1; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .year-select {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); padding: 6px 10px; border-radius: var(--radius);
            font-size: 13px; cursor: pointer;
        }
        .theme-btn {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); width: 34px; height: 34px; border-radius: var(--radius);
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .theme-btn:hover { background: var(--border); }

        /* ── Tabs ── */
        .tabs-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 18px;
            font-size: 13px; font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: color .15s, border-color .15s;
            text-transform: uppercase;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }
        .tab .tab-dist { font-size: 10px; font-weight: 400; opacity: .7; margin-left: 4px; }

        /* ── Filters ── */
        .filters {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
        }
        .filter-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
        .filter-group { display: flex; gap: 4px; }
        .filter-btn {
            padding: 4px 12px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }
        .filter-btn:hover { color: var(--text); border-color: var(--text); }
        .filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

        /* ── Content ── */
        .content { padding: 16px 20px 48px; }

        /* ── Stats ── */
        .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px 16px;
        }
        .stat-val { font-size: 20px; font-weight: 800; color: var(--stat-val); }
        .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }

        /* ── Table ── */
        .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--bg2); }
        thead th {
            padding: 9px 10px; text-align: left;
            font-size: 10px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .6px; font-weight: 700;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            white-space: nowrap;
        }
        thead th.r { text-align: right; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--bg3); }
        tbody tr.dnf { opacity: var(--dnf-op); }
        td { padding: 9px 10px; white-space: nowrap; }
        td.r { text-align: right; font-variant-numeric: tabular-nums; }

        /* Top-3 highlight */
        tbody tr.rank-1 { background: rgba(190,10,33,.07); }
        tbody tr.rank-2 { background: rgba(106,171,215,.06); }
        tbody tr.rank-3 { background: rgba(106,171,215,.04); }
        tbody tr.rank-1:hover, tbody tr.rank-2:hover, tbody tr.rank-3:hover { background: var(--bg3); }

        .rank-num { font-size: 13px; font-weight: 800; color: var(--rank-col); }
        .rank-1 .rank-num { color: var(--red); }
        .rank-sub { font-size: 10px; color: var(--muted); display: block; }
        .bib-cell { font-weight: 700; color: var(--muted); font-size: 12px; }
        .name-main { font-weight: 600; }
        .name-city { font-size: 11px; color: var(--muted); }
        .badge {
            display: inline-block; padding: 1px 7px; border-radius: 10px;
            font-size: 10px; font-weight: 700; letter-spacing: .3px;
        }
        .badge-m { background: rgba(0,61,98,.15); color: var(--navy); }
        [data-theme="dark"] .badge-m { background: rgba(106,171,215,.15); color: var(--blue); }
        .badge-f { background: rgba(190,10,33,.1); color: var(--red); }
        .badge-dnf  { background: rgba(190,10,33,.12);   color: var(--red); }
        .badge-dns  { background: rgba(120,120,130,.12); color: var(--muted); }
        .badge-dsq  { background: rgba(130,80,200,.12);  color: #a78bfa; }
        .badge-fin  { background: rgba(34,197,94,.12);   color: #22c55e; }
        .badge-live { background: rgba(106,171,215,.15); color: var(--blue); }
        .time-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
        .muted { color: var(--muted); }

        /* Stage icon dots in overall table */
        .stage-icon { font-size: 10px; color: var(--muted); white-space: nowrap; }

        /* ── Section header ── */
        .section-hdr {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
            color: var(--muted); padding: 20px 0 8px;
            border-bottom: 1px solid var(--border); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-hdr::after { content: ''; flex: 1; height: 1px; background: var(--border); display: block; }

        /* ── Relay cards ── */
        .relay-grid { display: flex; flex-direction: column; gap: 8px; }
        .relay-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        .relay-card-hdr {
            padding: 10px 14px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border); background: var(--bg3);
        }
        .relay-pos { font-size: 14px; font-weight: 800; color: var(--red); min-width: 24px; }
        .relay-bib { font-size: 12px; font-weight: 700; color: var(--muted); }
        .relay-name { font-weight: 700; font-size: 14px; flex: 1; }
        .relay-total { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
        .relay-members { display: table; width: 100%; }
        .relay-member { display: table-row; }
        .relay-member > span {
            display: table-cell; padding: 7px 14px;
            border-bottom: 1px solid var(--border); vertical-align: middle;
        }
        .relay-member:last-child > span { border-bottom: none; }
        .relay-stage-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--blue); width: 70px; }
        .relay-member-name { font-size: 13px; font-weight: 500; }
        .relay-member-time { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
        .relay-member-meta { font-size: 11px; color: var(--muted); text-align: right; width: 100px; }

        /* ── Empty / loading ── */
        .empty, .loading {
            padding: 60px 20px; text-align: center;
            color: var(--muted); font-size: 15px;
        }
        .loading::before { content: ''; display: block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            .header { padding: 10px 14px; }
            .logo-name { font-size: 18px; }
            .tabs-bar { padding: 0 14px; }
            .tab { padding: 10px 12px; font-size: 12px; }
            .filters { padding: 8px 14px; }
            .content { padding: 12px 14px 32px; }
            td, thead th { padding: 7px 7px; font-size: 12px; }
            .relay-card-hdr { padding: 8px 10px; }
            .relay-member > span { padding: 6px 10px; }
        }
    </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
    <div class="logo-block">
        <div class="logo-name">SIBER<span class="m">M</span>AN</div>
        <div class="logo-tagline">Ultra Triathlon</div>
        <div class="logo-dist">10 KM SWIM · 421 KM BIKE · 84 KM RUN</div>
    </div>
    <div class="header-spacer"></div>
    <div class="header-controls">
        <select class="year-select" id="yearSelect" onchange="loadYear(this.value)">
            <option value="2025">2025</option>
        </select>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </div>
</div>

<!-- ── Tabs ── -->
<div class="tabs-bar" id="tabs">
    <div class="tab active" data-tab="overall">Финал</div>
    <div class="tab" data-tab="swim">Плавание <span class="tab-dist">10 км</span></div>
    <div class="tab" data-tab="bike1">Вело День 1 <span class="tab-dist">145 км</span></div>
    <div class="tab" data-tab="bike2">Вело День 2 <span class="tab-dist">276 км</span></div>
    <div class="tab" data-tab="run">Бег <span class="tab-dist">84 км</span></div>
    <div class="tab" data-tab="startlist">Старт Вело-2</div>
</div>

<!-- ── Filters ── -->
<div class="filters">
    <span class="filter-label">Формат:</span>
    <div class="filter-group" id="fmtGroup">
        <button class="filter-btn active" data-fmt="all">Все</button>
        <button class="filter-btn" data-fmt="individual">Личный</button>
        <button class="filter-btn" data-fmt="relay">Эстафета</button>
    </div>
    <span class="filter-label" id="genderLabel">Пол:</span>
    <div class="filter-group" id="genderGroup">
        <button class="filter-btn active" data-gender="all">Все</button>
        <button class="filter-btn" data-gender="M">Мужчины</button>
        <button class="filter-btn" data-gender="F">Женщины</button>
    </div>
</div>

<!-- ── Content ── -->
<div class="content">
    <div class="loading" id="loading"></div>
    <div id="app" style="display:none"></div>
</div>

<script>
/* ──────────────── State ──────────────── */
let _data = null;
let _tab = 'overall';
let _fmt = 'all';
let _gender = 'all';

/* ──────────────── Theme ──────────────── */
(function initTheme() {
    const saved = localStorage.getItem('siberman-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
})();

function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('siberman-theme', next);
}

/* ──────────────── Formatters ──────────────── */
function fmtTime(s) {
    if (s == null) return '—';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtPace(s) {
    if (s == null) return '—';
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} /км`;
}
function fmtPace100m(secPerKm) {
    if (secPerKm == null) return '—';
    const s = Math.round(secPerKm / 10);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} /100м`;
}
const STATUS_ORDER = { active: 0, dnf: 1, dsq: 2, dns: 3 };
function sortByStatus(rows, timeKey) {
    return [...rows].sort((a, b) => {
        const sa = STATUS_ORDER[a.status] ?? 4, sb = STATUS_ORDER[b.status] ?? 4;
        if (sa !== sb) return sa - sb;
        if (a.status !== 'active') return 0;
        const ta = a[timeKey], tb = b[timeKey];
        if (ta == null && tb == null) return 0;
        if (ta == null) return 1;
        if (tb == null) return -1;
        return ta - tb;
    });
}
function fmtSpeed(v) {
    if (v == null) return '—';
    return `${Number(v).toFixed(1)} км/ч`;
}
function genderBadge(g) {
    if (g === 'M') return '<span class="badge badge-m">М</span>';
    if (g === 'F') return '<span class="badge badge-f">Ж</span>';
    return '';
}
/* stageKey: null = Финал, иначе 'swim'|'bike1'|'bike2'|'run' */
const STAGE_ORD = { swim: 0, bike1: 1, bike2: 2, run: 3 };
function getDnfStage(r) {
    // Этап, на котором произошёл DNF = первый этап без финишного времени
    if (r.swim_s  == null) return 'swim';
    if (r.bike1_s == null) return 'bike1';
    if (r.bike2_s == null) return 'bike2';
    return 'run';
}
function statusBadge(r, stageKey) {
    const s = r.status;
    if (s === 'dns') return '<span class="badge badge-dns">Не стартовал</span>';
    if (s === 'dsq') return '<span class="badge badge-dsq">DSQ</span>';
    if (s === 'dnf') {
        if (stageKey === null) return '<span class="badge badge-dnf">DNF</span>'; // Финал
        const dnfStage = getDnfStage(r);
        const diff = STAGE_ORD[stageKey] - STAGE_ORD[dnfStage];
        if (diff < 0)  return '<span class="badge badge-fin">Финишировал</span>';
        if (diff === 0) return '<span class="badge badge-dnf">DNF</span>';
        return '<span class="badge badge-dns">Не стартовал</span>';
    }
    // active
    const hasTime = stageKey ? r[stageKey + '_s'] != null : r.overall_s != null;
    return hasTime
        ? '<span class="badge badge-fin">Финишировал</span>'
        : '<span class="badge badge-live">В гонке</span>';
}
function relayMemberStatusBadge(m) {
    if (m.status === 'dnf') return '<span class="badge badge-dnf">DNF</span>';
    if (m.status === 'dns') return '<span class="badge badge-dns">Не стартовал</span>';
    if (m.status === 'dsq') return '<span class="badge badge-dsq">DSQ</span>';
    return '<span class="badge badge-fin">Финишировал</span>';
}
function buildStats(individual, relay, stageKey) {
    const finInd = individual.filter(r => r.status === 'active' && (stageKey ? r[stageKey+'_s'] != null : r.overall_s != null)).length;
    const finRel = relay.filter(t => t.overall_s != null).length;
    const finished = finInd + finRel;
    const live     = individual.filter(r => r.status === 'active' && (stageKey ? r[stageKey+'_s'] == null : r.overall_s == null)).length;
    const dnfCount = individual.filter(r => r.status === 'dnf').length;
    const dsqCount = individual.filter(r => r.status === 'dsq').length;
    const dnsCount = individual.filter(r => r.status === 'dns').length;
    const total = individual.length + relay.length;
    const relayOnly = individual.length === 0 && relay.length > 0;
    let html = `<div class="stats">`;
    if (relayOnly) {
        html += `<div class="stat"><div class="stat-val">${relay.length}</div><div class="stat-lbl">Команд</div></div>`;
        html += `<div class="stat"><div class="stat-val">${finished}</div><div class="stat-lbl">Финишировали</div></div>`;
    } else {
        html += `<div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Участников</div></div>`;
        html += `<div class="stat"><div class="stat-val">${finished}</div><div class="stat-lbl">Финишировали</div></div>`;
        if (relay.length > 0 && stageKey === null) html += `<div class="stat"><div class="stat-val">${relay.length}</div><div class="stat-lbl">Эстафет</div></div>`;
    }
    if (live > 0)     html += `<div class="stat"><div class="stat-val">${live}</div><div class="stat-lbl">В гонке</div></div>`;
    if (dnfCount > 0) html += `<div class="stat" style="border-color:rgba(190,10,33,.3)"><div class="stat-val" style="color:var(--red)">${dnfCount}</div><div class="stat-lbl">DNF</div></div>`;
    if (dsqCount > 0) html += `<div class="stat"><div class="stat-val" style="color:#a78bfa">${dsqCount}</div><div class="stat-lbl">DSQ</div></div>`;
    if (dnsCount > 0) html += `<div class="stat"><div class="stat-val">${dnsCount}</div><div class="stat-lbl">Не стартовали</div></div>`;
    html += `</div>`;
    return html;
}
function rankClass(rank) {
    if (rank === 1) return 'rank-1';
    if (rank === 2) return 'rank-2';
    if (rank === 3) return 'rank-3';
    return '';
}

/* ──────────────── Filter helpers ──────────────── */
function getFiltered() {
    if (!_data) return { individual: [], relay: [] };
    let ind = _data.individual;
    if (_fmt === 'relay') ind = [];
    else if (_gender !== 'all') ind = ind.filter(r => r.gender === _gender);
    const rel = _fmt === 'individual' ? [] : _data.relay;
    return { individual: ind, relay: rel };
}

/* ──────────────── Gap (отставание от лидера) ──────────────── */
const STAGE_MAX_SEQ = { swim: 7, bike_day1: 6, bike_day2: 8, run: 12 };
const STAGE_ORDER = ['swim', 'bike_day1', 'bike_day2', 'run'];
const TAB_TO_DB_STAGE = { swim: 'swim', bike1: 'bike_day1', bike2: 'bike_day2', run: 'run' };

function lastReached(cp, stage) {
    // {seq, value} последней непустой КТ этапа для участника, либо null
    if (!cp || !cp[stage]) return null;
    for (let seq = STAGE_MAX_SEQ[stage]; seq >= 1; seq--) {
        const v = cp[stage][seq];
        if (v != null) return { seq, value: v };
    }
    return null;
}

function valueAtOrBefore(cp, stage, seq) {
    if (!cp || !cp[stage]) return null;
    for (let s = seq; s >= 1; s--) {
        const v = cp[stage][s];
        if (v != null) return v;
    }
    return null;
}

function fmtGap(gapS) {
    if (gapS == null || gapS <= 0) return '';
    const h = Math.floor(gapS / 3600), m = Math.floor((gapS % 3600) / 60), s = gapS % 60;
    return h > 0
        ? `+${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `+${m}:${String(s).padStart(2,'0')}`;
}

// rows: [{key, cp, status?}] — вычисляет {key: gap_s} относительно лидера
// пула (rows уже должны быть отфильтрованы по нужному разрезу: формат/пол/
// роль). Лидером может быть только тот, кто реально ДОШЁЛ до последней КТ
// этапа (pos.seq === maxSeq) — иначе сошедший на середине (без явной пометки
// DNF в файле — status всё ещё 'active') всегда "выигрывал" бы по наименьшему
// сырому времени, хотя прошёл меньше дистанции. Статус тоже проверяем — чтобы
// явно дисквалифицированный/DNF не мог стать лидером, даже дойдя до финиша.
// Gap при этом считается для всех, включая недошедших — от той же КТ,
// которую они последней прошли.
function computeStageGaps(rows, dbStage) {
    const maxSeq = STAGE_MAX_SEQ[dbStage];
    const withPos = rows
        .map(r => ({ key: r.key, cp: r.cp, status: r.status ?? 'active', pos: lastReached(r.cp, dbStage) }))
        .filter(r => r.pos);
    if (withPos.length === 0) return {};
    const candidates = withPos.filter(r => r.status === 'active' && r.pos.seq === maxSeq);
    if (candidates.length === 0) return {};
    const leader = candidates.reduce((a, b) => (a.pos.value <= b.pos.value ? a : b));
    const gaps = {};
    withPos.forEach(r => {
        if (r.key === leader.key) { gaps[r.key] = 0; return; }
        const leaderVal = valueAtOrBefore(leader.cp, dbStage, r.pos.seq);
        if (leaderVal != null) gaps[r.key] = r.pos.value - leaderVal;
    });
    return gaps;
}

// rows: [{key, cp, swim_s, bike1_s, bike2_s, run_s}] — то же самое, но в
// "глобальном" времени гонки (не в рамках одного этапа). Глобальное время
// на конкретной (stage, seq) = сумма ПОЛНЫХ итогов уже пройденных этапов
// + значение cp[stage][seq] (для swim/bike_day1 оно уже elapsed от старта
// гонки, для bike_day2/run — elapsed от старта СВОЕГО этапа, поэтому и
// нужно прибавлять итоги предыдущих этапов).
function globalProgress(row, stage, seq) {
    const v = row.cp?.[stage]?.[seq];
    if (v == null) return null;
    if (stage === 'swim' || stage === 'bike_day1') return v;
    if (stage === 'bike_day2') return (row.swim_s ?? 0) + (row.bike1_s ?? 0) + v;
    return (row.swim_s ?? 0) + (row.bike1_s ?? 0) + (row.bike2_s ?? 0) + v; // run
}

function currentStage(row) {
    // Последний этап (в порядке гонки), по которому есть хоть какие-то данные
    for (let i = STAGE_ORDER.length - 1; i >= 0; i--) {
        if (lastReached(row.cp, STAGE_ORDER[i])) return STAGE_ORDER[i];
    }
    return null;
}

function computeOverallGaps(rows) {
    const withPos = rows.map(r => {
        const stage = currentStage(r);
        if (!stage) return null;
        const pos = lastReached(r.cp, stage);
        const value = globalProgress(r, stage, pos.seq);
        return value == null ? null : { key: r.key, cp: r.cp, row: r, status: r.status ?? 'active', stage, seq: pos.seq, value };
    }).filter(Boolean);
    if (withPos.length === 0) return {};
    // Лидер — только среди тех, кто реально финишировал ВСЮ гонку (дошёл до
    // последней КТ бега), тот же резон, что и в computeStageGaps: иначе
    // сошедший рано (без явной пометки DNF) "выигрывал" бы по наименьшему
    // сырому времени.
    const candidates = withPos.filter(r => r.status === 'active' && r.stage === 'run' && r.seq === STAGE_MAX_SEQ.run);
    if (candidates.length === 0) return {};
    const leader = candidates.reduce((a, b) => (a.value <= b.value ? a : b));
    const gaps = {};
    withPos.forEach(r => {
        if (r.key === leader.key) { gaps[r.key] = 0; return; }
        const leaderValAtStage = globalProgress(leader.row, r.stage, r.seq);
        if (leaderValAtStage != null) gaps[r.key] = r.value - leaderValAtStage;
    });
    return gaps;
}

// Собрать "виртуального участника" эстафетной команды для computeOverallGaps —
// swim/bike/run у неё разбросаны по трём разным членам команды.
function teamGapRow(team) {
    const bySwim = team.members.find(m => m.relay_stage === 'swim');
    const byBike = team.members.find(m => m.relay_stage === 'bike');
    const byRun  = team.members.find(m => m.relay_stage === 'run');
    return {
        key: team.bib,
        cp: {
            swim: bySwim?.cp?.swim,
            bike_day1: byBike?.cp?.bike_day1,
            bike_day2: byBike?.cp?.bike_day2,
            run: byRun?.cp?.run,
        },
        swim_s: bySwim?.swim_s, bike1_s: byBike?.bike1_s,
        bike2_s: byBike?.bike2_s, run_s: byRun?.run_s,
        // Команда считается активной, пока хотя бы её текущий "рабочий" член
        // не сошёл — упрощение: DNF любого члена трактуем как DNF команды.
        status: team.members.some(m => m.status === 'dnf') ? 'dnf' : 'active',
    };
}

/* ──────────────── Render: Overall ──────────────── */
function renderOverall() {
    const filtered = getFiltered();
    const individual = filtered.individual;
    // Эстафетная команда не имеет единого пола — при выбранном фильтре
    // пола команды в Финале не показываем вовсе (не "какого-то одного пола").
    const relay = _gender === 'all' ? filtered.relay : [];
    const overallGaps = computeOverallGaps([
        ...individual.map(r => ({ key: r.bib, cp: r.cp, status: r.status, swim_s: r.swim_s, bike1_s: r.bike1_s, bike2_s: r.bike2_s, run_s: r.run_s })),
        ...relay.map(teamGapRow),
    ]);
    let html = '';

    html += buildStats(individual, relay, null);

    // Individual table
    if (_fmt !== 'relay' && individual.length > 0) {
        html += `<div class="table-wrap"><table>
        <thead><tr>
            <th>Место</th><th>№</th><th>Участник</th><th>Пол</th>
            <th class="r">🏊 Плав.</th>
            <th class="r">🚴 Вело 1</th>
            <th class="r">🚴 Вело 2</th>
            <th class="r">🏃 Бег</th>
            <th class="r">Итого</th>
            <th class="r">Отставание</th>
            <th>Статус</th>
        </tr></thead><tbody>`;
        const mainOverallRank = _gender === 'all' ? 'rank_overall' : 'rank_gender';
        sortByStatus(individual, 'overall_s').forEach(r => {
            const notFinished = r.overall_s == null || r.status !== 'active';
            const rc = notFinished ? '' : rankClass(r[mainOverallRank]);
            html += `<tr class="${rc}${notFinished ? ' dnf' : ''}">
                <td>
                    <span class="rank-num">${r[mainOverallRank] ?? '—'}</span>
                    ${_gender === 'all' && r.rank_gender != null ? `<span class="rank-sub">${genderBadge(r.gender)}${r.rank_gender}</span>` : ''}
                </td>
                <td class="bib-cell">${r.bib}</td>
                <td>
                    <span class="name-main">${r.surname} ${r.name}</span>
                    ${r.city ? `<br><span class="name-city">${r.city}</span>` : ''}
                </td>
                <td>${genderBadge(r.gender)}</td>
                <td class="r time-cell muted">${fmtTime(r.swim_s)}</td>
                <td class="r time-cell muted">${fmtTime(r.bike1_s)}</td>
                <td class="r time-cell muted">${fmtTime(r.bike2_s)}</td>
                <td class="r time-cell muted">${fmtTime(r.run_s)}</td>
                <td class="r time-cell" style="font-weight:800">${fmtTime(r.overall_s)}</td>
                <td class="r muted">${fmtGap(overallGaps[r.bib])}</td>
                <td>${statusBadge(r, null)}</td>
            </tr>`;
        });
        html += '</tbody></table></div>';
    }

    // Relay cards
    if (_fmt !== 'individual' && relay.length > 0) {
        if (_fmt !== 'relay') html += `<div class="section-hdr">Эстафетные команды</div>`;
        const STAGE_LABELS = { swim: 'Плавание', bike: 'Велосипед', run: 'Бег' };
        html += '<div class="relay-grid">';
        relay.forEach((team, idx) => {
            html += `<div class="relay-card">
                <div class="relay-card-hdr">
                    <span class="relay-pos">${idx + 1}</span>
                    <span class="relay-bib">${team.bib}</span>
                    <span class="relay-name">${team.team_name}</span>
                    <span class="relay-total">${fmtTime(team.overall_s)}${overallGaps[team.bib] ? ` <span class="muted" style="font-size:.85em">${fmtGap(overallGaps[team.bib])}</span>` : ''}</span>
                </div>
                <div class="relay-members">`;
            team.members.forEach(m => {
                const stageTime = m.relay_stage === 'swim' ? m.swim_s
                    : m.relay_stage === 'bike' ? (m.bike1_s != null && m.bike2_s != null ? m.bike1_s + m.bike2_s
                        : m.bike2_s ?? m.bike1_s)
                    : m.run_s;
                const stageMeta = m.relay_stage === 'swim' ? fmtPace100m(m.swim_pace)
                    : m.relay_stage === 'bike' ? fmtSpeed(m.bike2_speed ?? m.bike1_speed)
                    : fmtPace(m.run_pace);
                html += `<div class="relay-member">
                    <span class="relay-stage-lbl">${STAGE_LABELS[m.relay_stage] ?? m.relay_stage}</span>
                    <span class="relay-member-name">${m.surname} ${m.name} ${genderBadge(m.gender)}</span>
                    <span class="relay-member-time">${fmtTime(stageTime)}</span>
                    <span class="relay-member-meta">${stageMeta}</span>
                    <span style="margin-left:8px">${relayMemberStatusBadge(m)}</span>
                </div>`;
            });
            html += `</div></div>`;
        });
        html += '</div>';
    }

    if (individual.length === 0 && relay.length === 0)
        html += '<div class="empty">Нет данных для выбранного фильтра</div>';

    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Stage ──────────────── */
const STAGE_CFG = {
    swim:  { timeKey: 'swim_s',  rankKey: 'swim_rank',  rankGKey: 'swim_rank_g',  metaKey: 'swim_pace',   metaFn: fmtPace100m, metaLbl: 'Темп',     relayStage: 'swim' },
    bike1: { timeKey: 'bike1_s', rankKey: 'bike1_rank', rankGKey: 'bike1_rank_g', metaKey: 'bike1_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    bike2: { timeKey: 'bike2_s', rankKey: 'bike2_rank', rankGKey: 'bike2_rank_g', metaKey: 'bike2_speed', metaFn: fmtSpeed,    metaLbl: 'Скорость', relayStage: 'bike' },
    run:   { timeKey: 'run_s',   rankKey: 'run_rank',   rankGKey: 'run_rank_g',   metaKey: 'run_pace',    metaFn: fmtPace,     metaLbl: 'Темп',     relayStage: 'run'  },
};

function renderStage(stage) {
    const cfg = STAGE_CFG[stage];
    const { individual, relay } = getFiltered();

    const rows = sortByStatus(individual, cfg.timeKey);
    let relayMembers = _fmt !== 'individual'
        ? relay.flatMap(t => t.members
            .filter(m => m.relay_stage === cfg.relayStage && (_gender === 'all' || m.gender === _gender))
            .map(m => ({...m, _bib: t.bib, _team: t.team_name})))
        : [];
    // Сортировать эстафеты по времени этапа
    relayMembers = relayMembers.sort((a, b) => {
        const ta = a[cfg.timeKey], tb = b[cfg.timeKey];
        if (ta == null && tb == null) return 0;
        if (ta == null) return 1;
        if (tb == null) return -1;
        return ta - tb;
    });

    if (rows.length === 0 && relayMembers.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Нет данных</div>';
        return;
    }

    // Отставание — общий пул личников этой роли + эстафетчиков той же роли,
    // т.к. они соревнуются на этапе вместе (как и старт вело-2 в задаче 2).
    const gapPool = [
        ...rows.map(r => ({ key: r.bib, cp: r.cp, status: r.status })),
        ...relayMembers.map(m => ({ key: `${m._bib}:${m.relay_stage}`, cp: m.cp, status: m.status })),
    ];
    const gaps = computeStageGaps(gapPool, TAB_TO_DB_STAGE[stage]);

    const showStart = stage === 'bike2';
    const colCount = showStart ? 9 : 8;

    let html = buildStats(individual, relay, stage);
    html += `<div class="table-wrap"><table>
    <thead><tr>
        <th>Место</th><th>№</th><th>Участник</th><th>Пол</th>
        <th class="r">Время</th><th class="r">Отставание</th><th class="r">${cfg.metaLbl}</th>
        ${showStart ? '<th class="r">Старт вело-2</th>' : ''}
        <th>Статус</th>
    </tr></thead><tbody>`;

    // При активном фильтре по полу "Место" должно быть местом ВНУТРИ этого
    // пола (пересчитанным, не абсолютным) — иначе абсолютный ранг (17, 20...)
    // выглядит так, будто места "не пересчитались" под фильтр.
    const mainRankKey = _gender === 'all' ? cfg.rankKey : cfg.rankGKey;
    rows.forEach(r => {
        const t = r[cfg.timeKey];
        const noTime = t == null;
        const rc = noTime ? '' : rankClass(r[mainRankKey]);
        html += `<tr class="${rc}${(noTime || r.status !== 'active') ? ' dnf' : ''}">
            <td>
                <span class="rank-num">${noTime ? '—' : (r[mainRankKey] ?? '—')}</span>
                ${!noTime && _gender === 'all' && r[cfg.rankGKey] != null ? `<span class="rank-sub">${genderBadge(r.gender)}${r[cfg.rankGKey]}</span>` : ''}
            </td>
            <td class="bib-cell">${r.bib}</td>
            <td class="name-main">${r.surname} ${r.name}</td>
            <td>${genderBadge(r.gender)}</td>
            <td class="r time-cell">${fmtTime(t)}</td>
            <td class="r muted">${fmtGap(gaps[r.bib])}</td>
            <td class="r muted">${noTime ? '—' : cfg.metaFn(r[cfg.metaKey])}</td>
            ${showStart ? `<td class="r muted">${fmtTime(r.bike2_start_s)}</td>` : ''}
            <td>${statusBadge(r, stage)}</td>
        </tr>`;
    });

    if (relayMembers.length > 0) {
        html += `<tr><td colspan="${colCount}" style="padding:6px 10px;background:var(--bg3);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Эстафеты</td></tr>`;
        let relayRank = 1;
        relayMembers.forEach(m => {
            const t = m[cfg.timeKey];
            const meta = cfg.metaFn(stage === 'swim' ? m.swim_pace : stage === 'bike1' ? m.bike1_speed : stage === 'bike2' ? m.bike2_speed : m.run_pace);
            const hasTime = t != null;
            const rankDisplay = hasTime ? relayRank : '—';
            if (hasTime) relayRank++;
            html += `<tr>
                <td><span class="rank-num">${rankDisplay}</span></td>
                <td class="bib-cell">${m._bib}</td>
                <td>
                    <span class="name-main">${m.surname} ${m.name}</span>
                    <br><span class="name-city">${m._team}</span>
                </td>
                <td>${genderBadge(m.gender)}</td>
                <td class="r time-cell">${fmtTime(t)}</td>
                <td class="r muted">${fmtGap(gaps[`${m._bib}:${m.relay_stage}`])}</td>
                <td class="r muted">${hasTime ? meta : '—'}</td>
                ${showStart ? `<td class="r muted">${fmtTime(m.bike2_start_s)}</td>` : ''}
                <td>${hasTime ? '<span class="badge badge-fin">Финишировал</span>' : '<span class="badge badge-live">В гонке</span>'}</td>
            </tr>`;
        });
    }

    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Render: Стартовый лист вело-2 ──────────────── */
function renderStartlist() {
    const { individual, relay } = getFiltered();

    let riders = [];
    if (_fmt !== 'relay') {
        riders = riders.concat(individual
            .filter(r => r.bike2_start_s != null)
            .map(r => ({ bib: r.bib, name: `${r.surname} ${r.name}`, city: r.city, gender: r.gender, start_s: r.bike2_start_s })));
    }
    if (_fmt !== 'individual') {
        relay.forEach(team => {
            team.members.filter(m => m.relay_stage === 'bike' && m.bike2_start_s != null).forEach(m => {
                riders.push({ bib: team.bib, name: `${m.surname} ${m.name}`, city: team.team_name, gender: m.gender, start_s: m.bike2_start_s });
            });
        });
    }
    riders.sort((a, b) => a.start_s - b.start_s);

    if (riders.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty">Стартовый лист вело-2 появится после финиша лидеров вело-1</div>';
        return;
    }

    let html = `<div class="section-hdr">Расчётный старт вело-2 (по рангу вело-1, топ-5 — интервал 3 мин, далее 1 мин)</div>`;
    html += `<div class="table-wrap"><table>
    <thead><tr><th>Ранг</th><th>№</th><th>Участник</th><th>Пол</th><th class="r">Старт вело-2</th></tr></thead><tbody>`;
    riders.forEach((r, i) => {
        html += `<tr>
            <td><span class="rank-num">${i + 1}</span></td>
            <td class="bib-cell">${r.bib}</td>
            <td>
                <span class="name-main">${r.name}</span>
                ${r.city ? `<br><span class="name-city">${r.city}</span>` : ''}
            </td>
            <td>${genderBadge(r.gender)}</td>
            <td class="r time-cell">${fmtTime(r.start_s)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('app').innerHTML = html;
}

/* ──────────────── Main render ──────────────── */
function render() {
    if (!_data) return;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    // Скрыть фильтр пола при выборе Эстафеты
    const genderGroup = document.getElementById('genderGroup');
    const genderLabel = document.getElementById('genderLabel');
    const hideGender = _fmt === 'relay';
    genderGroup.style.display = hideGender ? 'none' : '';
    genderLabel.style.display = hideGender ? 'none' : '';
    if (_tab === 'overall') renderOverall();
    else if (_tab === 'startlist') renderStartlist();
    else renderStage(_tab);
}

/* ──────────────── Data loading ──────────────── */
async function loadYear(year) {
    document.getElementById('loading').style.display = '';
    document.getElementById('app').style.display = 'none';
    try {
        const resp = await fetch(`/api/siberman/results?year=${year}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        _data = await resp.json();
        render();
    } catch(e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
    }
}

/* ──────────────── Event listeners ──────────────── */
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _tab = t.dataset.tab;
        render();
    });
});

document.querySelectorAll('[data-fmt]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-fmt]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _fmt = btn.dataset.fmt;
        if (_fmt === 'relay') {
            document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
            document.querySelector('[data-gender="all"]').classList.add('active');
            _gender = 'all';
        }
        render();
    });
});

document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        _gender = btn.dataset.gender;
        render();
    });
});

loadYear(2025);
</script>
