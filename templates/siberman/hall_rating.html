<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siberman — рейтинг</title>
<link rel="icon" href="/static/images/siberman/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/images/siberman/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/static/css/siberman-hall.css?v={{ v }}">
</head>
<body>
<div class="hall">
  <div class="tabs" id="tabs">
    <button type="button" class="tab active" data-tab="abs">Абсолют</button>
    <button type="button" class="tab" data-tab="men">Мужчины</button>
    <button type="button" class="tab" data-tab="women">Женщины</button>
    <button type="button" class="tab" data-tab="relay">Эстафеты</button>
  </div>
  <div class="bar">
    <span class="seg" id="mode"><button type="button" class="on" data-mode="all">Все финиши</button><button type="button" data-mode="best">Лучший на человека</button></span>
    <select id="year"><option value="">Все годы</option></select>
    <input id="q" class="search" type="search" aria-label="Поиск по фамилии или номеру" placeholder="Поиск по фамилии или номеру…" autocomplete="off">
  </div>
  <div class="tbl"><table id="table"><tr><td class="state-msg">Загрузка…</td></tr></table></div>
</div>
<script src="/static/js/siberman-hall.js?v={{ v }}"></script>
<script src="/static/js/siberman-hall-rating.js?v={{ v }}"></script>
</body>
</html>
